      - round: 8
        tool: record_thought
        title: Netanjahu muss nicht gewinnen, nur verhindern, dass ein anderer gewinnt
        core: Weil in Israel der Amtsinhaber bis zur Bildung einer neuen Regierung mit 61 Sitzen
          geschäftsführend im Amt bleibt, genügt es Netanjahu, eine Mehrheit ohne ihn zu
          blockieren – Wahlniederlage und Machtverlust fallen damit auseinander.
        type: unterscheidung
        paragraphs:
          - 9
          - 11
          - 16
          - 18
          - 19
          - 21
          - 22
          - 28
        evidence: "\"It's something between changing nothing and changing not very much.\" /
          \"he doesn't have to win. He just has to make sure that nobody else wins.\""
        note: Abgelegt als Gedanke 0. Lies weiter oder rufe done auf.
      - round: 9
        tool: record_thought
        title: Die Araber als Mehrheitsbeschaffer, die niemand zum Partner machen will
        core: Die arabischen Parteien sind als Mehrheitsbeschaffer unverzichtbar geworden,
          zugleich aber durch die Weigerung beider großen Blöcke, mit ihnen zu regieren,
          politisch blockiert – ihre Stimmen zählen und zählen doch nicht.
        type: unterscheidung
        paragraphs:
          - 14
          - 16
          - 17
          - 18
          - 23
          - 24
          - 25
        evidence: "\"The only coalition that's going to be able to govern has to include the
          Arab parties.\" / \"it's just about a non-starter because Eisencott and his
          allies have campaigned on a promise not to partner with the Arabs.\""
        note: Abgelegt als Gedanke 1. Lies weiter oder rufe done auf.
      - round: 10
        tool: record_thought
        title: Die Übergangszeit als Regierungsinstrument
        core: "Die geschäftsführende Regierungszeit ist keine Pause, sondern eine
          handlungsfähige Phase: Netanjahu kann Angriffe und Siedlungsbau fortsetzen und
          sogar Militärschläge als Mittel zur Wahlbeeinflussung einsetzen, während alle
          auf die Regierungsbildung warten."
        type: umkehrung
        paragraphs:
          - 19
          - 28
        interwoven_with:
          - 0
        evidence: "\"Leading a minority government, but it still allows him to bomb Gaza... the
          whole time. Nothing's going to change.\" / \"he now has weeks and weeks to
          keep trying that same move.\""
        note: Abgelegt als Gedanke 2. Lies weiter oder rufe done auf.
      - round: 11
        tool: record_thought
        title: "Die falschen Prognosen hatten eine gemeinsame Ursache: die übersehene
          Beteiligung der Armen"
        core: Der Wahlausgang in Brasilien wurde nicht durch Meinungsumfragen, Prognosemärkte
          oder Korrespondenten falsch vorhergesagt, sondern durch die unterschätzte
          Stimmbeteiligung der Ärmsten in den Favelas entschieden – die Fehlerquelle
          liegt in der Erwartungsbildung, nicht im Ergebnis.
        type: verbindung
        paragraphs:
          - 29
          - 36
        evidence: '"Everybody got this wrong, and it appears that they got it wrong because they
          underestimated the turnout among the poorest voters in the favelas"'
        note: Abgelegt als Gedanke 3. Lies weiter oder rufe done auf.
      - round: 12
        tool: record_thought
        title: Exil entwertet Oppositionsführung
        core: Wer als Oppositionsführer ins Ausland flieht, verliert die Führungsrolle, weil
          Anhänger darin Flucht statt Kampf sehen – die politische Familie ist damit
          erledigt, unabhängig von juristischen Verfahren.
        type: umkehrung
        paragraphs:
          - 31
          - 37
        evidence: "\"a lot of people are wondering whether Flavio Bolsonaro can continue to run
          the Brazilian opposition from Miami. Of course not... I think the Bolsonaro's
          as a political family are probably done.\""
        note: Abgelegt als Gedanke 4. Lies weiter oder rufe done auf.
      - round: 13
        tool: record_thought
        title: Die Wahlkampfroute als Geständnis
        core: "Die Route einer Wahlkampftournee lässt sich als Eingeständnis lesen: Wer die
          letzten Tage in tiefroten Staaten veranstaltet und den einzigen umkämpften
          Staat dem Vizepräsidenten überlässt, mobilisiert seine Basis statt um Stimmen
          zu werben – die Route selbst ist das Eingeständnis."
        type: ausdruck
        paragraphs:
          - 41
          - 43
          - 49
        evidence: "\"Every single stop but one is in a deep red state... And President Trump
          isn't even going to Michigan. Not at all.\""
        note: Abgelegt als Gedanke 5. Lies weiter oder rufe done auf.
      - round: 14
        tool: record_thought
        title: Frühwählerzahlen gegen Registrierungsverhältnis lesen
        core: "Frühwahlzahlen sind dann aussagekräftig, wenn man sie gegen die
          Parteiregistrierung liest: In Florida stimmen Demokraten trotz eines
          Rückstands von einer Million registrierter Wähler überproportional ab, was die
          strukturelle Unterlegenheit zeitweise umkehrt."
        type: verbindung
        paragraphs:
          - 44
          - 45
          - 46
          - 47
          - 48
        evidence: '"Florida has 4 million registered Democrats and more than 5 million
          registered Republicans. Republicans have an enormous advantage, and yet among
          the people who have already voted, Democrats are showing up in greater
          numbers"'
        note: Abgelegt als Gedanke 6. Lies weiter oder rufe done auf.
      - round: 15
        tool: record_thought
        title: Anonyme Quellen als Telefonspiel
        core: "Anonyme Quellen sind kein Beweis, sondern ein Telefonspiel: Eine Behauptung über
          Konten und Zeichnungsbefugnisse wird erst durch Dokumente überprüfbar, und die
          wiederholte Preisgabe eigener Quellen durch denselben Journalisten entwertet
          dessen anonyme Gewährsleute zusätzlich."
        type: unterscheidung
        paragraphs:
          - 55
          - 62
          - 63
          - 64
        evidence: "\"I know the difference between an allegation, a piece of intelligence and
          something you can actually prove... Show us something... that's not
          journalism. That's a game of telephone.\""
        note: Abgelegt als Gedanke 7. Lies weiter oder rufe done auf.
      - round: 16
        tool: record_thought
        title: Der UN-Saal ist nicht die USA
        core: Die Berufung auf amerikanisches Territorium im UN-Saal ist sachlich falsch, weil
          das UN-Hauptquartier internationales Gebiet ist – wer dort den nationalen
          Anspruch durchsetzt, verwechselt Souveränität mit Hausrecht.
        type: unterscheidung
        paragraphs:
          - 70
          - 71
          - 72
          - 76
        evidence: "\"Mike Waltz said repeatedly, this is the United States. No, actually, it's
          not. The United Nations is not the United States. It's international
          territory.\""
        note: Abgelegt als Gedanke 8. Lies weiter oder rufe done auf.
      - round: 17
        tool: record_thought
        title: Verschwundene Berichterstattung, fortgesetzter Krieg
        core: "Ein Konflikt, der aus den Schlagzeilen verschwindet, besteht weiter: Die
          Berichterstattung folgt der Aufmerksamkeitslage, die Angriffe folgen ihr
          nicht, weshalb ungefilterte Drohnenaufnahmen einen sonst verdeckten Krieg
          sichtbar machen."
        type: unterscheidung
        paragraphs:
          - 78
          - 79
        evidence: '"the coverage may have stopped on the Saudi-Houthi conflict... But the
          strikes, the Houthi strikes against Saudi Arabia have not stopped."'
        note: Abgelegt als Gedanke 9. Lies weiter oder rufe done auf.
      - round: 18
        tool: record_thought
        title: Zahlung statt Verteidigung als rationale Konfliktlösung
        core: "Schutzgeld ist eine funktionierende Konfliktlösung: Wenn ein zahlungswilliger
          Staat Angriffe billiger mit Geld als mit Verteidigung beendet und der
          Angreifer das Geld in Entwicklung stecken kann, ist die Zahlung für beide
          Seiten rational – wie der Präzedenzfall der Emirate zeigt."
        type: umkehrung
        paragraphs:
          - 81
          - 82
        evidence: "\"if you've got the money... just give them the money. And if I were the
          Houthis, I'd say take the money and use it to try to develop your country.\" /
          \"the Emiratis gave the Iranians as much as three billion dollars to stop
          bombing the Emirates and the Iranians stopped.\""
        note: Abgelegt als Gedanke 10. Lies weiter oder rufe done auf.
      - round: 19
        tool: done
        note: Lesen beendet.
