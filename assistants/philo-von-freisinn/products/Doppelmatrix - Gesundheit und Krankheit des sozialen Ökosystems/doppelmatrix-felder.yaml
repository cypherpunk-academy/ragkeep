  - id: dm-05g
    feld: 5
    richtung: "Wirtschaft -> Recht"
    pol: gesund
    titel: "Die Wirtschaft trägt den Staat"
    einwort: "Tragkraft"
    schlagsatz: >
      Ohne wirtschaftliche Grundlage hat kein Recht Bestand.
    these: >
      Die Wirtschaft stellt dem Rechtsleben die materiellen Mittel zur
      Verfügung, die es braucht, um seine Aufgaben zu erfüllen:
      Steuern, Infrastruktur, Verwaltung. Sie trägt den Staat, ohne
      ihn zu lenken.
    kurz_text: >
      Die Wirtschaft erzeugt die materiellen Grundlagen, auf denen das
      Rechtsleben aufbauen kann: Steuereinnahmen, Infrastruktur,
      Versorgung der öffentlichen Einrichtungen. Dieses Tragen ist
      eine Leistung der Brüderlichkeit — die Wirtschaft gibt, was der
      Staat braucht, ohne ihm dafür vorzuschreiben, was er tun soll.
    text: >
      Das Rechtsleben — Verwaltung, Justiz, Polizei, Parlament — kann
      nicht aus sich selbst heraus existieren. Es braucht Gebäude,
      Gehälter, Infrastruktur, kurz: wirtschaftliche Mittel. Die
      gesunde Beziehung besteht darin, dass die Wirtschaft diese Mittel
      bereitstellt, ohne dafür Gegenleistungen in Form von Einfluss
      zu erwarten. Steuern sind in dieser Perspektive nicht eine Last,
      die die Wirtschaft dem Staat widerwillig zahlt, sondern ein
      Ausdruck der Tatsache, dass wirtschaftliches Handeln nur in
      einem rechtlich geordneten Raum möglich ist. Die Wirtschaft
      trägt den Staat, wie der Boden den Baum trägt — nicht weil er
      bestimmen will, welche Früchte wachsen, sondern weil er die
      Nährstoffe liefert. Wo diese Beziehung gesund ist, finanziert
      die Wirtschaft das Gemeinwesen aus Einsicht in die gegenseitige
      Abhängigkeit, und der Staat verwendet die Mittel nach
      demokratisch gefundenen Prioritäten — ohne sich für jede
      Ausgabe bei der Wirtschaft rückversichern zu müssen.
    zitate:
      - text: "[Platzhalter — Steiner-Zitat zur wirtschaftlichen Grundlage des Staates]"
        quelle: "GA 23 / GA 340"
    beispiele:
      - "Steuersystem, das wirtschaftliche Leistungsfähigkeit fair abschöpft"
      - "Öffentliche Infrastruktur, finanziert aus Wirtschaftsleistung"
      - "Wirtschaftsunternehmen, die Gemeinwohlbeiträge als Selbstverständlichkeit betrachten"
    gegenpol: dm-05k
    leitprinzip: "Brüderlichkeit"
    eigene_mittel:
      - "Mittel"
      - "Leistung"
      - "Versorgung"
      - "Steuer"
    fremde_mittel: []
    aktualitaet: >
      Steuerflucht vs. Gemeinwohlverantwortung; Debatte um faire
      Unternehmensbesteuerung (OECD-Mindeststeuer).
    spannung: 3

  - id: dm-05k
    feld: 5
    richtung: "Wirtschaft -> Recht"
    pol: krank
    titel: "Das Geld kauft das Recht"
    einwort: "Korruption"
    schlagsatz: >
      Wenn Gesetze käuflich sind, schützen sie nur noch den Käufer.
    these: >
      Die Wirtschaft greift mit ihren eigenen Mitteln — Geld, ökonomischer
      Druck, Marktmacht — in das Rechtsleben ein und formt es nach ihren
      Interessen. Lobbyismus, Parteispenden, Drehtüreffekte: Das Recht
      wird zur Ware.
    kurz_text: >
      Wenn wirtschaftliche Macht den politischen Prozess bestimmt —
      durch Lobbyismus, Parteienfinanzierung, Personalkarusselle
      zwischen Konzernen und Ministerien —, dient das Recht nicht mehr
      der Gleichheit aller, sondern den Interessen derer, die zahlen.
      Das Gesetz schützt dann nicht mehr vor Übermacht, sondern
      sichert sie ab.
    text: >
      Der Übergriff der Wirtschaft auf das Recht ist eine der
      verbreitetsten Krankheitsformen des sozialen Organismus. Er
      beginnt, wo ökonomische Macht sich politischen Einfluss kauft:
      durch Parteispenden, die Erwartungen schaffen; durch Lobbyisten,
      die Gesetzestexte mitschreiben; durch Drehtürkarrieren, die die
      Grenze zwischen Regulierer und Reguliertem auflösen. Das
      Ergebnis sind Gesetze, die formal für alle gelten, aber
      materiell die Interessen der wirtschaftlich Mächtigsten
      bedienen. Steuerschlupflöcher, die nur Großkonzerne nutzen
      können; Regulierungen, die kleine Wettbewerber aus dem Markt
      drängen; Handelsabkommen, die hinter verschlossenen Türen mit
      Industrievertretern ausgehandelt werden — all das sind Symptome
      desselben Übergriffs. Der entscheidende Punkt ist: Das Geld
      wirkt hier nicht als wirtschaftliches Mittel (Versorgung,
      Leistung), sondern als Machtmittel — es kauft, was nicht
      käuflich sein dürfte. Und weil das Recht auf dem Prinzip
      der Gleichheit aller beruht, zerstört jeder Kauf eines Gesetzes
      die Grundlage, auf der das Rechtsleben steht.
    zitate:
      - text: "[Platzhalter — Steiner-Zitat zu Geld und Recht/Staat]"
        quelle: "GA 23 / GA 340"
    beispiele:
      - "Lobbyismus: Industrieverbände schreiben an Gesetzestexten mit"
      - "Drehtüreffekte zwischen Konzernen und Ministerien"
      - "Parteispenden mit impliziter Gegenleistungserwartung"
      - "Steuergesetzgebung, die systematisch Großvermögen begünstigt"
    gegenpol: dm-05g
    leitprinzip: "Brüderlichkeit (pervertiert)"
    eigene_mittel: []
    fremde_mittel:
      - "Geld"
      - "Marktmacht"
      - "Ökonomischer Druck"
    aktualitaet: >
      Lobbyregister-Debatten, Cum-Ex-Skandal, Plattformkonzerne als
      Quasi-Regulierer, Big-Tech-Lobbying gegen Kartellrecht.
    spannung: 5

  # ══════════════════════════════════════════════════════════════════════
  # FELD 6 — WIRTSCHAFT → GEIST
  # ══════════════════════════════════════════════════════════════════════

  - id: dm-06g
    feld: 6
    richtung: "Wirtschaft -> Geist"
    pol: gesund
    titel: "Die Wirtschaft versorgt den Geist"
    einwort: "Versorgung"
    schlagsatz: >
      Wer den Geist ernährt, erntet Früchte, die er sich nicht vorstellen konnte.
    these: >
      Die Wirtschaft stellt dem Geistesleben die materiellen Grundlagen
      zur Verfügung — Räume, Mittel, Lebensunterhalt für Lehrende und
      Forschende — ohne dafür inhaltliche Gegenleistung zu verlangen.
      Versorgung ohne Bedingung ist das Prinzip.
    kurz_text: >
      Die Wirtschaft ernährt das Geistesleben im wörtlichen Sinn: Sie
      stellt Mittel bereit, damit Lehrer, Forscher, Künstler und
      Therapeuten ihrer Arbeit nachgehen können. Diese Versorgung ist
      am fruchtbarsten, wenn sie ohne inhaltliche Bedingungen geschieht —
      wer bestellt, bekommt Auftragsarbeit, nicht freie Forschung.
    text: >
      Das Geistesleben braucht materielle Grundlagen: Schulgebäude,
      Laboratorien, Ateliers, Bibliotheken, und vor allem den
      Lebensunterhalt derjenigen, die geistig arbeiten. Die Wirtschaft
      kann diese Grundlagen bereitstellen — und tut es am gesündesten,
      wenn sie dabei keine inhaltlichen Bedingungen stellt. Schenkungsgeld
      — Geld, das gegeben wird, ohne eine bestimmte Gegenleistung zu
      erwarten — ist die dem Geistesleben angemessene Finanzierungsform.
      Stiftungen, Mäzenatentum und freie Schulgeldmodelle sind
      Erscheinungsformen dieses Prinzips. Der Wirtschaftende erkennt:
      Die Früchte des Geisteslebens — Erfindungen, Fähigkeiten,
      Heilmethoden, Erziehungskunst — kommen am Ende auch der Wirtschaft
      zugute, aber nur, wenn sie in Freiheit entstanden sind. Wer einen
      Apfelbaum pflanzt, bestimmt nicht, welchen Apfel er trägt. Wer
      das Geistesleben versorgt, ohne zu bestimmen, erhält mehr, als
      er sich hätte ausdenken können. Das setzt eine Haltung voraus,
      die über die unmittelbare Nützlichkeitsrechnung hinausgeht —
      es ist Brüderlichkeit im präzisen Sinn.
    zitate:
      - text: "[Platzhalter — Steiner-Zitat zu Schenkungsgeld und Geistesleben]"
        quelle: "GA 23 / GA 340"
    beispiele:
      - "Freie Schulträger, finanziert durch Elternbeiträge und Stiftungen"
      - "Mäzenatentum ohne inhaltliche Vorgaben"
      - "Open-Source-Förderung: Unternehmen finanzieren freie Software"
    gegenpol: dm-06k
    leitprinzip: "Brüderlichkeit"
    eigene_mittel:
      - "Versorgung"
      - "Mittel"
      - "Schenkung"
    fremde_mittel: []
    aktualitaet: >
      Debatte um Grundfinanzierung vs. Drittmittelabhängigkeit an
      Hochschulen; Open-Source-Geschäftsmodelle.
    spannung: 4

  - id: dm-06k
    feld: 6
    richtung: "Wirtschaft -> Geist"
    pol: krank
    titel: "Der Profit kauft die Wahrheit"
    einwort: "Käuflichkeit"
    schlagsatz: >
      Wer die Forschung bezahlt, bestimmt das Ergebnis.
    these: >
      Die Wirtschaft finanziert das Geistesleben nicht mehr
      bedingungslos, sondern kauft Ergebnisse: Auftragsforschung,
      Sponsoring mit Auflagen, Medienbesitz. Die Wahrheit wird zur
      Ware, die Bildung zum Produkt, die Kunst zur Werbung.
    kurz_text: >
      Wenn wirtschaftliche Interessen bestimmen, was geforscht, gelehrt
      und berichtet wird, verliert das Geistesleben seine Unabhängigkeit.
      Auftragsforschung liefert bestellte Ergebnisse, gesponserte Medien
      berichten im Sinne ihrer Geldgeber, und Bildung wird zum
      Arbeitsmarktprodukt statt zur Persönlichkeitsentfaltung.
    text: >
      Der Übergriff der Wirtschaft auf das Geistesleben ist im
      21. Jahrhundert vielleicht die verbreitetste Krankheitsform.
      Er zeigt sich überall dort, wo Geld nicht versorgt, sondern
      kauft: wo Pharmakonzerne klinische Studien finanzieren und die
      Veröffentlichung ungünstiger Ergebnisse verhindern; wo
      Medienkonzerne Redaktionen besitzen und die Berichterstattung an
      Geschäftsinteressen ausrichten; wo Unternehmen Universitäten
      Lehrstühle stiften und dafür Einfluss auf Forschungsthemen
      nehmen; wo Bildung so auf den Arbeitsmarkt zugeschnitten wird,
      dass Persönlichkeitsentfaltung als Luxus gilt. Die Pointe: In
      all diesen Fällen wird ein wirtschaftliches Mittel (Geld) für
      einen geistigen Zweck eingesetzt — aber nicht als bedingungslose
      Versorgung, sondern als Kaufpreis für ein bestimmtes Ergebnis.
      Die Wahrheit, die so entsteht, ist keine — sie ist ein Produkt.
      Und eine Bildung, die nur Arbeitskräfte hervorbringt, bildet
      nicht — sie richtet zu. Das Geistesleben verliert seine
      Fruchtbarkeit, weil es nicht mehr frei ist, das Unerwartete zu
      finden — es darf nur noch das Bestellte liefern.
    zitate:
      - text: "[Platzhalter — Steiner-Zitat zu Profit und Geistesleben]"
        quelle: "GA 23 / GA 24"
    beispiele:
      - "Pharma-finanzierte Studien mit selektiver Veröffentlichung"
      - "Medienkonzerne, deren Berichterstattung Geschäftsinteressen folgt"
      - "Universitäre Drittmittelforschung mit Ergebnisvorgaben"
      - "Bildung als reines Arbeitsmarktprodukt (Employability statt Bildung)"
    gegenpol: dm-06g
    leitprinzip: "Brüderlichkeit (pervertiert)"
    eigene_mittel: []
    fremde_mittel:
      - "Profit"
      - "Kaufpreis"
      - "Marktdruck"
    aktualitaet: >
      Drittmittelabhängigkeit der Wissenschaft, Medienkonzentration,
      EdTech als Bildungsmarkt, KI-Modelle trainiert von Konzernen.
    spannung: 5

  # ══════════════════════════════════════════════════════════════════════
  # FELD 7 — GEIST + RECHT → WIRTSCHAFT
  # ══════════════════════════════════════════════════════════════════════

  - id: dm-07g
    feld: 7
    richtung: "Geist + Recht -> Wirtschaft"
    pol: gesund
    titel: "Bildung und Rahmen ermöglichen das Wirtschaften"
    einwort: "Ermöglichung"
    schlagsatz: >
      Wenn Wissen und Recht zusammenwirken, kann die Wirtschaft dienen statt herrschen.
    these: >
      Geistesleben und Rechtsleben wirken gemeinsam auf die Wirtschaft
      ein — jedes mit seinen eigenen Mitteln: das Geistesleben mit
      Fähigkeiten und Einsicht, das Rechtsleben mit Rahmen und Schutz.
      Zusammen ermöglichen sie eine Wirtschaft, die wirkliche
      Bedürfnisse befriedigt.
    kurz_text: >
      Wenn gebildete, urteilsfähige Menschen in einem fairen rechtlichen
      Rahmen wirtschaften, entsteht eine Ökonomie, die dem Menschen
      dient. Das Geistesleben liefert Fähigkeiten und Bedürfnisklarheit,
      das Rechtsleben sichert die Spielregeln — die Wirtschaft kann sich
      auf das konzentrieren, was sie am besten kann: versorgen.
    text: >
      Die Doppelwirkung von Geist und Recht auf die Wirtschaft ist der
      anspruchsvollste gesunde Zustand. Er verlangt, dass zwei Sphären
      gleichzeitig aus ihrer eigenen Mitte heraus wirken, ohne sich
      gegenseitig zu behindern und ohne die dritte zu beherrschen.
      Konkret: Das Geistesleben bringt Fähigkeiten, Erfindungen,
      Bedürfniskenntnis und ethische Orientierung hervor. Das
      Rechtsleben sorgt für den Rahmen, in dem wirtschaftliche
      Initiative sich entfalten kann, ohne andere zu schädigen. Wenn
      beides zusammenkommt, entsteht ein Wirtschaftsleben, das weder
      von Ignoranz (fehlendes Geistesleben) noch von Willkür
      (fehlendes Recht) noch von Überregulierung (Recht als
      Ersatzwirtschaft) geprägt ist. Die Assoziation — das
      Zusammenwirken von Erzeugern, Händlern und Verbrauchern — kann
      dann ihre Funktion erfüllen: den gerechten Preis finden, die
      wirklichen Bedürfnisse bedienen und die Produktion so lenken,
      dass sie dem Ganzen dient. Dieses Zusammenwirken ist kein
      Automatismus, sondern eine Kulturfrage: Es braucht Menschen, die
      sowohl urteilsfähig als auch regelkundig sind.
    zitate:
      - text: "[Platzhalter — Steiner-Zitat zu Assoziation und Zusammenwirken]"
        quelle: "GA 23 / GA 340"
    beispiele:
      - "Assoziative Preisbildung: Erzeuger, Händler und Verbraucher verhandeln gemeinsam"
      - "Berufsausbildung (Geist) + Arbeitsrecht (Recht) = fähige und geschützte Arbeitskräfte"
      - "Genossenschaftswesen: wirtschaftliche Selbstverwaltung in rechtlichem Rahmen"
    gegenpol: dm-07k
    leitprinzip: "Freiheit + Gleichheit"
    eigene_mittel:
      - "Fähigkeit"
      - "Einsicht"
      - "Gesetz"
      - "Rahmen"
    fremde_mittel: []
    aktualitaet: >
      Genossenschaftsrenaissance, Gemeinwohlökonomie, Fair-Trade-Bewegung
      als Ansätze assoziativen Wirtschaftens.
    spannung: 4

  - id: dm-07k
    feld: 7
    richtung: "Geist + Recht -> Wirtschaft"
    pol: krank
    titel: "Idee und Staat befehlen der Produktion"
    einwort: "Kommandowirtschaft"
    schlagsatz: >
      Wenn Doktrin und Dekret gemeinsam regieren, bleibt für den Bedarf kein Platz.
    these: >
      Ideologie und Staatsgewalt vereinigen sich, um der Wirtschaft
      vorzuschreiben, was und wie sie zu produzieren hat. Die
      Kommandowirtschaft ist das Extrem — aber auch demokratische
      Varianten sind möglich, wenn moralischer Druck und
      Regulierungswut zusammenfallen.
    kurz_text: >
      Wenn eine Ideologie die staatliche Gewalt hinter sich hat, wird
      die Wirtschaft zum bloßen Vollzugsorgan. Die Produktion folgt
      nicht mehr dem Bedarf, sondern dem Plan. Was nicht ins Weltbild
      passt, wird verboten; was hineinpasst, wird subventioniert — der
      Markt als Informationssystem fällt aus.
    text: >
      Dies ist die verschärfte Form der Felder 2 (Dogma diktiert
      Produktion) und 4 (Gewalt setzt Preis): Hier wirken Ideologie
      und Staat gemeinsam. Die sowjetische Planwirtschaft ist das
      offensichtlichste Beispiel — eine Parteiideologie verbunden mit
      der vollen Staatsgewalt bestimmte über Jahrzehnte, was
      produziert wurde, zu welchem Preis, in welcher Menge. Das
      Ergebnis war eine Wirtschaft, die Panzer bauen konnte, aber
      keine Schuhe. Doch das Muster ist nicht auf autoritäre Regime
      beschränkt. Auch in Demokratien kann die Kombination aus
      moralischer Überzeugung und regulatorischem Eifer dazu führen,
      dass die Wirtschaft nicht mehr auf Bedürfnisse reagiert, sondern
      auf ideologische Vorgaben. Der Unterschied zum gesunden
      Zusammenwirken (dm-07g) liegt im Mittel: Dort wirken Einsicht
      und Rahmen, hier wirken Doktrin und Zwang. Dort bleibt die
      Wirtschaft Subjekt ihres Handelns, hier wird sie zum Objekt
      zweier übergriffiger Sphären.
    zitate:
      - text: "[Platzhalter — Steiner-Zitat zu Kommandowirtschaft]"
        quelle: "GA 23 / GA 24"
    beispiele:
      - "Sowjetische Fünfjahrespläne: Ideologie + Staat = Planwirtschaft"
      - "Kriegswirtschaft: Staatsräson und nationale Ideologie steuern die Produktion"
      - "Ideologisch motivierte Regulierungswellen, die ganze Branchen eliminieren"
    gegenpol: dm-07g
    leitprinzip: "Freiheit + Gleichheit (beide missbraucht)"
    eigene_mittel: []
    fremde_mittel:
      - "Doktrin"
      - "Dekret"
      - "Planvorgabe"
      - "Zwang"
    aktualitaet: >
      Technologieverbote aus geopolitisch-ideologischen Gründen,
      Subventionswettläufe als neue Industriepolitik.
    spannung: 5

  # ══════════════════════════════════════════════════════════════════════
  # FELD 8 — GEIST + WIRTSCHAFT → RECHT
  # ══════════════════════════════════════════════════════════════════════

  - id: dm-08g
    feld: 8
    richtung: "Geist + Wirtschaft -> Recht"
    pol: gesund
    titel: "Einsicht und Mittel tragen den Staat"
    einwort: "Grundlegung"
    schlagsatz: >
      Das Recht steht auf zwei Beinen — Erkenntnis und Leistungskraft.
    these: >
      Geistesleben und Wirtschaft wirken gemeinsam auf das Rechtsleben
      ein, jedes mit seinen eigenen Mitteln: das Geistesleben mit
      Sachkenntnis und Urteil, die Wirtschaft mit materiellen Mitteln.
      Zusammen bilden sie das Fundament, auf dem der Staat stehen kann.
    kurz_text: >
      Wenn das Geistesleben dem Staat Sachkenntnis liefert und die
      Wirtschaft ihm die materiellen Grundlagen bereitstellt — jeweils
      ohne inhaltliche Bedingungen —, steht das Rechtsleben auf einem
      doppelten Fundament aus Erkenntnis und Leistungskraft. Es kann
      dann seinen eigentlichen Auftrag erfüllen: gleiche Rechte für alle.
    text: >
      Das Rechtsleben kann aus sich selbst heraus weder Erkenntnis
      erzeugen noch materielle Mittel. Es braucht beides von außen —
      und die Frage ist, ob es dieses Außen als Stütze erhält oder
      als Fessel. Im gesunden Fall wirken Geistesleben und Wirtschaft
      als zwei unabhängige Quellen: Die eine liefert Urteilsfähigkeit,
      die andere Leistungskraft. Sachverständige beraten den
      Gesetzgeber, ohne ihm vorzuschreiben. Die Wirtschaft finanziert
      den Staat durch Steuern, ohne dafür Einfluss zu kaufen. Beide
      tragen den Staat — wie zwei Säulen ein Dach tragen, ohne das Dach
      zu sein. Die Schwierigkeit dieses Feldes liegt darin, dass die
      Grenze zwischen Stütze und Einflussnahme schmal ist. Ein
      Sachverständiger, der nicht nur berät, sondern bestimmt, hat die
      Grenze überschritten. Ein Steuerzahler, der für seine Steuern
      politische Gegenleistung erwartet, hat die Grenze überschritten.
      Gesundes Tragen heißt: geben, ohne zu bestimmen.
    zitate:
      - text: "[Platzhalter — Steiner-Zitat zu den Grundlagen des Rechtslebens]"
        quelle: "GA 23"
    beispiele:
      - "Sachverständige beraten den Gesetzgeber, Wirtschaft finanziert Verwaltung — beides ohne Gegenleistungserwartung"
      - "Bürgerliche Steuerpflicht als solidarischer Beitrag, nicht als Kaufpreis für Einfluss"
      - "Unabhängige Medien und finanziell gesicherter Staat als doppelte demokratische Grundlage"
    gegenpol: dm-08k
    leitprinzip: "Freiheit + Brüderlichkeit"
    eigene_mittel:
      - "Sachkenntnis"
      - "Urteil"
      - "Mittel"
      - "Leistung"
    fremde_mittel: []
    aktualitaet: >
      Verhältnis von Wissenschaft und Politik; Steuergerechtigkeit als
      Voraussetzung eines handlungsfähigen Staates.
    spannung: 3

  - id: dm-08k
    feld: 8
    richtung: "Geist + Wirtschaft -> Recht"
    pol: krank
    titel: "Lehre und Kapital schreiben das Gesetz"
    einwort: "Oligarchie"
    schlagsatz: >
      Wenn Experten und Geldgeber gemeinsam regieren, braucht es keine Wahl mehr.
    these: >
      Ideologie und Wirtschaftsmacht vereinigen sich, um das Recht nach
      ihren Interessen zu formen. Think Tanks, die von Konzernen
      finanziert werden, schreiben Gesetzesentwürfe; Expertengremien
      mit wirtschaftlicher Rückendeckung setzen sich über demokratische
      Prozesse hinweg.
    kurz_text: >
      Wenn eine bestimmte Lehre — ökonomisch, technologisch oder
      weltanschaulich — mit wirtschaftlicher Macht verbunden ist, kann
      sie den demokratischen Prozess aushebeln. Gesetze entstehen dann
      nicht im Parlament, sondern in Think Tanks, deren Agenda von
      denen bestimmt wird, die sie finanzieren.
    text: >
      Dies ist die verschärfte Form der Felder 1k (Glaube wird Gesetz)
      und 5k (Geld kauft Recht): Hier wirken Ideologie und Kapital
      gemeinsam auf das Recht ein. Das Ergebnis ist eine Form der
      Oligarchie, die sich demokratisch verkleidet. Think Tanks, die
      von Konzernen finanziert werden, erzeugen „Sachkenntnis", die
      zufällig den Interessen der Geldgeber dient. Lobbyorganisationen
      geben sich als zivilgesellschaftliche Akteure aus, während sie
      wirtschaftliche Interessen vertreten. Rating-Agenturen bewerten
      Staaten nach Kriterien, die sie selbst definieren, und erzwingen
      damit Gesetze — ohne jemals gewählt worden zu sein. Der
      Mechanismus ist doppelt wirksam, weil er sich auf zwei Quellen
      der Legitimität berufen kann: die Autorität des Wissens und
      die Autorität des Geldes. Gegen beides anzukämpfen überfordert
      den demokratischen Prozess — und genau das ist der Punkt. Die
      Verschmelzung von Doktrin und Kapital erzeugt eine Macht, die
      das Recht nicht mehr kontrollieren kann, weil sie seine Grundlagen
      von beiden Seiten gleichzeitig untergräbt.
    zitate:
      - text: "[Platzhalter — Steiner-Zitat zu Oligarchie/Plutokratie]"
        quelle: "GA 23 / GA 24"
    beispiele:
      - "Konzernfinanzierte Think Tanks schreiben Gesetzesentwürfe"
      - "Rating-Agenturen erzwingen Austeritätspolitik ohne demokratische Legitimation"
      - "Tech-Konzerne setzen Standards, die faktisch zu Gesetzen werden (Quasi-Regulierung)"
      - "Lobbyverbände mit wissenschaftlichem Anstrich"
    gegenpol: dm-08g
    leitprinzip: "Freiheit + Brüderlichkeit (beide pervertiert)"
    eigene_mittel: []
    fremde_mittel:
