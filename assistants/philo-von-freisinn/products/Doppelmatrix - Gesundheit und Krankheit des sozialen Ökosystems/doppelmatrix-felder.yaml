  - id: dm-04k
    feld: 4
    richtung: "Recht -> Wirtschaft"
    pol: krank
    titel: "Die Gewalt setzt den Preis"
    einwort: "Planwirtschaft"
    schlagsatz: >
      Wo der Staat den Preis macht, verschwindet der Bedarf aus der Rechnung.
    these: >
      Der Staat greift über den Rahmen hinaus und bestimmt selbst
      Preise, Produktionsmengen, Handelspartner oder Löhne. Das Recht
      wird zum wirtschaftlichen Akteur — mit den Mitteln der Gewalt
      statt der Assoziation.
    kurz_text: >
      Wenn der Staat nicht nur Grenzen setzt, sondern selbst
      wirtschaftliche Entscheidungen trifft — Preise festlegt,
      Produktionsziele vorgibt, Handelspartner bestimmt —, ersetzt
      politische Gewalt die wirtschaftliche Urteilskraft. Der Preis
      spiegelt dann nicht den Bedarf, sondern den Willen der Macht.
    text: >
      Der Übergriff des Rechtslebens auf die Wirtschaft zeigt sich,
      wo der Staat nicht mehr den Rahmen setzt, sondern selbst
      wirtschaftet — mit Mitteln, die ihm als Staat zur Verfügung
      stehen: Zwang, Verordnung, Gewaltandrohung. Preisfestsetzung
      durch den Staat ist das offensichtlichste Symptom: Ein Preis,
      der nicht aus dem Zusammenspiel von Bedarf, Fähigkeit und
      Verfügbarkeit entsteht, sondern dekretiert wird, verliert seine
      Informationsfunktion. Er sagt nicht mehr, was gebraucht wird
      und was es kostet, sondern was die Macht will. Ähnlich bei
      Subventionen, die nicht als Überbrückung, sondern als
      Dauereingriff angelegt sind: Sie halten Strukturen am Leben,
      die kein Bedürfnis mehr trägt. Verstaatlichung ganzer
      Wirtschaftszweige führt dazu, dass Beamte Unternehmer spielen —
      mit dem Ergebnis, dass weder gutes Recht noch gute Wirtschaft
      entsteht. Der entscheidende Punkt: Nicht jede Regulierung ist
      ein Übergriff. Der Übergriff beginnt dort, wo der Staat mit
      Gewaltmitteln wirtschaftliche Entscheidungen trifft, die nur
      durch assoziative Urteilsbildung — also im Zusammenwirken von
      Erzeugern, Händlern und Verbrauchern — getroffen werden könnten.
    zitate:
      - text: "[Platzhalter — Steiner-Zitat zu Staat und Preisbildung]"
        quelle: "GA 23 / GA 340"
    beispiele:
      - "Staatliche Preisfestsetzung (Mietpreisbremse, Mindestlohn als Höchstlohn von oben)"
      - "Dauersubventionen für nicht mehr bedarfsgerechte Industrien"
      - "Verstaatlichung mit Beamten als Unternehmern"
      - "Exportverbote und Importzwang aus geopolitischen statt wirtschaftlichen Gründen"
    gegenpol: dm-04g
    leitprinzip: "Gleichheit (missbraucht)"
    eigene_mittel: []
    fremde_mittel:
      - "Gewalt"
      - "Verordnung"
      - "Dekret"
    aktualitaet: >
      Debatte um Industriepolitik, Subventionswettläufe (Chips Act,
      IRA), Sanktionsregime als Wirtschaftswaffe.
    spannung: 5

