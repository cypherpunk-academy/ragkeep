  - id: dm-02g
    feld: 2
    richtung: "Geist -> Wirtschaft"
    pol: gesund
    titel: "Fähigkeiten befruchten die Wirtschaft"
    aspekte:
      - schlagwort: Bedürfnisse
        schlagsatz: Das Bedürfnis ist der Anfang — und kommt nicht aus der Wirtschaft.
        text: >
          Bedürfnisse haben eine doppelte Wurzel. Die natürlichen sind jedem gegeben: Essen, Trinken, ein Dach über dem Kopf. Darüber hinaus entstehen sie aus Bildung, Lebenserfahrung und kultureller Entwicklung. Ein gesundes Geistesleben befähigt Menschen, ihre wirklichen Bedürfnisse zu erkennen und auszusprechen – Urteilskraft ist auch Konsumreife. In der Erzeuger-Verwender-Gemeinschaft sprechen die Verwender aus ihrer Kultursphäre, und diese Artikulation ist der Anfang des Wirtschaftsprozesses. Eine Wirtschaft kann nur so gut versorgen, wie ihr Bedürfnisse entgegenkommen. Sie muss die elementaren Bedürfnisse befriedigen, aber auch offen sein für das, was aus der Freiheit des Geisteslebens kommt. Ein Geistesleben, das schweigt, überlässt der Wirtschaft die Bedürfnisdefinition – dann erzeugt der Erzeuger auch das Bedürfnis nach der Ware. Das gesunde Geistesleben spricht zuerst.
        zitate: []
      - schlagwort: Ideen
        schlagsatz: Die Idee befeuert die Produktion — nicht Gewinn, nicht Zwang.
        text: >
          Der schöpferische Einfall gibt der Arbeit ihren Inhalt und ihr Ziel. Der Geist wirkt mit seinen ureigenen Mitteln: Einsicht, Erfindung, Sachkenntnis, Urteilskraft. Er befiehlt nicht, er bietet an – und die Wirtschaft nimmt an, weil die Idee trägt, nicht weil jemand sie verordnet hat. So entsteht Wert in seiner richtigen Reihenfolge: Das Naturprodukt wird durch Arbeit wertvoll, das Arbeitsprodukt durch den Geist, der die Arbeit ordnet. Erst diese geistige Organisation löst den Wert von der Natur und macht ihn zu etwas Eigenständigem. Der entscheidende Punkt ist das freie Angebot.
        zitate: []
      - schlagwort: Kapital
        schlagsatz: Kapital ist geronnener Geist.
        text: >
          Die Idee überzeugt durch ihre Qualität, nicht durch Macht. Sie setzt sich durch, weil sie sachlich trägt und sich in der Praxis bewährt – nicht weil jemand sie verordnet. Hier liegt die eigentliche Quelle des Wertes: nicht im Zwang, nicht in der Verfügung über Menschen, sondern in der Einsicht, die sich frei anbietet und aus eigener Kraft überzeugt. Kapital ist in diesem Sinn geronnener Geist. Es ist nichts anderes als die materielle Form früherer geistiger Leistungen – Erfindungen, Organisationsideen, technisches Wissen. Deshalb ist Kapital nur so fruchtbar wie die Ideen, die es leiten. Es wirkt nicht aus sich selbst, sondern immer nur durch den Geist, der es in Bewegung setzt und ihm eine Richtung gibt. Ohne schöpferischen Geist wird Kapital zur toten Masse, die nichts hervorbringt, weil ihr die lebendige Kraft fehlt, die Werte erst entstehen lässt. Wert entsteht nicht aus Arbeit allein, sondern aus der Verbindung von Arbeit und Geist. Die Arbeit ist das ausführende Element, der Geist das führende. Er gibt der Arbeit ihr Ziel, ihre Ordnung und ihre Gestalt. Wo der Geist fehlt, bleibt Arbeit blinde Mühe. Wo er wirkt, wird aus Mühe Schöpfung.
        zitate: []
      - schlagwort: Materialisierung
        schlagsatz: Der Gedanke vermehrt sich beim Teilen — das Brot nicht.
        text: >
          Wer einen Gedanken weitergibt, hat ihn immer noch. Damit steht er außerhalb der Wirtschaft. Er tritt in sie ein, sobald er sich materialisiert: sobald er Stoff, Arbeitszeit und Werkzeuge bindet, die es nur einmal gibt. Materiell heißt dabei nicht nur stofflich — auch die Stunde, in der jemand arbeitet, und die Maschine, die währenddessen läuft, sind endlich. Und was endlich ist, muss verteilt werden. Hier liegt der Grund für Brüderlichkeit: Sie ist keine moralische Zugabe zum Wirtschaften, sondern dessen Bedingung. Wo etwas für alle gleichzeitig da ist, braucht es sie nicht. An dieser Schwelle gibt der Geist zugleich etwas ab. Was materialisiert ist, gehört nicht mehr dem Urheber, sondern dem Bedarf. Was diesseits bleibt — Unterricht, Forschung, Rat — wird nie Ware, auch wenn es bezahlt wird; es lebt aus Schenkung, nicht aus Tausch.
        zitate: []
      - schlagwort: Überblick
        schlagsatz: Wer das Ganze übersieht, arbeitet für andere.
        text: >
          Brüderlichkeit lässt sich nicht verordnen und nicht anappellieren; sie setzt voraus, dass jemand den Zusammenhang durchschaut, in dem er steht. Wer nur seinen Handgriff kennt, kann gar nicht anders, als für seinen Lohn zu arbeiten. Wer sieht, wessen Bedarf am Ende seiner Arbeit steht, arbeitet für diesen Bedarf — nicht aus Opferbereitschaft, sondern weil es die sachlich richtige Handlung ist. Diesen Überblick liefert kein Wirtschaftsprozess von selbst; er kommt aus dem Geistesleben, oder er kommt nicht. Hier liegt der Grund, warum eine Wirtschaft ohne freies Geistesleben moralisch predigen muss, was sie nicht erzeugen kann.
        zitate: []
      - schlagwort: Aufgaben
        schlagsatz: Fähigkeit trifft Aufgabe — besetzt nach Können, nicht nach Rang oder Ausbildung.
        text: >
          Ein freies Geistesleben entdeckt und pflegt die Fähigkeiten jedes Einzelnen, es findet den richtigen Platz für ihn. Die Wirtschaft darf nicht nach Belieben Menschen an ihren Arbeitsplatz schicken, sie würde über ihren Egoismus, wegen Konkurrenzdenken oder Beziehungen, Menschen anziehen, deren bester Platz, da wo sie ihre Fähigkeiten am besten entfalten können, anderswo ist. Die Wirtschaft gestaltet die Arbeitsplätze so, dass sich die Fähigkeiten von den Menschen, die sich dort einfinden, entfalten können. Sie stellt die vorhandenen Aufgaben dar, aber bestimmt nicht, was die einzelnen Menschen tun. Es ist ein Aufgaben-Buffet (Issue-Liste), von der sich Menschen bedienen können. Wer sich einer Aufgabe zuwendet, übernimmt damit aber auch die Verantwortung für ihre Ausführung – die Wahl ist frei, die Bindung an das Gewählte ist es nicht. Open Source ist der Beweis: Menschen leisten ihre beste Arbeit, wenn sie selbst bestimmen, woran sie arbeiten.
        zitate: []
      - schlagwort: Korrektur
        schlagsatz: Pull Request statt Beschwerde — Kritik als Gabe.
        text: > 
          Wer einen Fehler findest oder eine Verbesserungsmöglichkeit sieht, reicht einen 
          konkreten Vorschlag ein, offen einsehbar für alle. Kein Jammern, 
          kein Appell an Vorgesetzte — denn der Appell nach oben holt ein 
          fremdes Mittel herein, er sucht Macht statt Einsicht. Kritik ist 
          hier keine Anklage, sondern eine Gabe: Sie fügt der Sache etwas 
          hinzu, das ihr fehlte. Das setzt Urteilsbildung voraus, und es 
          setzt eine Kultur voraus, in der ein Einwand nichts kostet. 
          Damit bleibt der ganze Kreis in Bewegung — denn jede angenommene 
          Korrektur ist ein neu ausgesprochenes Bedürfnis, und dort, beim 
          Bedürfnis, beginnt der Prozess wieder von vorn.
        zitate: []

