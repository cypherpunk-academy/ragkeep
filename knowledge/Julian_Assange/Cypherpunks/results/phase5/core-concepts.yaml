leitgedanke:
  text: Weil die scheinbar freie Netzwelt auf kontrollierbaren Infrastrukturen und einem privat-staatlichen Überwachungsverbund beruht, lässt sich Freiheit nur durch Kryptografie, Transparenz und offene, demokratisch prüfbare Technik gegen die Zentralisierung von Macht behaupten.
  rationale: Die Kapitel zeigen, dass das Netz auf kontrollierbaren Infrastrukturen ruht, Überwachung und Zensur zunehmend vorsorglich und privat-staatlich organisiert sind und Kryptografie, Transparenz sowie offener Code als Gegenmittel dienen. Daraus folgt die politische These, dass Freiheit im Netz nicht natürlich gegeben ist, sondern gegen zentralisierte Macht verteidigt und technisch abgesichert werden muss.
digest:
  leitgedanke: Weil die scheinbar freie Netzwelt auf kontrollierbaren Infrastrukturen und einem privat-staatlichen Überwachungsverbund beruht, lässt sich Freiheit nur durch Kryptografie, Transparenz und offene, demokratisch prüfbare Technik gegen die Zentralisierung von Macht behaupten.
  kernaussagen:
    - id: K1
      satz: Das Internet ist kein körperloser Ideenraum, sondern ruht auf physischen und industriellen Infrastrukturen; wer Kabel, Server, Rechenressourcen und zentrale Dienste kontrolliert, beherrscht den scheinbar freien Kommunikationsraum und verengt dessen Offenheit.
    - id: K2
      satz: Die Überwachung ist von gezielter Verfolgung auf vorsorgliche Speicherung aller Kommunikation übergegangen; weil Zensur technisch Überwachung voraussetzt, erzeugt sie Selbstzensur, und staatlich verstandene Sicherheit steht in Widerspruch zur technischen Sicherheit der Bürger.
    - id: K3
      satz: Staat und Privatwirtschaft bilden einen gemeinsamen Überwachungsverbund; Konzerne werden zu verlängerten Armen der Geheimdienste, asymmetrische Export- und Rechtsregeln schützen eher die Überwachung als den Bürger, und die Dritt-Doktrin macht Datenschutz im Netz nahezu unwirksam.
    - id: K4
      satz: "Gegen totale Überwachung hilft der Aufbau kryptografischer Schutzräume: Rechenaufwand, industrielles Eigeninteresse und dezentrale Vertrauensverfahren schaffen Grenzen, die staatlich nicht beliebig überschritten werden können, weshalb der Ausweg nicht im Rückzug aus dem Netz, sondern in der Beherrschung schützender Technik liegt."
    - id: K5
      satz: Bewegungs-, Kommunikations- und Wirtschaftsfreiheit brauchen vertrauliche, nicht zentral kontrollierte Infrastruktur; der Übergang ins Netz vergrößert die Reichweite, raubt aber Privatheit, und wer Zahlungsströme kontrolliert, kontrolliert gesellschaftliche Macht und Handlungsmöglichkeiten.
    - id: K6
      satz: Das Problem ist nicht zu viel Transparenz, sondern die asymmetrische Geheimhaltung der Mächtigen; erwartete Enthüllung diszipliniert staatliches Handeln, und sichtbares Unrecht sowie geschützte Warnkanäle sind nötig, damit Missstände überhaupt bekämpft werden können.
    - id: K7
      satz: Weil Code das Handeln im Netz bestimmt und Technik nicht neutral ist, muss Software offen und demokratisch prüfbar sein; nicht staatliche Vorzensur, sondern mündige Nutzer, freie Software und vielfältige Ausdrucksformen entscheiden über die politische Potenz des Netzes.
    - id: K8
      satz: Nationale Regierungen sind keine verlässliche Schutzinstanz mehr, weil Eliten transnational verschmelzen, politische Entscheidungen in geheime Kanäle verschieben und Informationszugang zentralisieren; zugleich eröffnet das Netz eigene Zeiträume und Reichweiten politischer Öffentlichkeit, weshalb der Kampf um ein offenes universelles Netz kein Sonderinteresse, sondern der zentrale politische Kampf ist.
core_concepts:
  - id: K1
    concept_id: 645109bc-9168-50e7-8150-56f94cd8a50b
    satz: Das Internet ist kein körperloser Ideenraum, sondern ruht auf physischen und industriellen Infrastrukturen; wer Kabel, Server, Rechenressourcen und zentrale Dienste kontrolliert, beherrscht den scheinbar freien Kommunikationsraum und verengt dessen Offenheit.
    text: |-
      Das Internet erscheint als ein Raum zirkulierender Ideen, der von keinem Ort abhängt. Tatsächlich aber ruht es auf Glasfaserkabeln am Meeresboden, auf Satelliten und auf Hallen voller Server. Wer diese physische Grundlage beherrscht, kontrolliert den scheinbar körperlosen Kommunikationsraum. Julian Assange beschreibt, wie Staaten sich diese Grundlage aneigneten, indem sie Kabel und Bodenstationen in Beschlag nahmen, und so den Informationsfluss der Überwachung unterwarfen.

      Andy Müller-Maguhn versteht Technik nicht als einzelnes Gerät, sondern als systematisierte Interaktion. Sobald eine Technik zentralisierte Ressourcen verlange, etwa eine Fabrik mit Tausenden Beschäftigten, zentralisiere sich auch die Kontrolle über sie. Assange führt die Halbleiterproduktion als Beispiel an: Ihre strengen Produktionsbedingungen und das angesammelte Wissen sind der Internetbefreiung gewissermaßen einkodiert. Zentralisierte Serverstrukturen setzen sich im wirtschaftlichen Wettbewerb durch, und zentralisierte Infrastruktur macht zentralisierte Kontrolle leicht.

      Für Assange hat das Folgen bis in die private Kommunikation. Wer über das Netz telefoniert oder Nachrichten schickt, dessen Mitteilungen werden von militärischen Geheimdiensten abgefangen; die intimste familiäre Kommunikation ist in eine militarisierte Zone umgezogen, ohne dass die Besatzung sichtbar wäre. Zivilraum und Kriegsraum sind damit nicht mehr getrennt. Jeremie Zimmermann ergänzt, dass Geräte zunehmend mit eingebauter Kontrolle gebaut werden, die Nutzer an bestimmten Anwendungen hindert, und dass gerade deshalb freie Software für eine freie Gesellschaft zählt.
