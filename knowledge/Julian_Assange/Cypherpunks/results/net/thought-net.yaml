        paragraphs: "43"
      - source_id: Julian_Assange_Cypherpunks
        segment_id: Julian_Assange_Cypherpunks
        paragraphs: "140"
    queries:
      - Überwachung wandelt sich von gezielter Verfolgung zum unterschiedslosen Sammeln
        und späteren Filtern
      - Nicht mehr Verdacht, sondern Speicherkapazität entscheidet, wer ins Visier gerät
      - Strategisches Abfangen speichert alles, weil sich Relevanz erst nachträglich
        zeigt
    keywords:
      - strategisches Abfangen
      - Vorratsdatenspeicherung
      - Massenüberwachung
      - Verdacht
      - Speicherkapazität
      - Sortierung im Nachhinein
  - id: 446f65a8-087c-5e6a-9365-20c670473e08
    title: Verwischung von Staat und Unternehmen im Überwachungsverbund
    core: "Die Grenze zwischen Staat und Privatwirtschaft ist im Überwachungsgeschäft
      eingeebnet: weil Geheimdienste auf die Datenbestände von Google und Facebook
      zugreifen, werden diese Konzerne zu verlängerten Armen der Dienste."
    type: verbindung
    origin: harvested
    status: offen
    primary:
      source_id: Julian_Assange_Cypherpunks
      segment_id: Julian_Assange_Cypherpunks
      paragraphs: "53"
    occurrences:
      - source_id: Julian_Assange_Cypherpunks
        segment_id: Julian_Assange_Cypherpunks
        paragraphs: 30,56
    queries:
      - Geheimdienste greifen auf Datenbestände privater Plattformkonzerne zu und machen
        sie zu Erfüllungsgehilfen
      - Die Trennung zwischen staatlicher Spionage und kommerzieller Datensammlung ist
        aufgehoben
      - Private Tech-Firmen werden durch staatlichen Datenzugriff zu Organen der
        Nachrichtendienste
    keywords:
      - Überwachungsverbund
      - Geheimdienste
      - Google
      - Facebook
