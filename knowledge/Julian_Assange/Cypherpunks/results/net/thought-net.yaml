        segment_id: Julian_Assange_Cypherpunks
        paragraphs: 151-152
      - source_id: Julian_Assange_Cypherpunks
        segment_id: Julian_Assange_Cypherpunks
        paragraphs: "154"
    queries:
      - Eine einzige verwirklichte Utopie wäre selbst eine Dystopie, daher müssen
        utopische Ideale die Vielfalt von Systemen einschließen
      - Die Marktlogik treibt auf Homogenisierung und Standardisierung zu und bedroht
        die Vielfalt der Kulturen
      - Nicht Einheitslösung, sondern Vervielfältigung von Systemen, Kulturen und
        Interaktionsformen ist wünschenswert
    keywords:
      - Utopie
      - Dystopie
      - Vielfalt
      - Homogenisierung
      - Marktlogik
      - Standardisierung
  - id: c253b639-d56a-5cb5-ab58-a796f62b5547
    title: Das Internet als platonisches Reich, das auf physischen Fundamenten ruht
    core: Das Netz erscheint als körperloser Raum zirkulierender Ideen, ist aber auf Kabel,
      Satelliten und Serverhallen gegründet; wer diese physische Basis kontrolliert,
      beherrscht den scheinbar körperlosen Raum.
    type: unterscheidung
    origin: harvested
    status: offen
    primary:
      source_id: Julian_Assange_Cypherpunks
      segment_id: Julian_Assange_Cypherpunks
      paragraphs: 4-5,7
    occurrences: []
    queries:
      - Die scheinbar immaterielle Sphäre digitaler Ideen beruht auf materieller
        Infrastruktur, deren Beherrschung die Macht über sie verleiht
      - Wer Kabel, Satelliten und Rechenzentren kontrolliert, kontrolliert den
        vermeintlich körperlosen Informationsraum
      - "Die Trennung von Geistraum und physischer Basis ist eine Illusion: Herrschaft
        über die Hardware erzwingt Herrschaft über den Datenfluss"
    keywords:
      - Platonisches Reich
      - physische Infrastruktur
      - Glasfaserkabel
      - Satelliten
      - Serverhallen
      - Kontrolle des Informationsflusses
  - id: be565df5-4f0c-566d-8be4-c3928d4fe65e
    title: Die Geschwindigkeit der Konsensbildung als Waffe, die sich gegen ihre Urheber we
    core: Massenkommunikation erzeugt einen Vorsprung bei der Konsensbildung, der den Staat
      überraschen kann; derselbe Vorsprung kehrt sich um, wenn die Bewegung scheitert,
      weil dann die nämliche Infrastruktur zur Verfolgung aller Initiatoren dient.
    type: umkehrung
    origin: harvested
    status: offen
    primary:
      source_id: Julian_Assange_Cypherpunks
      segment_id: Julian_Assange_Cypherpunks
      paragraphs: 27-28
    occurrences: []
    queries:
      - Dieselbe Vernetzung, die schnelle kollektive Einigung ermöglicht, wird nach
        einer Niederlage zum Werkzeug der Verfolgung ihrer Urheber.
      - Wer durch digitale Massenkommunikation rasch Mehrheiten schafft, muss gewinnen,
        weil die Infrastruktur sonst gegen ihn aussagt.
      - Die Beschleunigung von Konsens durch soziale Medien ist eine Waffe mit
        eingebauter Rückstoßwirkung.
    keywords:
      - Konsensbildung
      - Überwachung
      - Umkehrung
      - soziale Medien
      - Verfolgung
      - Revolution
  - id: 91cb5ac7-9874-5136-aa93-ee421ce62dce
    title: Die netzinterne Freiheit als Gipfel der neoliberalen Ordnung
    core: Die Freiheit des Netzes ruht auf der am strengsten hierarchisierten, staatlich
      durchsetzten Industrie überhaupt; der High-Tech-Kommunikationsraum ist damit der
      Gipfel und nicht der Gegner der neoliberalen Ordnung.
    type: umkehrung
    origin: harvested
    status: offen
    primary:
      source_id: Julian_Assange_Cypherpunks
      segment_id: Julian_Assange_Cypherpunks
      paragraphs: "31"
    occurrences: []
    queries:
      - Die Freiheit des Internets beruht auf der am rigidesten hierarchisierten,
        staatlich gestützten Industrie und ist daher Krönung statt Widersacher der
        marktradikalen Ordnung
      - Halbleiterfertigung mit ihren Reinraumbedingungen und staatlicher Macht bildet
        die Basis der Netzfreiheit und markiert den Höhepunkt des globalisierten
        Kapitalismus
      - Der digitale Kommunikationsraum ist kein Gegenmodell zur neoliberalen
        Wirtschaft, sondern deren technologische Spitze und Ausdruck
    keywords:
      - Halbleiterproduktion
      - Neoliberalismus
      - Netzfreiheit
      - Hierarchie
      - Staatsmacht
      - Technikphilosophie
  - id: 21ccef18-c62f-57f8-a5f2-b74d2ad8d331
    title: "Militarisierung des Zivillebens: der unsichtbare Panzer im Schlafzimmer"
    core: Die private, familiäre Kommunikation ist in eine militärisch besetzte Zone
      umgezogen, ohne dass die Besatzung sichtbar wäre; Zivilraum und Kriegsraum sind
      damit nicht mehr getrennt, sondern dasselbe Netz.
    type: ausdruck
    origin: harvested
    status: offen
    primary:
      source_id: Julian_Assange_Cypherpunks
      segment_id: Julian_Assange_Cypherpunks
      paragraphs: "35"
    occurrences: []
    queries:
      - Die intimste Familienkommunikation läuft heute über ein Netz, das militärisch
        besetzt ist, ohne dass die Besatzung sichtbar wird.
      - Ziviler Alltag und Kriegsraum fallen zusammen, weil dieselbe Infrastruktur beide
        Bereiche trägt.
      - Private Kommunikation ist in eine unsichtbar besetzte Zone übergesiedelt, der
        Soldat steht zwischen den Ehepartnern.
    keywords:
      - Militarisierung
      - Zivilleben
      - Privatkommunikation
      - Internet
      - Besatzung
      - Kriegsrecht
  - id: 07d94971-f50d-5329-8c45-2837fe4aa26b
    title: "Die Asymmetrie der Exportkontrollen: Schutz verboten, Überwachung erlaubt"
    core: Waffenexportkontrolle verbietet gerade die Verschlüsselung, die den Bürger
      schützt, während Überwachungsgeräte frei handelbar bleiben – weil auch
      demokratische Staaten am Wissen aus fremder Überwachung interessiert sind.
    type: umkehrung
    origin: harvested
    status: offen
    primary:
      source_id: Julian_Assange_Cypherpunks
      segment_id: Julian_Assange_Cypherpunks
      paragraphs: 36,47
    occurrences: []
    queries:
      - Exportkontrollen verbieten schützende Kryptografie, lassen aber
        Überwachungstechnik frei zirkulieren
      - Staaten regulieren Verschlüsselung scharf, während sie Spähsoftware ungehindert
        exportieren dürfen
      - "Doppelstandard bei Ausfuhrregeln: Bürger schützende Technik wird behindert,
        staatliche Ausspähung gefördert"
    keywords:
      - Wassenaar-Abkommen
      - Exportkontrolle
      - Überwachungstechnologie
      - Doppelmoral
      - Kryptografie
      - Staatsinteresse
  - id: 014d9cda-a673-569b-a0b6-c8b0f5748d7c
    title: Überwachungskapazität wächst schneller als die Bevölkerung
    core: Die Überwachungskapazität wächst alle achtzehn Monate, die Bevölkerung alle
      fünfundzwanzig Jahre, sodass die Überwachungskurve die Bevölkerungsentwicklung
      dauerhaft überholt und ein Aufholen durch bloßes Abwarten unmöglich wird.
    type: verbindung
    origin: harvested
    status: offen
    primary:
      source_id: Julian_Assange_Cypherpunks
      segment_id: Julian_Assange_Cypherpunks
      paragraphs: "47"
    occurrences: []
    queries:
      - Überwachungstechnik wächst exponentiell schneller als die Zahl der Menschen,
        daher lässt sich der Rückstand nicht aussitzen
      - Das Tempo des Ausbaus von Überwachung übersteigt das Bevölkerungswachstum
        dauerhaft und verschiebt das Machtgleichgewicht
      - Wer auf demografischen Wandel als Gegengewicht zur Überwachung hofft, irrt, weil
        die technische Kurve steiler verläuft
    keywords:
      - Überwachungskapazität
      - Verdopplungszeit
      - Bevölkerungswachstum
      - Kurvendominanz
      - Massenüberwachung
      - Demokratie
  - id: 4feb2234-c04c-503c-a8a2-1ae068560986
    title: "Die Dritt-Doktrin: im Netz ist jeder ein Dritter, also niemand geschützt"
    core: Die Gerichte begründen fehlenden Datenschutz damit, dass man durch die Nutzung
      eines Dienstes dessen Betreiber zum Dritten macht und damit angeblich freiwillig
      preisgibt – obwohl im Netz jeder ein Dritter ist, sodass der Schutzbegriff sich
      selbst aufhebt.
    type: umkehrung
    origin: harvested
    status: offen
    primary:
      source_id: Julian_Assange_Cypherpunks
      segment_id: Julian_Assange_Cypherpunks
      paragraphs: "55"
    occurrences: []
    queries:
      - Die juristische Begründung, Nutzer gäben Daten freiwillig an Dienstebetreiber
        weiter, macht jeden zum Dritten und hebt damit den Schutz selbst auf
      - Weil im Internet jeder gegenüber jedem ein Dritter ist, kann die Dritt-Doktrin
        keinen Datenschutz mehr begründen
      - Gerichte verweigern Privatsphäre im Netz mit dem Argument der Offenbarung an
        Dritte, obwohl diese Konstruktion dort allumfassend und damit sinnlos wird
    keywords:
      - Dritt-Doktrin
      - Datenschutz
      - dritter Dritter
      - Preisgabe
      - Stored Communications Act
      - Selbstaufhebung
  - id: 1e18fefc-f3f9-5818-8155-665975cb73f4
    title: Der Rückzug aus dem Netz als Selbstentmachtung
    core: "Der Verzicht auf Netznutzung ist keine Freiheit, sondern Entmachtung: Wer offline
      bleibt, verliert gerade die Möglichkeit, Einfluss zu nehmen, weshalb der Ausweg
      nicht im Rückzug, sondern im gesicherten Bleiben liegt."
    type: umkehrung
    origin: harvested
    status: offen
    primary:
      source_id: Julian_Assange_Cypherpunks
      segment_id: Julian_Assange_Cypherpunks
      paragraphs: "61"
    occurrences: []
    queries:
      - Wer sich dem Netz entzieht, verliert Einflussmöglichkeiten statt Freiheit zu
        gewinnen
      - Der Ausweg aus der Überwachung liegt im geschützten Dabeibleiben, nicht im
        Offline-Gehen
      - Nichtnutzung digitaler Infrastruktur bedeutet Selbstentmachtung des Einzelnen
    keywords:
      - Rückzug
      - Selbstentmachtung
      - Einfluss
      - Offline
      - Kryptografie
      - Überwachung
  - id: ac722224-3972-5aa7-b981-aba7bdb8bf9b
    title: Die Industrie als Schutzmacht der Kryptografie
    core: Kryptografie verbreitet sich, weil Unternehmen ihre transnationalen Datenströme
      absichern müssen; der wirtschaftliche Eigennutz der Konzerne wird so zur
      Machtbasis, die verhindert, dass Verschlüsselung politisch verboten wird.
    type: verbindung
    origin: harvested
    status: offen
    primary:
      source_id: Julian_Assange_Cypherpunks
      segment_id: Julian_Assange_Cypherpunks
      paragraphs: "61"
    occurrences: []
    queries:
      - Wirtschaftliche Interessen von Konzernen sichern die Verbreitung starker
        Verschlüsselung gegen staatliche Verbote
      - Transnationale Datenströme brauchen Absicherung, wodurch Unternehmen zu einer
        Schutzmacht der Kryptografie werden
      - Die Machtbasis der Kryptografie liegt in der Industrie, die sie für eigene
        Vernetzung benötigt
    keywords:
      - Kryptografie
      - Industrie
      - Machtbasis
      - Virtual Private Networks
      - transnationale Datenströme
      - Verbot
  - id: 0de6c0bf-bcdb-5250-bdfc-f31d6ad5e7be
    title: Selbstzensur als Preis des Nichtkönnens
    core: Wer angesichts der Überwachung nicht lernt, schützende Technik selbst zu
      beherrschen, verfällt in universelle Selbstzensur und meldet sich als politischer
