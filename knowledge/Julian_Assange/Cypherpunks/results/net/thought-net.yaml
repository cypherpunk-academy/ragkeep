    title: Code als Gesetz und freie Software als Verfassungsfrage
    core: Im Netz wird das Handeln durch den Code bestimmt, der läuft; deshalb ist Code
      Gesetz, und freie Software muss so offenliegen wie Gesetzestexte in einer
      Demokratie, damit jeder sie prüfen und ändern kann.
