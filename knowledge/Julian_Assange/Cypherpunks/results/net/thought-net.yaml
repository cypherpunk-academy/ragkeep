      - Datenzugriff
  - id: 0b895879-ea76-5ad8-a988-c81578e48680
    title: Drei Infrastrukturen der Staatlichkeit als drei Grundfreiheiten
    core: Staatlichkeit lässt sich an drei Infrastrukturen messen – Kontrolle über
      Streitkräfte, über Kommunikation und über Finanzen –, und dieselben drei werden zu
      den Grundfreiheiten der Bewegung, des Denkens und des Wirtschaftens, deren Schutz
      jeweils Privatheit voraussetzt.
    type: verbindung
    origin: harvested
    status: offen
    primary:
      source_id: Julian_Assange_Cypherpunks
      segment_id: Julian_Assange_Cypherpunks
      paragraphs: 87-88
    occurrences:
      - source_id: Julian_Assange_Cypherpunks
        segment_id: Julian_Assange_Cypherpunks
        paragraphs: 118-119
    queries:
      - Drei Infrastrukturen staatlicher Macht entsprechen drei Grundfreiheiten, die auf
        Privatheit angewiesen sind
      - Streitkräfte, Kommunikation und Finanzen als Maßstab für Staatlichkeit und als
        Freiheiten der Bewegung, des Denkens und des Handelns
      - Privatsphäre als Bedingung für Bewegungs-, Kommunikations- und
        Wirtschaftsfreiheit
    keywords:
      - Staatlichkeit
      - Infrastrukturen
      - Grundfreiheiten
      - Privatheit
      - Cypherpunks
      - Finanzinfrastruktur
  - id: 91773957-e35f-58c6-84d4-0c5dfdc8328e
    title: Zensur erfordert Überwachung und erzeugt Selbstzensur
    core: "Zensur ist technisch nicht von Überwachung zu trennen: Um zu prüfen, ob ein
      Inhalt erlaubt ist, muss das System ihn sehen, und was es sieht, kann es speichern
      – die eigentliche Wirkung ist die Verhaltensänderung der Wissenden."
    type: verbindung
    origin: harvested
    status: offen
    primary:
      source_id: Julian_Assange_Cypherpunks
      segment_id: Julian_Assange_Cypherpunks
      paragraphs: "122"
    occurrences:
      - source_id: Julian_Assange_Cypherpunks
        segment_id: Julian_Assange_Cypherpunks
        paragraphs: 127-128
    queries:
      - Wer Inhalte filtern will, muss sie einsehen können, und was eingesehen wird,
        lässt sich aufzeichnen
      - Die eigentliche Wirkung von Kontrolle ist die Verhaltensänderung der Wissenden,
        nicht das Verbot selbst
      - Zensur und Überwachung sind technisch untrennbar, weil Prüfung Sichtbarkeit
        voraussetzt
    keywords:
      - Zensur
      - Überwachung
      - Selbstzensur
      - Firewall
      - Speicherung
      - Verhaltensänderung
  - id: ee26b8b5-cd66-5ca8-b125-7d626295d5ac
    title: "Spurlose Ausradierung: die unnachweisbare Zensur des Westens"
    core: "Zensur im Westen arbeitet nicht durch sichtbare Korrektur, sondern durch
      spurloses Entfernen aus Archiven und Indizes: Die Geschichte wird nicht verändert,
      sie hat nachträglich nie existiert, was schwerer nachweisbar ist als die offene
      sowjetische Richtigkeitsklebung."
    type: unterscheidung
    origin: harvested
    status: offen
    primary:
      source_id: Julian_Assange_Cypherpunks
      segment_id: Julian_Assange_Cypherpunks
      paragraphs: 123-124
    occurrences:
      - source_id: Julian_Assange_Cypherpunks
        segment_id: Julian_Assange_Cypherpunks
        paragraphs: "127"
      - source_id: Julian_Assange_Cypherpunks
        segment_id: Julian_Assange_Cypherpunks
        paragraphs: "127"
    queries:
      - Zensur durch nachträgliches Löschen aus Archiven und Suchindizes ist schwerer
        nachweisbar als offene Korrektur
      - Im Westen verschwinden Artikel spurlos, statt sichtbar berichtigt zu werden
      - Die Vergangenheit wird nicht umgeschrieben, sondern zum Nichtexistieren gebracht
    keywords:
      - spurlose Zensur
      - Archivlöschung
      - Suchindex
      - Geschichtsausradierung
      - Nachweisbarkeit
      - Selbstzensur
    suspect_source: "Orwell (1984): Wer die Vergangenheit kontrolliert, kontrolliert die Zukunft"
  - id: 1386b4d7-3558-5fab-b610-b7ad6f7a38a0
    title: Sichtbarkeit des Unrechts als Bedingung seiner Bekämpfung
    core: Das Sichtbarmachen von Unrecht erzeugt die politische Lobby, die zu seiner
      Bekämpfung nötig ist; Zensur nimmt den Ermittlern den Anreiz und der
      Öffentlichkeit das Wissen, und der Schutz der Unversehrtheit der Geschichte wiegt
      schwerer als die Schonung der Opfer vor erneuter Konfrontation.
    type: umkehrung
    origin: harvested
    status: offen
