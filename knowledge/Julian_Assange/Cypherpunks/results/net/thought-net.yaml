nodes:
  - id: 38e4a543-6bc3-5368-b797-5e1df21eb7f3
    title: Kryptografie als physikalisch verbürgte Grenze gegen staatlichen Zugriff
    core: Weil das Universum das Verschlüsseln leichter macht als das Entschlüsseln, lässt
      sich daraus ein Rechtsraum bauen, dessen Grenze nicht politisch gesetzt, sondern
      durch Rechenaufwand verteidigt wird – der Staat kann in ihn nur eindringen, wenn
      er unendliche Mittel aufwendet.
    type: verbindung
    origin: harvested
    status: offen
    primary:
      source_id: Julian_Assange_Cypherpunks
      segment_id: Julian_Assange_Cypherpunks
      paragraphs: 8,10-11
    occurrences:
      - source_id: Julian_Assange_Cypherpunks
        segment_id: Julian_Assange_Cypherpunks
        paragraphs: 11-12
      - source_id: Julian_Assange_Cypherpunks
        segment_id: Julian_Assange_Cypherpunks
        paragraphs: "60"
    queries:
      - Asymmetrie von Ver- und Entschlüsselung als Grundlage eines staatsfreien
        Rechtsraums
      - Rechenaufwand statt politischer Setzung als Grenze der staatlichen Zugriffsmacht
      - Kryptografische Schutzmauer als materielle Schranke gegen Überwachung und Zwang
    keywords:
      - Kryptografie
      - Verschlüsselungsasymmetrie
      - Rechtsraum
      - staatlicher Zugriff
      - Rechenaufwand
      - Unabhängigkeit
  - id: 410b08a8-a1ee-5a1d-9fb9-36ff45700707
    title: Technik als systematisierte Interaktion und als Motor der Kontrollzentralisierun
    core: Technik ist nicht das Gerät, sondern systematisierte Interaktion; wer über die
      physischen Ressourcen einer Technik verfügt, zentralisiert Kontrolle, weshalb
      Technikgeschichte eher Herrschaft verfestigt als demokratisiert.
    type: begriff
    origin: harvested
    status: offen
    primary:
      source_id: Julian_Assange_Cypherpunks
      segment_id: Julian_Assange_Cypherpunks
      paragraphs: "30"
    occurrences:
      - source_id: Julian_Assange_Cypherpunks
        segment_id: Julian_Assange_Cypherpunks
        paragraphs: 75-77
      - source_id: Julian_Assange_Cypherpunks
        segment_id: Julian_Assange_Cypherpunks
        paragraphs: 95-96
    queries:
      - Technik ist nicht das Gerät, sondern geordnete Wechselbeziehungen zwischen
        Menschen; wer die materiellen Grundlagen beherrscht, bündelt Macht
      - Die Geschichte der Technik festigt Herrschaft eher, als sie zu verteilen, weil
        zentrale Ressourcen kontrollierbar sind
      - Aus der Zentralisierung von Mühlentechnik entstanden feudale Abhängigkeiten; nur
        wenige Techniken lassen sich breit streuen
    keywords:
      - Technikphilosophie
      - Zentralisierung
      - Kontrolle
      - physische Ressourcen
      - Feudalismus
      - Demokratisierung
  - id: 259c229e-5bef-5ec6-8154-f3f1b5ed220f
    title: "Vom taktischen zum strategischen Abfangen: Verdacht wird durch Vorrat ersetzt"
    core: Die Überwachung hat sich von der gezielten Verfolgung Verdächtiger zum
      unterschiedslosen Abschöpfen und Aufbewahren aller Kommunikation verschoben, weil
      man erst im Nachhinein sortiert – Verdacht wird damit durch Speicherkapazität
      ersetzt.
    type: unterscheidung
    origin: harvested
    status: offen
    primary:
      source_id: Julian_Assange_Cypherpunks
      segment_id: Julian_Assange_Cypherpunks
      paragraphs: 39-40
    occurrences:
