        segment_id: Julian_Assange_Cypherpunks
        paragraphs: "136"
    queries:
      - Sichtbarkeit von Missständen erzeugt politischen Druck zu ihrer Bekämpfung
      - Zensur nimmt Ermittlern den Anreiz und der Öffentlichkeit das Wissen über Unrecht
      - Erhalt der historischen Aufzeichnung wiegt schwerer als die Schonung Betroffener
        vor erneuter Konfrontation
    keywords:
