phase3:
  source_id: julian-assange-cypherpunks
  gattung: dialog
  leitgedanke:
    rationale: Die Kapitel zeigen, dass das Netz auf kontrollierbaren Infrastrukturen ruht,
      Überwachung und Zensur zunehmend vorsorglich und privat-staatlich organisiert sind
      und Kryptografie, Transparenz sowie offener Code als Gegenmittel dienen. Daraus
      folgt die politische These, dass Freiheit im Netz nicht natürlich gegeben ist,
      sondern gegen zentralisierte Macht verteidigt und technisch abgesichert werden
      muss.
    text: Weil die scheinbar freie Netzwelt auf kontrollierbaren Infrastrukturen und einem
      privat-staatlichen Überwachungsverbund beruht, lässt sich Freiheit nur durch
      Kryptografie, Transparenz und offene, demokratisch prüfbare Technik gegen die
      Zentralisierung von Macht behaupten.
  kernaussagen:
    - id: K1
      rationale: Die Kandidaten betonen übereinstimmend, dass das Internet keinen körperlosen
        Raum bildet, sondern von Kabeln, Servern, Rechenressourcen und industriellen
        Hierarchien abhängt; wer diese Basis beherrscht, kontrolliert den
        Kommunikationsraum, und diese Kontrolle kann militärisch wie zentralisierend
        wirken.
      text: Das Internet ist kein körperloser Ideenraum, sondern ruht auf physischen und
        industriellen Infrastrukturen; wer Kabel, Server, Rechenressourcen und zentrale
        Dienste kontrolliert, beherrscht den scheinbar freien Kommunikationsraum und
        verengt dessen Offenheit.
      paragraphs: Abs. 4-5,7; 30; 35; 85
      candidates:
        - c253b639-d56a-5cb5-ab58-a796f62b5547
        - 410b08a8-a1ee-5a1d-9fb9-36ff45700707
        - 91cb5ac7-9874-5136-aa93-ee421ce62dce
        - 21ccef18-c62f-57f8-a5f2-b74d2ad8d331
        - 3597b61e-3036-5c85-a1a4-cdda12f7d540
      sprecher:
        - "-"
        - ANDY
        - JULIAN
      strittig: false
    - id: K2
      rationale: Die Kandidaten beschreiben eine Überwachung, die nicht mehr nur Verdächtige
        verfolgt, sondern vorsorglich alles speichert, Zensur technisch an Überwachung
        koppelt und dadurch Selbstzensur erzeugt; zugleich wird der staatliche
        Sicherheitsbegriff dem technischen Schutz entgegengesetzt.
      text: Die Überwachung ist von gezielter Verfolgung auf vorsorgliche Speicherung aller
        Kommunikation übergegangen; weil Zensur technisch Überwachung voraussetzt,
        erzeugt sie Selbstzensur, und staatlich verstandene Sicherheit steht in
        Widerspruch zur technischen Sicherheit der Bürger.
      paragraphs: Abs. 39-40; 47; 61; 121-124
      candidates:
        - 259c229e-5bef-5ec6-8154-f3f1b5ed220f
        - 91773957-e35f-58c6-84d4-0c5dfdc8328e
        - ee26b8b5-cd66-5ca8-b125-7d626295d5ac
        - 014d9cda-a673-569b-a0b6-c8b0f5748d7c
        - 0de6c0bf-bcdb-5250-bdfc-f31d6ad5e7be
        - 2ebac5c5-bde9-5252-838e-c785d4c3277a
      sprecher:
        - JULIAN
        - JEREMIE
        - JACOB
        - ANDY
        - "-"
      strittig: false
    - id: K3
      rationale: Die Kandidaten zeigen, dass Geheimdienste und Konzerne im
        Überwachungsgeschäft zusammenwirken, dass Exportkontrollen den Bürgerschutz
        behindern, während Überwachungstechnik verfügbar bleibt, und dass die
        Dritt-Doktrin den Datenschutz im Netz aushöhlt.
      text: Staat und Privatwirtschaft bilden einen gemeinsamen Überwachungsverbund; Konzerne
        werden zu verlängerten Armen der Geheimdienste, asymmetrische Export- und
        Rechtsregeln schützen eher die Überwachung als den Bürger, und die Dritt-Doktrin
        macht Datenschutz im Netz nahezu unwirksam.
      paragraphs: Abs. 47; 53-55
      candidates:
        - 446f65a8-087c-5e6a-9365-20c670473e08
        - 07d94971-f50d-5329-8c45-2837fe4aa26b
        - 4feb2234-c04c-503c-a8a2-1ae068560986
      sprecher:
        - JEREMIE
        - ANDY
        - JULIAN
      strittig: false
    - id: K4
      rationale: Die Kandidaten begründen Kryptografie als durch Rechenaufwand und
        physikalische Asymmetrie geschützte Grenze, als wirtschaftlich vorangetriebene
        Schutzmacht und als Verfahren, Vertrauen durch Kosten statt durch zentrale
        Prüfung herzustellen; zugleich wird der Rückzug aus dem Netz als Entmachtung
        verworfen.
      text: "Gegen totale Überwachung hilft der Aufbau kryptografischer Schutzräume:
        Rechenaufwand, industrielles Eigeninteresse und dezentrale Vertrauensverfahren
        schaffen Grenzen, die staatlich nicht beliebig überschritten werden können,
        weshalb der Ausweg nicht im Rückzug aus dem Netz, sondern in der Beherrschung
        schützender Technik liegt."
      paragraphs: Abs. 8,10-11; 61; 108
      candidates:
        - 38e4a543-6bc3-5368-b797-5e1df21eb7f3
        - ac722224-3972-5aa7-b981-aba7bdb8bf9b
        - 1e18fefc-f3f9-5818-8155-665975cb73f4
        - babe4d40-4c53-509c-a0d4-eb3593a19501
      sprecher:
        - "-"
        - JACOB
        - JULIAN
      strittig: false
    - id: K5
      rationale: Die Kandidaten verbinden die drei Grundfreiheiten mit privater Infrastruktur,
        zeigen den Verlust an Vertraulichkeit beim Übergang ins Netz, die Käuflichkeit
        von Privatsphäre und die besondere Kontrollmacht über Zahlungsströme; die
        Bankenblockade und die Verwundbarkeit über Finanzflüsse belegen diese Macht.
      text: Bewegungs-, Kommunikations- und Wirtschaftsfreiheit brauchen vertrauliche, nicht
        zentral kontrollierte Infrastruktur; der Übergang ins Netz vergrößert die
        Reichweite, raubt aber Privatheit, und wer Zahlungsströme kontrolliert,
        kontrolliert gesellschaftliche Macht und Handlungsmöglichkeiten.
      paragraphs: Abs. 87-88; 101; 106-109
      candidates:
        - 0b895879-ea76-5ad8-a988-c81578e48680
        - a3a35365-d663-565d-b501-1b5c8151f709
        - 4b8eb472-332c-5c19-8634-32a248bc8d86
        - 62ff9033-e0f1-5a0b-935b-aefd72cce92f
        - 21c01f78-59a8-5b05-9137-ec7443e72239
        - fbace36a-1697-5999-9cf2-49c0cfdc5fac
      sprecher:
        - JULIAN
        - ANDY
        - "-"
      strittig: false
    - id: K6
      rationale: "Die Kandidaten arbeiten eine asymmetrische Geheimhaltung heraus:
        Geheimhaltung schützt die Mächtigen, WikiLeaks veröffentlicht nur einen
        Bruchteil, erwartete Enthüllung diszipliniert staatliches Handeln, und
        sichtbares Unrecht ist Voraussetzung für seine Bekämpfung."
      text: Das Problem ist nicht zu viel Transparenz, sondern die asymmetrische Geheimhaltung
        der Mächtigen; erwartete Enthüllung diszipliniert staatliches Handeln, und
        sichtbares Unrecht sowie geschützte Warnkanäle sind nötig, damit Missstände
        überhaupt bekämpft werden können.
      paragraphs: Abs. 130-132; 140-141
      candidates:
        - bcb78a01-e974-5f92-b8d4-bbe8e2d8c743
        - e698c744-4bf4-5232-927e-92e6ca4c20a1
        - 53a207b2-7f3f-52fc-9b87-dbb676849230
        - 1386b4d7-3558-5fab-b610-b7ad6f7a38a0
      sprecher:
        - JULIAN
        - ANDY
      strittig: false
    - id: K7
      rationale: Die Kandidaten machen Technik als nicht neutral und Code als Gesetz sichtbar;
        daraus folgt die Forderung nach offener, prüfbarer Software, Filterung beim
        mündigen Nutzer statt staatlicher Vorzensur und nach einer neuen
        Schreiböffentlichkeit, die Vielfalt statt Einheitslösungen ermöglicht.
      text: Weil Code das Handeln im Netz bestimmt und Technik nicht neutral ist, muss
        Software offen und demokratisch prüfbar sein; nicht staatliche Vorzensur,
        sondern mündige Nutzer, freie Software und vielfältige Ausdrucksformen
        entscheiden über die politische Potenz des Netzes.
      paragraphs: Abs. 86; 137-139; 142; 145; 151
      candidates:
        - 9a71d242-23e5-5f55-a9b7-3fbd84307947
        - a83f3eff-ac5b-5eb1-b077-7fbede26017c
        - 8c4160a3-a4aa-5896-9b4e-20a5e35cf1ea
        - b8641875-ac5d-558d-91bb-bbb197e2d860
        - 4818261d-92b0-5acb-9aff-d9f229f51056
      sprecher:
        - JACOB
        - ANDY
        - JULIAN
        - "-"
      strittig: false
    - id: K8
      rationale: "Die Kandidaten zeigen, dass die Hoffnung auf konkurrierende Nationalstaaten
        trügt: Eliten verschmelzen transnational, demokratische Entscheidungen werden in
        geheime bilaterale Kanäle verschoben, zentrale Informationsdienste verengen den
        Zugang, während das Netz zugleich eine eigene Zeit und Reichweite für politische
        Kämpfe schafft; deshalb wird das offene universelle Netz zum zentralen
        Konfliktfeld."
      text: Nationale Regierungen sind keine verlässliche Schutzinstanz mehr, weil Eliten
        transnational verschmelzen, politische Entscheidungen in geheime Kanäle
        verschieben und Informationszugang zentralisieren; zugleich eröffnet das Netz
        eigene Zeiträume und Reichweiten politischer Öffentlichkeit, weshalb der Kampf
        um ein offenes universelles Netz kein Sonderinteresse, sondern der zentrale
        politische Kampf ist.
      paragraphs: Abs. 73-78; 85; 129
      candidates:
        - c8d26fcf-5029-5720-b171-0d2fc6812e5b
        - bf96f928-7bb1-58dc-880b-a3976929b2dc
        - be565df5-4f0c-566d-8be4-c3928d4fe65e
        - 8c4e64b1-5779-5429-9247-6e05f149c1fb
        - 61c88d95-a028-5258-82d9-a922d165f040
      sprecher:
        - JULIAN
        - JEREMIE
        - JACOB
        - "-"
      strittig: false
  faden:
    - von: K1
      nach: K2
      uebergang: Nachdem die materielle und zentralisierbare Basis des Netzes geklärt ist,
        wendet sich der Text der Überwachung zu, die auf dieser Basis vorsorglich alle
        Kommunikation abschöpft und mit Zensur und Selbstzensur verbindet.
    - von: K2
      nach: K3
      uebergang: Weil diese Überwachung nicht bloß staatlich organisiert ist, führt der Text
        von der vorsorglichen Speicherung zum privat-staatlichen Überwachungsverbund und
        seinen asymmetrischen Rechts- und Exportregeln.
    - von: K3
      nach: K4
      uebergang: Gegen diesen Verbund setzt der Text die Kryptografie als
        technisch-physikalische und ökonomisch getragene Schutzgrenze, die nicht durch
        bloßen Rückzug aus dem Netz ersetzt werden kann.
    - von: K4
      nach: K5
      uebergang: Von der technischen Schutzmöglichkeit geht der Text zu den drei
        Grundfreiheiten über, deren Reichweite im Netz wächst, während ihre
        Vertraulichkeit und damit ihre wirtschaftliche und politische Grundlage bedroht
        wird.
    - von: K5
      nach: K6
      uebergang: Aus der Einsicht, dass zentrale Kontrolle über Kommunikation und Finanzen
        Macht bedeutet, folgt die Forderung nach Transparenz gegenüber den Mächtigen,
        deren erwartete Enthüllung staatliches Handeln disziplinieren soll.
    - von: K6
      nach: K7
      uebergang: Damit Transparenz und Freiheit nicht ihrerseits von undurchschaubarer Technik
        abhängen, wendet sich der Text der demokratischen Kontrolle von Code, freier
        Software und der Filterung beim mündigen Nutzer zu.
    - von: K7
      nach: K8
      uebergang: Die Einsicht, dass Code und Infrastruktur politisch sind, mündet in die
        abschließende These, dass der Kampf um ein offenes universelles Netz gegen
        transnational verschmelzende Eliten und geheime Entscheidungswege geführt werden
        muss.
  unzugeordnet:
    - id: 9e8c6334-5de9-58ee-bcdf-9e7f208c5b69
      grund: Der Kandidat formuliert ein allgemeines Kriterium zur Unterscheidung produktiver
        Interessenvertretung von Besitzstandsverteidigung; er stützt keine der
        übergreifenden Kernaussagen des Textgangs ausreichend.
