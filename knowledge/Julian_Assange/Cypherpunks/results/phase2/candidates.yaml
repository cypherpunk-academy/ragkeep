    title: Verwischung von Staat und Unternehmen im Überwachungsverbund
    core: "Die Grenze zwischen Staat und Privatwirtschaft ist im
      Überwachungsgeschäft eingeebnet: weil Geheimdienste auf die Datenbestände
      von Google und Facebook zugreifen, werden diese Konzerne zu verlängerten
