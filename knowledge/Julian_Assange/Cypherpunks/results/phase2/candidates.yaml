  - id: 1386b4d7-3558-5fab-b610-b7ad6f7a38a0
    title: Sichtbarkeit des Unrechts als Bedingung seiner Bekämpfung
    core: Das Sichtbarmachen von Unrecht erzeugt die politische Lobby, die zu seiner
      Bekämpfung nötig ist; Zensur nimmt den Ermittlern den Anreiz und der
      Öffentlichkeit das Wissen, und der Schutz der Unversehrtheit der
      Geschichte wiegt schwerer als die Schonung der Opfer vor erneuter
      Konfrontation.
    type: umkehrung
    source_id: Julian_Assange_Cypherpunks
    segment_id: Julian_Assange_Cypherpunks
    paragraphs: 130,132
    evidence: '"Ein Zensurregime zu errichten, das in der Lage ist, Stücke der
      Geschichte zu entfernen, bedeutet, dass wir das Problem nicht angehen
      können, weil wir gar nicht sehen, was das Problem ist."'
    interwoven_with: []
    occurrences:
