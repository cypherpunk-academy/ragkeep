  - id: c8d26fcf-5029-5720-b171-0d2fc6812e5b
    title: Von konkurrierenden Staaten zur verschmolzenen transnationalen Elite
    core: Die Hoffnung auf Rettung durch konkurrierende Regierungen trägt nicht
      mehr, weil nationale Eliten sich nicht länger bekämpfen, sondern sich
      miteinander verbinden und von ihren Bevölkerungen lösen.
