  - id: 410b08a8-a1ee-5a1d-9fb9-36ff45700707
    title: Technik als systematisierte Interaktion und als Motor der
      Kontrollzentralisierun
    core: Technik ist nicht das Gerät, sondern systematisierte Interaktion; wer über
      die physischen Ressourcen einer Technik verfügt, zentralisiert Kontrolle,
      weshalb Technikgeschichte eher Herrschaft verfestigt als demokratisiert.
    type: begriff
    source_id: Julian_Assange_Cypherpunks
    segment_id: Julian_Assange_Cypherpunks
    paragraphs: "30"
    evidence: '"In diesem Sinn ist Technik systematisierte Interaktion.
      Feudalsysteme haben sich zum Beispiel, wie es scheint, aus der
      Mühlentechnik entwickelt."'
