  - id: 014d9cda-a673-569b-a0b6-c8b0f5748d7c
    title: Überwachungskapazität wächst schneller als die Bevölkerung
    core: Die Überwachungskapazität wächst alle achtzehn Monate, die Bevölkerung
      alle fünfundzwanzig Jahre, sodass die Überwachungskurve die
      Bevölkerungsentwicklung dauerhaft überholt und ein Aufholen durch bloßes
