  - id: 38e4a543-6bc3-5368-b797-5e1df21eb7f3
    title: Kryptografie als physikalisch verbürgte Grenze gegen staatlichen Zugriff
    core: Weil das Universum das Verschlüsseln leichter macht als das Entschlüsseln,
      lässt sich daraus ein Rechtsraum bauen, dessen Grenze nicht politisch
      gesetzt, sondern durch Rechenaufwand verteidigt wird – der Staat kann in
      ihn nur eindringen, wenn er unendliche Mittel aufwendet.
    type: verbindung
    source_id: Julian_Assange_Cypherpunks
    segment_id: Julian_Assange_Cypherpunks
    paragraphs: 8,10-11
    evidence: '"Das Universum nämlich ist ein Freund der Kryptografie. Es ist
      leichter, Informationen zu verschlüsseln, als sie wieder zu
      entschlüsseln."'
