        paragraphs: "136"
  - id: 4818261d-92b0-5acb-9aff-d9f229f51056
    title: "Die eine Utopie als Dystopie: Vielfalt statt Einheitslösung"
    core: Eine einzige verwirklichte Utopie wäre selbst eine Dystopie; wünschenswert
      ist nicht die Einebnung, sondern die Vervielfältigung von Systemen,
      Kulturen und Interaktionsformen – während die Marktlogik gerade auf
      Homogenisierung zutreibt.
    type: umkehrung
    source_id: Julian_Assange_Cypherpunks
    segment_id: Julian_Assange_Cypherpunks
    paragraphs: "151"
    evidence: '"Die Verwirklichung einer einzigen Utopie wäre für mich in
      Wirklichkeit eine Dystopie."'
