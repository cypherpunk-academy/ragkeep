    title: Internetzeit als Gegenrhythmus zur medialen Kurzfristigkeit
    core: "Das Netz vergisst nicht, und daraus entsteht eine eigene Zeitform: gegen
      den 24-Stunden-Takt der Medienerzählungen lassen sich über Jahre Dossiers
