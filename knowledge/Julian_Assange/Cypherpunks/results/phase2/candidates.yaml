  - id: 4feb2234-c04c-503c-a8a2-1ae068560986
    title: "Die Dritt-Doktrin: im Netz ist jeder ein Dritter, also niemand geschützt"
    core: Die Gerichte begründen fehlenden Datenschutz damit, dass man durch die
      Nutzung eines Dienstes dessen Betreiber zum Dritten macht und damit
      angeblich freiwillig preisgibt – obwohl im Netz jeder ein Dritter ist,
      sodass der Schutzbegriff sich selbst aufhebt.
    type: umkehrung
    source_id: Julian_Assange_Cypherpunks
    segment_id: Julian_Assange_Cypherpunks
    paragraphs: "55"
    evidence: '"hat das Gericht erklärt, dass man im Internet keine Privatsphäre
      erwarten darf, wenn man bereit ist, Informationen an Dritte zu offenbaren.
      Nebenbei bemerkt: Jeder im Internet ist ein Dritter."'
    interwoven_with: []
    occurrences: []
  - id: 1e18fefc-f3f9-5818-8155-665975cb73f4
    title: Der Rückzug aus dem Netz als Selbstentmachtung
    core: "Der Verzicht auf Netznutzung ist keine Freiheit, sondern Entmachtung: Wer
      offline bleibt, verliert gerade die Möglichkeit, Einfluss zu nehmen,
      weshalb der Ausweg nicht im Rückzug, sondern im gesicherten Bleiben
      liegt."
    type: umkehrung
    source_id: Julian_Assange_Cypherpunks
    segment_id: Julian_Assange_Cypherpunks
    paragraphs: "61"
    evidence: '"Natürlich kann sich jeder vom Internet fernhalten, aber dann ist es
      schwer, irgendeinen Einfluss zu haben. Wer es tut, beraubt sich seiner
      eigenen Einflussmöglichkeiten."'
    interwoven_with: []
    occurrences: []
  - id: ac722224-3972-5aa7-b981-aba7bdb8bf9b
    title: Die Industrie als Schutzmacht der Kryptografie
    core: Kryptografie verbreitet sich, weil Unternehmen ihre transnationalen
      Datenströme absichern müssen; der wirtschaftliche Eigennutz der Konzerne
      wird so zur Machtbasis, die verhindert, dass Verschlüsselung politisch
      verboten wird.
    type: verbindung
    source_id: Julian_Assange_Cypherpunks
    segment_id: Julian_Assange_Cypherpunks
    paragraphs: "61"
    evidence: '"Dadurch gewinnt die Kryptografie eine Machtbasis in der Industrie,
