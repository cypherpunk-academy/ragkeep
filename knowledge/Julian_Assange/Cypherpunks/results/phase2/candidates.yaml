  - id: c253b639-d56a-5cb5-ab58-a796f62b5547
    title: Das Internet als platonisches Reich, das auf physischen Fundamenten ruht
    core: Das Netz erscheint als körperloser Raum zirkulierender Ideen, ist aber auf
      Kabel, Satelliten und Serverhallen gegründet; wer diese physische Basis
      kontrolliert, beherrscht den scheinbar körperlosen Raum.
    type: unterscheidung
    source_id: Julian_Assange_Cypherpunks
    segment_id: Julian_Assange_Cypherpunks
    paragraphs: 4-5,7
    evidence: '"Das platonische Wesen des Internets mit seinen zirkulierenden Ideen
      und Informationen wird durch seine physischen Ursprünge besudelt."'
