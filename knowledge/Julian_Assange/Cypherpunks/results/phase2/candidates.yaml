    source_id: Julian_Assange_Cypherpunks
    segment_id: Julian_Assange_Cypherpunks
    paragraphs: 39-40
    evidence: '"Heutzutage hält man es für viel effizienter zu sagen: »Wir greifen
      alles ab, sortieren können wir es später.«"'
