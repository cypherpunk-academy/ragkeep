  - id: 91cb5ac7-9874-5136-aa93-ee421ce62dce
    title: Die netzinterne Freiheit als Gipfel der neoliberalen Ordnung
    core: Die Freiheit des Netzes ruht auf der am strengsten hierarchisierten,
      staatlich durchsetzten Industrie überhaupt; der
      High-Tech-Kommunikationsraum ist damit der Gipfel und nicht der Gegner der
      neoliberalen Ordnung.
