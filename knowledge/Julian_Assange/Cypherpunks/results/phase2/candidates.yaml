  - id: 3597b61e-3036-5c85-a1a4-cdda12f7d540
    title: Zentralisierung als Rücknahme der Druckerpresse
    core: Zentralisierung von Informationsdiensten macht die Erfindung der
      Druckerpresse rückgängig, weil der Zugang zu Wissen dann an ein bestimmtes
      Gerät oder einen bestimmten Anbieter gebunden ist statt an eine
