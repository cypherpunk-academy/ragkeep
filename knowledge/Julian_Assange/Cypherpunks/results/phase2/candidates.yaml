    occurrences: []
  - id: 0de6c0bf-bcdb-5250-bdfc-f31d6ad5e7be
    title: Selbstzensur als Preis des Nichtkönnens
    core: Wer angesichts der Überwachung nicht lernt, schützende Technik selbst zu
