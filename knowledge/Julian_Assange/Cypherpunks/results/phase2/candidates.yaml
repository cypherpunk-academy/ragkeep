  - id: 259c229e-5bef-5ec6-8154-f3f1b5ed220f
    title: "Vom taktischen zum strategischen Abfangen: Verdacht wird durch Vorrat
      ersetzt"
    core: Die Überwachung hat sich von der gezielten Verfolgung Verdächtiger zum
      unterschiedslosen Abschöpfen und Aufbewahren aller Kommunikation
      verschoben, weil man erst im Nachhinein sortiert – Verdacht wird damit
      durch Speicherkapazität ersetzt.
