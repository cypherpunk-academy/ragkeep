  - id: 91773957-e35f-58c6-84d4-0c5dfdc8328e
    title: Zensur erfordert Überwachung und erzeugt Selbstzensur
    core: "Zensur ist technisch nicht von Überwachung zu trennen: Um zu prüfen, ob
      ein Inhalt erlaubt ist, muss das System ihn sehen, und was es sieht, kann
      es speichern – die eigentliche Wirkung ist die Verhaltensänderung der
      Wissenden."
    type: verbindung
    source_id: Julian_Assange_Cypherpunks
    segment_id: Julian_Assange_Cypherpunks
    paragraphs: "122"
    evidence: '"Um zu kontrollieren, was sich jemand ansieht, um zu sehen, ob das
      erlaubt ist oder verboten, musst du es sehen, und weil du es sehen kannst,
      kannst du es auch speichern."'
    interwoven_with: []
    occurrences:
