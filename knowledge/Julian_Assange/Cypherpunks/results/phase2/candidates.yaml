  - id: be565df5-4f0c-566d-8be4-c3928d4fe65e
    title: Die Geschwindigkeit der Konsensbildung als Waffe, die sich gegen ihre
      Urheber we
    core: Massenkommunikation erzeugt einen Vorsprung bei der Konsensbildung, der
      den Staat überraschen kann; derselbe Vorsprung kehrt sich um, wenn die
      Bewegung scheitert, weil dann die nämliche Infrastruktur zur Verfolgung
      aller Initiatoren dient.
    type: umkehrung
    source_id: Julian_Assange_Cypherpunks
    segment_id: Julian_Assange_Cypherpunks
    paragraphs: 27-28
    evidence: '"falls man unterliegen sollte, wird eben jene Infrastruktur, die so
      schnell die Bildung eines Konsenses erlaubte hatte, dazu benutzt werden,
      um sämtliche Initiatoren aufzuspüren und auszuschalten."'
