    occurrences: []
  - id: b8641875-ac5d-558d-91bb-bbb197e2d860
    title: "Vom Lesenlernen zum Schreibenlernen: das Netz als neue Ausdrucksfähigkeit"
    core: Die Druckerpresse lehrte die Menschen lesen, das Netz lehrt sie schreiben;
      damit entsteht eine neue, allen zugängliche Ausdrucksfähigkeit, die nicht
      über Partei, Verlag oder Avantgarde kanalisiert werden muss.
    type: ausdruck
    source_id: Julian_Assange_Cypherpunks
    segment_id: Julian_Assange_Cypherpunks
    paragraphs: "86"
    evidence: '"Die Druckerpresse hat die Menschen lesen gelehrt; das Internet lehrt
      die Menschen zu schreiben."'
    interwoven_with: []
    occurrences: []
  - id: 21c01f78-59a8-5b05-9137-ec7443e72239
    title: Die Bankenblockade als staatlich erzeugte Marktmacht
    core: Die Bankenblockade gegen WikiLeaks war kein Marktereignis, sondern das
      Ergebnis staatlicher Regulierung, die einzelne Finanzakteure zu Königen
      gemacht hat; wer das Tauschmedium kontrolliert, kontrolliert damit auch,
      was Menschen tun dürfen.
    type: umkehrung
    source_id: Julian_Assange_Cypherpunks
    segment_id: Julian_Assange_Cypherpunks
    paragraphs: "101"
    evidence: '"ist es nicht der freie Markt gewesen, der beschlossen hat, WikiLeaks
      zu blockieren, weil es gar kein freier Markt ist – staatliche Regulierung
      hat aus bestimmten Finanzspielern Könige gemacht"'
    interwoven_with: []
    occurrences: []
  - id: a3a35365-d663-565d-b501-1b5c8151f709
    title: "Reichweite gegen Vertraulichkeit: die Doppelbilanz der drei Freiheiten
      im Netz"
    core: Beim Übergang ins Netz bleibt die Bewegungsfreiheit gleich, die
      Kommunikationsfreiheit wächst an Reichweite und schrumpft zugleich durch
      den Verlust der Privatheit, und die wirtschaftliche Freiheit erleidet
      denselben Verlust – der Zugewinn an Reichweite wird mit dem Verlust an
      Vertraulichkeit bezahlt.
    type: unterscheidung
    source_id: Julian_Assange_Cypherpunks
    segment_id: Julian_Assange_Cypherpunks
    paragraphs: "106"
    evidence: '"Die Freiheit der Kommunikation ist in mancher Hinsicht unerhört
      gestiegen ... andererseits ist sie auch ungeheuer herabgesunken, weil es
      keinen Schutz der Privatsphäre mehr gibt"'
    interwoven_with: []
    occurrences: []
  - id: babe4d40-4c53-509c-a0d4-eb3593a19501
    title: Vertrauen durch Rechenkosten statt durch Recht und Prüfung
    core: "Bitcoin verlegt die Durchsetzung von Vertrauen aus Gesetz, Regulierung
      und Prüfung in die Architektur selbst: Rechenleistung kostet Strom, Betrug
      wird teurer als sein Nutzen, und Vertrauen wird auf viele Teilnehmer
      verteilt statt an einer Stelle erzwingbar zu sein."
    type: verbindung
    source_id: Julian_Assange_Cypherpunks
    segment_id: Julian_Assange_Cypherpunks
    paragraphs: "108"
    evidence: '"Die Durchsetzung ehrbaren Bitcoin-»Bankings« ist also in die
      Architektur des Systems eingebaut."'
    interwoven_with: []
    occurrences: []
  - id: 4b8eb472-332c-5c19-8634-32a248bc8d86
    title: Privatsphäre als käufliches Gut, im Netz wie davor
    core: "Datenschutz war nie eine Frage des Mediums, sondern des Geldes: Wer reich
      ist, kauft sich Vertraulichkeit, wer arm ist, hat sie nicht – und das Netz
      setzt diesen vor-digitalen Trend nur fort."
    type: umkehrung
    source_id: Julian_Assange_Cypherpunks
    segment_id: Julian_Assange_Cypherpunks
