  - id: bf96f928-7bb1-58dc-880b-a3976929b2dc
    title: "Der abgeschlagene Kopf und die Wurmfortsätze: Sieg im Parlament,
      Weiterleben im "
    core: "Ein demokratischer Sieg an der Oberfläche beendet die Sache nicht: Wird
      ein Abkommen öffentlich gestoppt, wandert sein Inhalt in geheime
      bilaterale Verträge, sodass der demokratische Prozess umgangen wird, ohne
