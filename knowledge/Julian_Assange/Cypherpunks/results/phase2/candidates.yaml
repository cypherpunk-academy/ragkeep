        segment_id: Julian_Assange_Cypherpunks
        paragraphs: 127-128
  - id: ee26b8b5-cd66-5ca8-b125-7d626295d5ac
    title: "Spurlose Ausradierung: die unnachweisbare Zensur des Westens"
    core: "Zensur im Westen arbeitet nicht durch sichtbare Korrektur, sondern durch
      spurloses Entfernen aus Archiven und Indizes: Die Geschichte wird nicht
      verändert, sie hat nachträglich nie existiert, was schwerer nachweisbar
      ist als die offene sowjetische Richtigkeitsklebung."
    type: unterscheidung
    source_id: Julian_Assange_Cypherpunks
    segment_id: Julian_Assange_Cypherpunks
    paragraphs: 123-124
    evidence: '"Die Geschichte wird nicht nur verändert, sie hat niemals existiert."'
