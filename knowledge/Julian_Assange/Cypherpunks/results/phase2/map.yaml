        note: Absätze 23–26. Weiter bei 27. Letzter Absatz ist 159.
      - round: 7
        tool: record_thought
        title: Kryptografie als physikalisch verbürgte Grenze gegen staatlichen Zugriff
        core: Weil das Universum das Verschlüsseln leichter macht als das Entschlüsseln, lässt
          sich daraus ein Rechtsraum bauen, dessen Grenze nicht politisch gesetzt,
          sondern durch Rechenaufwand verteidigt wird – der Staat kann in ihn nur
          eindringen, wenn er unendliche Mittel aufwendet.
        type: verbindung
        paragraphs:
          - 8
          - 10
          - 11
        evidence: '"Das Universum nämlich ist ein Freund der Kryptografie. Es ist leichter,
          Informationen zu verschlüsseln, als sie wieder zu entschlüsseln."'
        note: Abgelegt als Gedanke 1. Lies weiter oder rufe done auf.
      - round: 8
        tool: record_thought
        title: Verschlüsselung als gewaltloser Widerstand, der Gewalt an einer mathematischen
          Schranke endet
        core: Starke Verschlüsselung ist die stärkste Form gewaltlosen Widerstands, weil Zwang
          prinzipiell kein mathematisches Problem lösen kann und damit unbegrenzte
          Gewalt an einer Rechenaufgabe ihre Grenze findet.
        type: umkehrung
        paragraphs:
          - 11
          - 12
        interwoven_with:
          - 1
        evidence: '"Starke Kryptografie vermag schrankenloser Gewalt standzuhalten, weil kein
          Maß an Zwang je ein mathematisches Problem aus der Welt schaffen könnte."'
        note: Abgelegt als Gedanke 2. Lies weiter oder rufe done auf.
      - round: 9
        tool: read
        from: 27
        count: 12
        note: Absätze 27–30. Weiter bei 31. Letzter Absatz ist 159.
      - round: 10
        tool: record_thought
        title: Die Geschwindigkeit der Konsensbildung als Waffe, die sich gegen ihre Urheber
          wendet
        core: Massenkommunikation erzeugt einen Vorsprung bei der Konsensbildung, der den Staat
          überraschen kann; derselbe Vorsprung kehrt sich um, wenn die Bewegung
          scheitert, weil dann die nämliche Infrastruktur zur Verfolgung aller
          Initiatoren dient.
        type: umkehrung
        paragraphs:
          - 27
          - 28
        evidence: '"falls man unterliegen sollte, wird eben jene Infrastruktur, die so schnell
          die Bildung eines Konsenses erlaubte hatte, dazu benutzt werden, um sämtliche
          Initiatoren aufzuspüren und auszuschalten."'
        note: Abgelegt als Gedanke 3. Lies weiter oder rufe done auf.
      - round: 11
        tool: record_thought
        title: Technik als systematisierte Interaktion und als Motor der Kontrollzentralisierung
        core: Technik ist nicht das Gerät, sondern systematisierte Interaktion; wer über die
          physischen Ressourcen einer Technik verfügt, zentralisiert Kontrolle, weshalb
          Technikgeschichte eher Herrschaft verfestigt als demokratisiert.
        type: begriff
        paragraphs:
          - 30
        evidence: '"In diesem Sinn ist Technik systematisierte Interaktion. Feudalsysteme haben
          sich zum Beispiel, wie es scheint, aus der Mühlentechnik entwickelt."'
        note: Abgelegt als Gedanke 4. Lies weiter oder rufe done auf.
      - round: 12
        tool: read
        from: 31
        count: 12
        note: Absätze 31–32. Weiter bei 33. Letzter Absatz ist 159.
      - round: 13
        tool: record_thought
        title: Die netzinterne Freiheit als Gipfel der neoliberalen Ordnung
        core: Die Freiheit des Netzes ruht auf der am strengsten hierarchisierten, staatlich
          durchsetzten Industrie überhaupt; der High-Tech-Kommunikationsraum ist damit
          der Gipfel und nicht der Gegner der neoliberalen Ordnung.
        type: umkehrung
        paragraphs:
          - 31
        interwoven_with:
          - 0
        evidence: '"Der High-Tech-Kommunikationsrevolution – und der Freiheit, die wir aus ihr
          gewonnen haben – liegt also die ganze neoliberale, transnationale,
          globalisierte moderne Marktwirtschaft zugrunde."'
        note: Abgelegt als Gedanke 5. Lies weiter oder rufe done auf.
      - round: 14
        tool: read
        from: 33
        count: 12
        note: Absätze 33–34. Weiter bei 35. Letzter Absatz ist 159.
      - round: 15
        tool: read
        from: 35
        count: 12
        note: Absätze 35–36. Weiter bei 37. Letzter Absatz ist 159.
      - round: 16
        tool: record_thought
        title: "Militarisierung des Zivillebens: der unsichtbare Panzer im Schlafzimmer"
        core: Die private, familiäre Kommunikation ist in eine militärisch besetzte Zone
          umgezogen, ohne dass die Besatzung sichtbar wäre; Zivilraum und Kriegsraum
          sind damit nicht mehr getrennt, sondern dasselbe Netz.
        type: ausdruck
        paragraphs:
          - 35
        interwoven_with:
          - 0
        evidence: '"Es ist, als hätte man einen Panzer im Schlafzimmer. Beim Simsen steht ein
          Soldat zwischen dir und deiner Frau."'
        note: Abgelegt als Gedanke 6. Lies weiter oder rufe done auf.
      - round: 17
        tool: read
        from: 37
        count: 12
        note: Absätze 37–42. Weiter bei 43. Letzter Absatz ist 159.
      - round: 18
        tool: record_thought
        title: "Vom taktischen zum strategischen Abfangen: Verdacht wird durch Vorrat ersetzt"
        core: Die Überwachung hat sich von der gezielten Verfolgung Verdächtiger zum
          unterschiedslosen Abschöpfen und Aufbewahren aller Kommunikation verschoben,
          weil man erst im Nachhinein sortiert – Verdacht wird damit durch
          Speicherkapazität ersetzt.
        type: unterscheidung
        paragraphs:
          - 39
          - 40
        evidence: '"Heutzutage hält man es für viel effizienter zu sagen: »Wir greifen alles ab,
          sortieren können wir es später.«"'
        note: Abgelegt als Gedanke 7. Lies weiter oder rufe done auf.
      - round: 19
        tool: read
        from: 43
        count: 12
        note: Absätze 43–46. Weiter bei 47. Letzter Absatz ist 159.
      - round: 20
        tool: record_thought
        title: "Physik oder Gesetz: warum nur der technische Schutz gegen strategische
          Überwachung trägt"
        core: Gegen Massenüberwachung gibt es zwei Schutzwege – physikalische Gesetze oder
          menschliche Gesetze –, und beim strategischen Abschöpfen versagt der zweite
          grundsätzlich, weil Komplexität und Geheimhaltung Aufsicht strukturell
          ausschließen.
        type: unterscheidung
        paragraphs:
          - 43
        interwoven_with:
          - 1
          - 7
        evidence: '"Man kann sich dagegen mit den Gesetzen der Physik oder mit den Gesetzen des
          Menschen schützen."'
        note: Abgelegt als Gedanke 8. Lies weiter oder rufe done auf.
      - round: 21
        tool: read
        from: 47
        count: 12
        note: Absätze 47–48. Weiter bei 49. Letzter Absatz ist 159.
      - round: 22
        tool: record_thought
        title: Überwachungskapazität wächst schneller als die Bevölkerung
        core: Die Überwachungskapazität wächst alle achtzehn Monate, die Bevölkerung alle
          fünfundzwanzig Jahre, sodass die Überwachungskurve die Bevölkerungsentwicklung
          dauerhaft überholt und ein Aufholen durch bloßes Abwarten unmöglich wird.
        type: verbindung
        paragraphs:
          - 47
        interwoven_with:
          - 7
        evidence: '"die Überwachungskapazität aber verdoppelt sich alle 18 Monate. Die
          Überwachungskurve dominiert die Bevölkerungskurve."'
        note: Abgelegt als Gedanke 9. Lies weiter oder rufe done auf.
      - round: 23
        tool: record_thought
        title: "Die Asymmetrie der Exportkontrollen: Schutz verboten, Überwachung erlaubt"
        core: Waffenexportkontrolle verbietet gerade die Verschlüsselung, die den Bürger
          schützt, während Überwachungsgeräte frei handelbar bleiben – weil auch
          demokratische Staaten am Wissen aus fremder Überwachung interessiert sind.
        type: umkehrung
        paragraphs:
          - 36
          - 47
        interwoven_with:
          - 8
        evidence: '"du darfst in diejenigen Länder ... keine Verschlüsselungstechnologie
          exportieren, die vor Überwachungstechnologie schützt. Aber wenn du ein Händler
          von Überwachungsausrüstung bist, dann darfst du die international verkaufen."'
        note: Abgelegt als Gedanke 10. Lies weiter oder rufe done auf.
      - round: 24
        tool: read
        from: 49
        count: 12
        note: Absätze 49–54. Weiter bei 55. Letzter Absatz ist 159.
      - round: 25
        tool: record_thought
        title: Verwischung von Staat und Unternehmen im Überwachungsverbund
        core: "Die Grenze zwischen Staat und Privatwirtschaft ist im Überwachungsgeschäft
          eingeebnet: weil Geheimdienste auf die Datenbestände von Google und Facebook
          zugreifen, werden diese Konzerne zu verlängerten Armen der Dienste."
        type: verbindung
        paragraphs:
          - 53
        interwoven_with:
          - 7
        evidence: '"Somit sind Facebook und Google in gewisser Weise die verlängerten Arme
          dieser Geheimdienste."'
        note: Abgelegt als Gedanke 11. Lies weiter oder rufe done auf.
      - round: 26
        tool: read
        from: 55
        count: 12
        note: Absätze 55–56. Weiter bei 57. Letzter Absatz ist 159.
      - round: 27
        tool: record_thought
        title: "Die Dritt-Doktrin: im Netz ist jeder ein Dritter, also niemand geschützt"
        core: Die Gerichte begründen fehlenden Datenschutz damit, dass man durch die Nutzung
          eines Dienstes dessen Betreiber zum Dritten macht und damit angeblich
          freiwillig preisgibt – obwohl im Netz jeder ein Dritter ist, sodass der
          Schutzbegriff sich selbst aufhebt.
        type: umkehrung
        paragraphs:
          - 55
        interwoven_with:
          - 11
        evidence: '"hat das Gericht erklärt, dass man im Internet keine Privatsphäre erwarten
          darf, wenn man bereit ist, Informationen an Dritte zu offenbaren. Nebenbei
          bemerkt: Jeder im Internet ist ein Dritter."'
        note: Abgelegt als Gedanke 12. Lies weiter oder rufe done auf.
      - round: 28
        tool: record_thought
        title: "Demokratisierte Überwachung: Belohnungskultur statt bezahlter Spitzel"
        core: Facebook demokratisiert die Überwachung, indem es statt bezahlter Spitzel eine
          Belohnungskultur setzt, in der die Nutzer einander freiwillig melden und dabei
          mit sozialer Anerkennung entlohnt werden.
        type: umkehrung
        paragraphs:
          - 30
          - 56
        interwoven_with:
          - 11
        evidence: '"Statt die Leute für Spitzeldienste zu bezahlen, wie es die Stasi in
          Ostdeutschland gemacht hat, entlohnen wir sie mittels einer
          Gratifikationskultur"'
        note: Abgelegt als Gedanke 13. Lies weiter oder rufe done auf.
      - round: 29
        tool: read
        from: 57
        count: 12
        note: Absätze 57–60. Weiter bei 61. Letzter Absatz ist 159.
      - round: 30
        tool: record_thought
        title: Kryptografie als das Waffenrecht der digitalen Welt
        core: "Kryptografie übernimmt in der digitalen Welt die Rolle, die der zweite
          Verfassungszusatz den Waffen zuschreibt: nicht Vertrauen in die Regierung,
          sondern ein in eigener Hand liegendes Mittel, das den Einbruch in die eigene
          Kommunikation abwehrt."
        type: verbindung
        paragraphs:
          - 60
        interwoven_with:
          - 2
        evidence: '"müssen wir selbst die nötigen Werkzeuge schaffen, kryptografische Tools, die
          wir in der Hand haben, als eine Art Gewaltmittel"'
        note: Abgelegt als Gedanke 14. Lies weiter oder rufe done auf.
      - round: 31
        tool: read
        from: 61
        count: 12
        note: Absätze 61–61. Weiter bei 62. Letzter Absatz ist 159.
      - round: 32
        tool: record_thought
        title: Der Rückzug aus dem Netz als Selbstentmachtung
        core: "Der Verzicht auf Netznutzung ist keine Freiheit, sondern Entmachtung: Wer offline
          bleibt, verliert gerade die Möglichkeit, Einfluss zu nehmen, weshalb der
          Ausweg nicht im Rückzug, sondern im gesicherten Bleiben liegt."
        type: umkehrung
        paragraphs:
          - 61
        interwoven_with:
          - 2
        evidence: '"Natürlich kann sich jeder vom Internet fernhalten, aber dann ist es schwer,
          irgendeinen Einfluss zu haben. Wer es tut, beraubt sich seiner eigenen
          Einflussmöglichkeiten."'
        note: Abgelegt als Gedanke 15. Lies weiter oder rufe done auf.
      - round: 33
        tool: record_thought
        title: Die Industrie als Schutzmacht der Kryptografie
        core: Kryptografie verbreitet sich, weil Unternehmen ihre transnationalen Datenströme
          absichern müssen; der wirtschaftliche Eigennutz der Konzerne wird so zur
          Machtbasis, die verhindert, dass Verschlüsselung politisch verboten wird.
        type: verbindung
        paragraphs:
          - 61
        interwoven_with:
          - 5
          - 14
        evidence: '"Dadurch gewinnt die Kryptografie eine Machtbasis in der Industrie, die
          verhindert, dass sie verbannt wird."'
        note: Abgelegt als Gedanke 16. Lies weiter oder rufe done auf.
      - round: 34
        tool: read
        from: 62
        count: 12
        note: Absätze 62–69. Weiter bei 70. Letzter Absatz ist 159.
      - round: 35
        tool: record_thought
        title: Selbstzensur als Preis des Nichtkönnens
        core: Wer angesichts der Überwachung nicht lernt, schützende Technik selbst zu
          beherrschen, verfällt in universelle Selbstzensur und meldet sich als
          politischer Akteur von der Welt ab – Anpassung oder Werkzeugbeherrschung sind
          die beiden einzigen Wege.
        type: unterscheidung
        paragraphs:
          - 62
        interwoven_with:
          - 8
          - 15
        evidence: '"Wenn die Leute nicht diesen zweiten Schritt gehen, dann wird politischer
          Konformismus zu einer universellen Erscheinung"'
        note: Abgelegt als Gedanke 17. Lies weiter oder rufe done auf.
      - round: 36
        tool: read
        from: 70
        count: 12
        note: Absätze 70–73. Weiter bei 74. Letzter Absatz ist 159.
      - round: 37
        tool: record_thought
        title: Internetzeit als Gegenrhythmus zur medialen Kurzfristigkeit
        core: "Das Netz vergisst nicht, und daraus entsteht eine eigene Zeitform: gegen den
          24-Stunden-Takt der Medienerzählungen lassen sich über Jahre Dossiers
          aufbauen, die politische Mythen Schritt für Schritt widerlegen."
        type: begriff
        paragraphs:
          - 73
        interwoven_with:
          - 3
        evidence: '"Beim Internet habe ich das Gefühl, dass wir etwas schaffen, was ich
          Internetzeit nenne."'
        note: Abgelegt als Gedanke 18. Lies weiter oder rufe done auf.
      - round: 38
        tool: read
        from: 74
        count: 12
        note: Absätze 74–76. Weiter bei 77. Letzter Absatz ist 159.
      - round: 39
        tool: record_thought
        title: "Der abgeschlagene Kopf und die Wurmfortsätze: Sieg im Parlament, Weiterleben im
          Geheimen"
        core: "Ein demokratischer Sieg an der Oberfläche beendet die Sache nicht: Wird ein
          Abkommen öffentlich gestoppt, wandert sein Inhalt in geheime bilaterale
          Verträge, sodass der demokratische Prozess umgangen wird, ohne dass der Sieg
          verloren scheint."
        type: ausdruck
        paragraphs:
          - 74
        interwoven_with:
          - 18
        evidence: '"Der Kopf von ACTA mag abgeschlagen sein, aber der Rumpf könnte sich sehr
          wohl in ein paar neue Wurmfortsätze teilen"'
        note: Abgelegt als Gedanke 19. Lies weiter oder rufe done auf.
      - round: 40
        tool: read
        from: 77
        count: 12
        note: Absätze 77–82. Weiter bei 83. Letzter Absatz ist 159.
      - round: 41
        tool: record_thought
        title: Ökonomische Effizienz als Ursache der Zentralisierung und damit der
          Kontrollierbarkeit
        core: Zentralisierte Serverballungen setzen sich im Wettbewerb durch, weil sie billiger
          sind, und schaffen damit genau die wenigen Angriffspunkte, an denen staatliche
          Überwachung ansetzt – die Architektur, nicht die Absicht entscheidet über
          Kontrollierbarkeit.
        type: verbindung
        paragraphs:
          - 75
          - 76
          - 77
        interwoven_with:
          - 0
          - 11
        evidence: '"Das Internet könnte ohne diese Zentralisierung auskommen, es ist nicht so,
          dass es technisch unmöglich wäre, es ist schlicht effizienter, alles zu
          zentralisieren. Im wirtschaftlichen Wettbewerb trägt die zentralisierte
          Version den Sieg davon."'
        note: Abgelegt als Gedanke 20. Lies weiter oder rufe done auf.
      - round: 42
        tool: record_thought
        title: Von konkurrierenden Staaten zur verschmolzenen transnationalen Elite
        core: Die Hoffnung auf Rettung durch konkurrierende Regierungen trägt nicht mehr, weil
          nationale Eliten sich nicht länger bekämpfen, sondern sich miteinander
          verbinden und von ihren Bevölkerungen lösen.
        type: umkehrung
        paragraphs:
          - 77
          - 78
        interwoven_with:
          - 11
        evidence: '"einst haben wir nationale Eliten gehabt, die miteinander konkurriert haben,
          und heute verbinden die sich miteinander und lösen sich von ihren jeweiligen
          Bevölkerungen."'
        note: Abgelegt als Gedanke 21. Lies weiter oder rufe done auf.
      - round: 43
        tool: read
        from: 83
        count: 12
        note: Absätze 83–86. Weiter bei 87. Letzter Absatz ist 159.
      - round: 44
        tool: record_thought
        title: Zentralisierung als Rücknahme der Druckerpresse
        core: Zentralisierung von Informationsdiensten macht die Erfindung der Druckerpresse
          rückgängig, weil der Zugang zu Wissen dann an ein bestimmtes Gerät oder einen
          bestimmten Anbieter gebunden ist statt an eine Allzweckmaschine.
        type: umkehrung
        paragraphs:
          - 85
        interwoven_with:
          - 20
        evidence: '"wenn wir anfangen, die Kontrolle über Informationssysteme zu zentralisieren,
          fangen wir tatsächlich an, die Erfindung der Druckerpresse rückgängig zu
          machen"'
        note: Abgelegt als Gedanke 22. Lies weiter oder rufe done auf.
      - round: 45
        tool: record_thought
        title: "Vom Lesenlernen zum Schreibenlernen: das Netz als neue Ausdrucksfähigkeit"
        core: Die Druckerpresse lehrte die Menschen lesen, das Netz lehrt sie schreiben; damit
          entsteht eine neue, allen zugängliche Ausdrucksfähigkeit, die nicht über
          Partei, Verlag oder Avantgarde kanalisiert werden muss.
        type: ausdruck
        paragraphs:
          - 86
        interwoven_with:
          - 22
        evidence: '"Die Druckerpresse hat die Menschen lesen gelehrt; das Internet lehrt die
          Menschen zu schreiben."'
        note: Abgelegt als Gedanke 23. Lies weiter oder rufe done auf.
      - round: 46
        tool: read
        from: 87
        count: 12
        note: Absätze 87–98. Weiter bei 99. Letzter Absatz ist 159.
      - round: 47
        tool: record_thought
        title: Drei Infrastrukturen der Staatlichkeit als drei Grundfreiheiten
        core: Staatlichkeit lässt sich an drei Infrastrukturen messen – Kontrolle über
          Streitkräfte, über Kommunikation und über Finanzen –, und dieselben drei
          werden zu den Grundfreiheiten der Bewegung, des Denkens und des Wirtschaftens,
          deren Schutz jeweils Privatheit voraussetzt.
        type: verbindung
        paragraphs:
          - 87
          - 88
        interwoven_with:
          - 0
          - 8
        evidence: '"Die Hisbollah verfügt also über die drei wesentlichen Attribute der
          Staatlichkeit ... Das können wir uns auch als drei grundlegende Freiheiten
          denken."'
        note: Abgelegt als Gedanke 24. Lies weiter oder rufe done auf.
      - round: 48
        tool: record_thought
        title: Die Architektur ist die Wahrheit
        core: "Nicht die Absichten der Betreiber, sondern die Architektur entscheidet über die
          politische Wirkung: zentralisierte Systeme ziehen Machtmissbrauch an, auch
          wenn anfangs anständige Leute sie entwerfen."
        type: umkehrung
        paragraphs:
          - 95
          - 96
        interwoven_with:
          - 20
          - 22
        evidence: '"Die Architektur ist die Wahrheit." / "Wenn du also eine zentralisierte
          Architektur hast, selbst wenn die besten Leute auf der Welt sie kontrollieren,
          zieht sie Arschlöcher an"'
        note: Abgelegt als Gedanke 25. Lies weiter oder rufe done auf.
      - round: 49
        tool: read
        from: 99
        count: 12
        note: Absätze 99–105. Weiter bei 106. Letzter Absatz ist 159.
      - round: 50
        tool: record_thought
        title: Die Bankenblockade als staatlich erzeugte Marktmacht
        core: Die Bankenblockade gegen WikiLeaks war kein Marktereignis, sondern das Ergebnis
          staatlicher Regulierung, die einzelne Finanzakteure zu Königen gemacht hat;
          wer das Tauschmedium kontrolliert, kontrolliert damit auch, was Menschen tun
          dürfen.
        type: umkehrung
        paragraphs:
          - 101
        interwoven_with:
          - 24
        evidence: '"ist es nicht der freie Markt gewesen, der beschlossen hat, WikiLeaks zu
          blockieren, weil es gar kein freier Markt ist – staatliche Regulierung hat aus
          bestimmten Finanzspielern Könige gemacht"'
        note: Abgelegt als Gedanke 26. Lies weiter oder rufe done auf.
      - round: 51
        tool: read
        from: 106
        count: 12
        note: Absätze 106–107. Weiter bei 108. Letzter Absatz ist 159.
      - round: 52
        tool: record_thought
        title: "Reichweite gegen Vertraulichkeit: die Doppelbilanz der drei Freiheiten im Netz"
        core: Beim Übergang ins Netz bleibt die Bewegungsfreiheit gleich, die
          Kommunikationsfreiheit wächst an Reichweite und schrumpft zugleich durch den
          Verlust der Privatheit, und die wirtschaftliche Freiheit erleidet denselben
          Verlust – der Zugewinn an Reichweite wird mit dem Verlust an Vertraulichkeit
          bezahlt.
        type: unterscheidung
        paragraphs:
          - 106
        interwoven_with:
          - 24
        evidence: '"Die Freiheit der Kommunikation ist in mancher Hinsicht unerhört gestiegen
          ... andererseits ist sie auch ungeheuer herabgesunken, weil es keinen Schutz
          der Privatsphäre mehr gibt"'
