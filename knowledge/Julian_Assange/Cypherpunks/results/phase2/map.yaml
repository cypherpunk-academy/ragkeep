      - round: 3
        tool: record_thought
        title: Das Internet als platonisches Reich, das auf physischen Fundamenten ruht
        core: Das Netz erscheint als körperloser Raum zirkulierender Ideen, ist aber auf Kabel,
          Satelliten und Serverhallen gegründet; wer diese physische Basis kontrolliert,
          beherrscht den scheinbar körperlosen Raum.
        type: unterscheidung
        paragraphs:
          - 4
          - 5
          - 7
        evidence: '"Das platonische Wesen des Internets mit seinen zirkulierenden Ideen und
          Informationen wird durch seine physischen Ursprünge besudelt."'
        note: Abgelegt als Gedanke 0. Lies weiter oder rufe done auf.
      - round: 4
        tool: read
        from: 16
        count: 12
        note: Absätze 16–18. Weiter bei 19. Letzter Absatz ist 159.
      - round: 5
