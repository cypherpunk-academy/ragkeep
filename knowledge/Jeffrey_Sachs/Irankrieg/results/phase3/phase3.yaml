    - id: 4a88818e-7c34-5a09-bcda-18cf09b6f407
      grund: Rahmen der Sendung (Freiheitsrhetorik) ist eine Beobachtung zur Inszenierung,
        nicht zum Argument.
    - id: 8187ec67-8c85-55e1-95ab-2ee0937847ff
      grund: Chips statt Schutzschild; Detail zur Golf-Käuflichkeit ohne tragende Funktion.
    - id: 3dcaab08-82b5-5bce-b0ca-fa74454f0768
      grund: Sunk-cost-Falle als politisch-psychologisches Gesetz; Erklärung für Fortsetzung,
        die im Faden keinen Ort hat.
    - id: 0135931e-3ab6-5092-a749-ff5bdabce6b3
      grund: Militärisch-industrieller Komplex und Powell/Citizens United; innenpolitische
        Ursachenliste ohne Anschluss an die Irankrieg-Argumentation.
    - id: 0e9109bd-c840-5d27-ba08-030e27c8bdc3
      grund: Mondale-Lektion zur Steuererhöhung; Anekdote zur Schuldenursache, die keine
        Kernaussage trägt.
