phase3:
  source_id: jeffrey-sachs-irankrieg
  gattung: monolog
  leitgedanke:
    rationale: "Folgt aus K1–K8: erfundener Krieg, Empire-Kontinuität, Vorwand JCPOA,
      fehlender Off-Ramp, Partnerschaft mit Israel, ökonomische Kaskade,
      Verfahrensverlust."
    text: Der Irankrieg ist ein erfundener, aus einer falsch übertragenen Vorlage kopierter
      Krieg, der einer jahrzehntelangen Empire-Logik folgt und dessen Atomvorwurf durch
      das zerstörte JCPOA widerlegt ist; weil die andere Seite nicht als
      Gesprächspartner gedacht wird, gibt es keinen Ausstieg, und weil Verfahren und
      Deliberation fehlen, führt die Zerstörung der Golfinfrastruktur über Dünger und
      Nahrung in eine Finanzkaskade, die niemand mehr kontrolliert.
  kernaussagen:
    - id: K1
      rationale: Kandidaten 7eff8908 (künstlicher Krieg) und c9b840d8 (Venezuela-Modell)
        begründen gemeinsam die These, dass der Krieg nicht aus einem Konflikt, sondern
        aus einer Entscheidung und einer falsch übertragenen Vorlage stammt.
      text: Der Irankrieg ist kein Ergebnis einer Krise, sondern eine erfundene Entscheidung,
        die das venezolanische Rezept der Bestechung und des Umsturzes auf einen Fall
        überträgt, in dem die Machtverhältnisse nicht stimmen.
      paragraphs: 4-6
      candidates:
        - 7eff8908-dce7-5ae5-8133-53ebf44528f1
        - c9b840d8-3331-57f1-920a-80ba29c09350
      sprecher: []
      strittig: false
    - id: K2
      rationale: dfba950c und 8e0053a4 tragen die Ausgangsdiagnose; 4f6da83f, ff0ce251 und
        d7116938 liefern die Zerstörungs- und Kaskadenlogik, 20efaa84 die Umkehrung.
      text: Die geschlossene Straße von Hormus nimmt über Düngemittel, Petrochemie und
        Aluminium die Weltwirtschaft in Geiselhaft, und weil diesmal nicht der Ölfluss
        gestoppt, sondern die Infrastruktur zerstört wird, folgt über Erdgas, Ammoniak
        und Dünger eine Nahrungsmittelkrise, die in einer Kaskade von der Realwirtschaft
        auf die Finanzmärkte übergreift — während die Zeit gegen die Option des späteren
        Ausscherens arbeitet.
      paragraphs: 1-3,16,229-246
      candidates:
        - dfba950c-68ee-5c46-92bd-b5094e673954
        - 8e0053a4-3684-5be3-ae6e-9b92686fe4a4
        - 20efaa84-3b03-55e6-9c22-05891efd8277
        - 4f6da83f-cb88-55b2-9327-c7571df402f8
        - ff0ce251-915c-5331-8adb-498063b57fa1
        - d7116938-c830-5ec5-829b-71b90d5b572d
      sprecher: []
      strittig: false
    - id: K3
      rationale: b5767135 (1953), f6b3a96d (Normalisierung) und 205c2823 (Böse-Achse als
        Erzählprodukt) belegen die Strukturdiagnose einer über Jahrzehnte eingeübten
        Empire-Praxis.
      text: Der Konflikt folgt einer über fünf Administrationen eingeübten Empire-Praxis, die
        seit dem Putsch von 1953 Souveränität als Reputationsfrage behandelt und
        Normverletzungen durch Wiederholung zur Norm macht.
      paragraphs: 27-33
      candidates:
        - b5767135-aa92-5fda-a00c-97317da2ece9
        - f6b3a96d-57f9-5135-aeaf-3d0117dbff4a
        - 205c2823-8e85-5811-a484-8d9f3a9615a2
      sprecher: []
      strittig: false
    - id: K4
      rationale: efc91cad (Clean Break), ac9f27e0 (sieben Kriege) und 093d99de (ersetzter
        Feind) zeigen den Krieg als Glied eines Plans mit empirischer Bilanz.
      text: Der Irankrieg ist die konsequente Anwendung der „Clean Break“-Strategie, die
        Gegner eine Ebene höher bei ihren Unterstützerstaaten bekämpft, und reiht sich
        in eine Serie von sieben Kriegen ein, von denen sechs bereits im Chaos versunken
        sind.
      paragraphs: 66-77,105-108
      candidates:
        - efc91cad-4622-5d72-9a48-373d3cad0ea8
        - ac9f27e0-9dc5-5318-9be2-c78ac0bbbdbe
        - 093d99de-ab0e-5073-a649-fdaf8e147295
      sprecher: []
      strittig: false
    - id: K5
      rationale: 16085173 (zerstörtes JCPOA) und 0afaa8ce (zwei Motive) belegen, dass der
        Atomvorwurf Vorwand ist und die Motive Reputation und regionale Dominanz
        auseinanderfallen.
      text: "Der Atomvorwurf ist ein Vorwand, den die eigene Geschichte widerlegt: Das 2015
        einstimmig gebilligte JCPOA lieferte genau die Lösung, die heute erzwungen
        werden soll, während die USA einen Abtrünnigen zurückholen und Israel
        vollständige militärische Dominanz in Westasien will."
      paragraphs: 51-58
      candidates:
        - 16085173-4ab9-574a-8397-584ea30051a8
        - 0afaa8ce-fba4-5062-b9be-4c8f0cd2c8ae
      sprecher: []
      strittig: false
    - id: K6
      rationale: 48fd076d (fehlende Anerkennung), cc357bbb (präventive Selbstverteidigung) und
        77fedd51 (Selbstmord auf Kredit) tragen die These, dass der fehlende Off-Ramp
        aus dem Ausgangspunkt folgt und Israel sich selbst schadet.
      text: Der fehlende Ausstieg ist kein Taktikproblem, sondern Folge eines Ausgangspunkts,
        der die andere Seite nicht als Gesprächspartner vorsieht; wer präventiv töten
        will und Gespräche ausschließt, wird zum Dauertöter und stellt Israel außerhalb
        von Zivilisation und Völkerrecht.
      paragraphs: 114-124,161-163
      candidates:
        - 48fd076d-9a6f-529a-be8d-23d1385b7032
        - cc357bbb-e2d3-5148-8a0d-9d92e7d0884d
        - 77fedd51-5120-521f-8df7-1d43a0c2e231
      sprecher: []
      strittig: false
    - id: K7
      rationale: d7c7d06f (Partnerschaft statt Marionette) und 97494202 (Prahlerei als
        Haftungstitel) begründen die Zurechnung des Krieges an die USA.
      text: "Das Verhältnis ist eine echte Partnerschaft, keine israelische Fernsteuerung:
        Amerikanisches Hegemonialstreben und israelische Regionaldominanz decken sich,
        und Trumps Beteuerung, Netanjahu tue, was er sage, macht jede israelische
        Fortsetzung zu einer amerikanischen."
      paragraphs: 104-105,207-210
      candidates:
        - d7c7d06f-2728-5b88-a10f-5563ee00a9bd
        - 97494202-0a39-509a-acb4-e68cca68be0f
      sprecher: []
      strittig: false
    - id: K8
      rationale: beb101f8, 3d6bc3c2 und 9e2b700a tragen die Gefahrendiagnose; 85de3f1b und
        3e49cc1c liefern die Erklärung (Fehlkalkulation) und den Maßstab (Deliberation).
      text: "Die eigentliche Gefahr ist nicht ein Plan, sondern die Abwesenheit von Verfahren:
        Wo in der Kubakrise ExComm, Geheimdienstbewertungen und Kongresskonsultation
        standen, gibt es heute nur entzündete Zündschnüre, Sekundenentscheidungen und
        ein Parlament, das seine Kriegserklärungskompetenz nach Artikel I verweigert —
        Katastrophen entstehen so durch Fehlkalkulation, nicht durch Prophezeiung,
        weshalb nicht Ideologie, sondern das Vorhandensein von Deliberation den Maßstab
        bildet."
      paragraphs: 253-291
      candidates:
        - beb101f8-f491-5563-bcad-41462a35d3a4
        - 3d6bc3c2-be8d-593e-ae52-188d6ba16470
        - 9e2b700a-8be1-57ac-a3cf-97f1520640fa
        - 85de3f1b-d314-5ac5-9e14-355abbad290d
        - 3e49cc1c-76d4-5e82-a1db-584537859b88
      sprecher: []
      strittig: false
  faden:
    - von: K1
      nach: K2
      uebergang: Wenn der Krieg erfunden ist, dann ist die Blockade der Meerenge nicht sein
        Anlass, sondern seine Folge — und sie setzt die Uhr in Gang.
    - von: K2
      nach: K3
      uebergang: Doch die Krise ist kein Betriebsunfall der Gegenwart; sie wiederholt eine
        Praxis, die seit 1953 eingeübt wird.
    - von: K3
      nach: K4
      uebergang: "Diese Praxis hat einen Namen und einen Plan: Clean Break, angewandt auf den
        siebten Krieg der Serie."
    - von: K4
      nach: K5
      uebergang: Was als Nichtverbreitung verkauft wird, ist Regimewechsel — das beweist das
        JCPOA, das genau diese Lösung schon lieferte.
    - von: K5
      nach: K6
      uebergang: Weil das Ziel nicht Abrüstung, sondern Dominanz ist, fehlt der Ausstieg — und
        zwar nicht aus Taktik, sondern aus einem Ausgangspunkt ohne Anerkennung.
    - von: K6
      nach: K7
      uebergang: Verantwortlich ist dafür nicht eine Marionette, sondern eine Partnerschaft,
        in der sich Hegemonie und Regionaldominanz decken.
    - von: K7
      nach: K8
      uebergang: Was diese Partnerschaft gefährlich macht, ist nicht ihr Plan, sondern das
        Fehlen jedes Verfahrens, das sie bremsen könnte.
  unzugeordnet:
    - id: 3d767b1f-b290-53c5-b030-589cc4a03399
      grund: Empire-Logik der Bestrafung als Signal ist eine Teilbeobachtung, die keine der
        acht Kernaussagen eigenständig trägt; in K3 nur als Randnotiz enthalten.
    - id: 5201feb8-92e4-532f-9cb5-319de9d7bafc
      grund: Öl als Beute/Enthauptungsgeschäft ist eine dritte Motivschicht, die in der
        Motivtrennung von K5 nicht aufgeht und keine eigene Kernaussage rechtfertigt.
    - id: a9232bd0-912d-5a4c-a043-83899b1f8d4d
      grund: Mechanismus des Sich-Hineinredens in die eigene Rhetorik; illustrativ, aber ohne
        zweiten Kandidaten und ohne eigene Behauptung im Argumentationsgang.
    - id: 9f1240bb-66c5-5b61-aa9e-8bd59aefcc26
      grund: Prognose des abrupten Umschwungs durch Wirtschaftskrise ist Zeitdiagnose ohne
        Anschluss an eine der tragenden Aussagen.
    - id: e53712a7-4055-597a-a6d8-9fcd65d03321
      grund: Ethische Bilanz des Bauens gegen Niederreißen; Bewertungsfigur, die keine der
        Kernaussagen stützt.
    - id: 8ef8f94b-aa69-538d-94bd-7b48b06de6d3
      grund: Formel 'grausam, illegal, wahnhaft' ist eine Wertungsvokabel ohne eigene
        Behauptung im Argumentationsgang.
    - id: b6d7c4d0-70ca-5f95-9ab4-9123b72f309d
      grund: Sandsturm-Bild zur Künstlichkeit politischer Grenzen; anschauliche Metapher ohne
        tragende These.
    - id: bef365c1-0e2e-5c99-a12e-d18c25b70231
      grund: Unterscheidung säkularer und messianischer Varianten ist Binnendifferenzierung
        der israelischen Rechten, die keine Kernaussage trägt.
    - id: cb8c679c-711f-5ce8-a843-5cdec3677141
      grund: Konvertiten-Fußnote zur Herkunftsfrage; historische Randbemerkung ohne Anschluss
        an die Argumentationslinie.
    - id: feb01ba9-e3f6-5063-805d-edb837bd3327
      grund: Säkularer Ursprung des Zionismus und späte Theologisierung;
        religionsgeschichtlicher Exkurs ohne eigene Kernaussage.
    - id: 07424e28-6565-53f5-8617-60e2ade61c2f
      grund: Wandel von 'facts on the ground' zur Erlösung; Detail zur Siedlungsgeschichte,
        das keine der acht Aussagen stützt.
    - id: 5faf2028-2fcc-5dc3-ae81-00365c5ef37b
      grund: Christlicher Zionismus als Endzeitprojekt; eigenständiger Exkurs ohne zweiten
