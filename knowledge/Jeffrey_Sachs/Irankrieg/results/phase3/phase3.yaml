    - id: d49a3e3a-bff9-5ced-be95-ce91577c86ec
      grund: Biographische Autoritätsbegründung (Ölschock-Modellierung); Stützung der Person,
        nicht einer Aussage.
    - id: a0f20e8e-1374-5bd9-846b-e773be31416b
      grund: Definition der Stagflation; Begriffserläuterung, die in der Kaskadenaussage K2
