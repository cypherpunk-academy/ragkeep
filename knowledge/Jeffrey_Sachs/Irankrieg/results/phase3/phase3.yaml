    - id: bdf187fe-9cf4-56be-a8d2-49d67ea8f520
      grund: Bibelhermeneutischer Einwand zu den ausgelassenen Evangelien; theologische
        Nebenbemerkung.
    - id: 0028f980-b1a7-5acc-b787-8a737c89d042
      grund: 230 Jahre ohne Angriff ist eine empirische Entkräftung der Bedrohungserzählung,
        die im aufgebauten Argumentationsgang keine eigene Station hat.
    - id: 2bf008ed-5e6e-53bb-885e-bd7464867aff
      grund: Milizen als Symptom der Palästinafrage; Ursache-Wirkungs-Umkehrung, die keine der
        Kernaussagen trägt.
    - id: 74897846-66f2-52e2-8526-e9226ba5a9ec
      grund: IAEA-Asymmetrie als akzeptierte Konstellation; Detail zur Nichtverbreitung, das
        in K5 nicht aufgeht.
    - id: 22db36e5-246a-5d12-b65d-4bfae48f6949
      grund: Verschobene Frage nach Selbstkontrolle Trumps; pointierte Antwort ohne Anschluss
        an eine tragende Aussage.
    - id: 0e26f209-f9da-5ea4-a502-9d670e817a0a
      grund: Haushaltsgegenüberstellung Kanonen/Zähne; illustratives Beispiel ohne eigene
