    occurrences: []
  - id: 093d99de-ab0e-5073-a649-fdaf8e147295
    title: Der ersetzte Feind
    core: "Die Syrien-Bilanz ist die schärfste Ironie: Ein säkularer Staat, der
      Minderheiten schützte, wird zerstört, um durch einen Jihadisten ersetzt zu
      werden — also durch genau den Gegner, den man zu bekämpfen behauptete. Und
      die Zerstörung erfasst Kulturerbe, das Jahrtausende überdauerte, in
      Stunden."
    type: umkehrung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
