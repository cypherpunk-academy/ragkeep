  - id: e53712a7-4055-597a-a6d8-9fcd65d03321
    title: Bauen gegen Niederreißen
    core: "Sachs korrigiert das Bild vom 'iranischen Sieg' durch die Bilanz der
      Zerstörung: 160 getötete Schulmädchen, Tausende Tote, jahrelanger
      Wiederaufbau. Der entscheidende Satz ist biographisch — als
      Entwicklungsökonom, dessen Lebenswerk das Bauen ist, verurteilt er das
      Niederreißen. Das ist keine militärische, sondern eine ethische
      Kategorie."
    type: ausdruck
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
