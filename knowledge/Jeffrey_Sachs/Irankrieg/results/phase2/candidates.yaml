    interwoven_with: []
    occurrences: []
  - id: 0028f980-b1a7-5acc-b787-8a737c89d042
    title: 230 Jahre ohne Angriff
    core: "Gegen die Bedrohungserzählung setzt Sachs eine schlichte empirische
      Prüfung: Iran hat seit den 1790er Jahren kein Land angegriffen. Die Frage
      'Was macht Israel dann?' beruht auf einer Prämisse, die die Fakten nicht
      stützen — Iran will einen Platz in der Welt, nicht die Zerstörung
      Israels."
    type: umkehrung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
