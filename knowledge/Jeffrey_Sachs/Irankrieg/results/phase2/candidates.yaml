    title: Die versunkenen Kosten als politisches Gesetz
    core: "Sachs deutet die sunk-cost-Falle nicht als ökonomisches, sondern als
      politisch-psychologisches Gesetz: Wer etwas offensichtlich Dummes getan
      hat, muss es fortsetzen, um es nicht eingestehen zu müssen. Der Irankrieg
      wird damit nicht durch Strategie verlängert, sondern durch die Unfähigkeit
      zum Eingeständnis. Das erklärt, warum fehlende Erfolgsaussicht kein
      Abbruchkriterium ist."
