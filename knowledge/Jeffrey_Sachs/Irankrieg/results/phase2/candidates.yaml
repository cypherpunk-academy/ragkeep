  - id: 4f6da83f-cb88-55b2-9327-c7571df402f8
    title: Abschalten versus Zerstören
    core: "Der entscheidende Unterschied zu 1973/79: Damals wurde der Fluss
      gestoppt, jetzt würde die Infrastruktur zerstört. Ein Embargo ist
      reversibel, eine zerstörte Raffinerie nicht. Sachs verschiebt damit die
      Kategorie von 'Unterbrechung' zu 'Substanzverlust'."
    type: unterscheidung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
