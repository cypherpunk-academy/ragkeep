  - id: 7eff8908-dce7-5ae5-8133-53ebf44528f1
    title: Der künstliche Krieg
    core: "Sachs behauptet nicht, der Irankrieg sei falsch kalkuliert — er
      behauptet, er sei überhaupt nicht nötig gewesen. Die Krise ist nicht aus
      einem Konflikt geboren, sondern aus einer Entscheidung: 'completely
      artificial, completely arbitrary'. Damit verschiebt sich die Analyseebene:
      Die Frage ist nicht, wie man den Krieg gewinnt, sondern warum er überhaupt
      erfunden wurde."
    type: begriff
    source_id: professor-the-iran-war-will-break-america
    segment_id: professor-the-iran-war-will-break-america
    paragraphs: "4"
    evidence: '"we have enough problems in this world without making up new crises"'
