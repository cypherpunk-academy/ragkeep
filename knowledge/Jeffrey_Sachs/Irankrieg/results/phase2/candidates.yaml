    interwoven_with: []
    occurrences: []
  - id: cb8c679c-711f-5ce8-a843-5cdec3677141
    title: Die Konvertiten-Fußnote
    core: "Die Herkunftsfrage wird zur Ironie: Wenn viele Palästinenser Nachfahren
      konvertierter Juden sind, dann ist der Anspruch 'God gave us that land'
      biologisch wie historisch unterlaufen. Ben-Gurion habe das in den
      30er/40er Jahren selbst so gesehen — was die Frage aufwirft, wie die
      Vertreibung mit diesem Wissen zu rechtfertigen war."
