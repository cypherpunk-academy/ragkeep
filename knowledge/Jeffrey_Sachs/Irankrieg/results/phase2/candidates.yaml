  - id: 77fedd51-5120-521f-8df7-1d43a0c2e231
    title: Selbstmord auf Kredit
    core: "Sachs' Vorwurf an Israel ist nicht primär moralisch an den Opfern,
      sondern existenziell am Täter: Israel begehe Selbstmord, weil es sich
      außerhalb der Zivilisation, des Völkerrechts und der Weltöffentlichkeit
      stellt und dabei auf eine unbedingte US-Garantie baut, die nicht halten
      wird."
    type: umkehrung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
