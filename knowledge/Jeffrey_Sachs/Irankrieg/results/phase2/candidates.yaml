    occurrences: []
  - id: cc357bbb-e2d3-5148-8a0d-9d92e7d0884d
    title: Präventive Selbstverteidigung als Dauerzustand
    core: "Sachs leitet aus der präventiven Selbstverteidigung eine Logik ab: Wer
      glaubt, vorbeugend töten zu müssen, und Gespräche ausschließt, wird zum
      'non-stop killer'. Der Sparta-Vergleich zeigt die Konsequenz — ein Staat,
      der die Fähigkeit zur Diplomatie verloren hat und nur noch Diplomaten
      besitzt."
    type: verbindung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    paragraphs: 114-118
    evidence: '"If you live like that, you end up as a killer non-stop."'
