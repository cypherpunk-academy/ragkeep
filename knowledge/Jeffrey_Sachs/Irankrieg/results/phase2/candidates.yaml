    paragraphs: 212,214-215
    evidence: "\"We can't afford the wars and those things like child care,
      Medicare, and Medicaid\""
    interwoven_with: []
    occurrences: []
  - id: d49a3e3a-bff9-5ced-be95-ce91577c86ec
    title: Der Modellbauer der Ölschocks
    core: "Sachs' Autorität in der kommenden Frage ist biographisch fundiert: Seine
      Dissertation und sein Buch von 1982 modellierten genau die Ölschocks von
      1973 und 1979. Die Prognose ist damit keine Meinung, sondern die
      Wiederholung eines bereits durchgerechneten historischen Musters."
