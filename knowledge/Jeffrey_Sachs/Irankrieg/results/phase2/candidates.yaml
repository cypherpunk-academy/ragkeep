  - id: beb101f8-f491-5563-bcad-41462a35d3a4
    title: Zündschnüre statt Strategie
    core: "Die Eskalation wird nicht durch Absicht, sondern durch Geschwindigkeit
      gefährlich: Eine chinesische Flotte fährt in den Golf, Entscheidungen
      fallen in Sekunden, Systeme wie Maven könnten 'shoot' sagen. Sachs' Bild
      ist das der Zündschnüre — nicht ein Plan, sondern viele entzündete Fäden
      ohne Kontrollinstanz."
    type: begriff
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
