  - id: f6b3a96d-57f9-5135-aeaf-3d0117dbff4a
    title: Normalisierung als eigentliche Verletzung
    core: 'Sachs nennt eine Kontinuität über fünf Administrationen (Bush jr., Obama,
      Trump I, Biden, Trump II). Das ist keine Parteikritik, sondern eine
      Strukturdiagnose: außergerichtliche Tötung ist kein Ausrutscher, sondern
      Bestandteil des Handwerks („statecraft"). Die Pointe liegt im Wort
      „normalized" — die Normverletzung wird durch Wiederholung zur Norm.'
    type: verbindung
    source_id: prof-did-netanyahu-plot-a-tehran-coup
    segment_id: prof-did-netanyahu-plot-a-tehran-coup
    paragraphs: 28-30
