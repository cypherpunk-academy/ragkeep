  - id: 9f1240bb-66c5-5b61-aa9e-8bd59aefcc26
    title: Der abrupte Umschwung
    core: "Sachs erwartet keinen langsamen Stimmungswandel, sondern einen abrupten
      Bruch — beschleunigt durch die Wirtschaftskrise. Die politische Ökonomie
      wird zum Zeitmesser: Wenn in vier Wochen halb Golf zerstört ist,
      entscheidet nicht mehr Moral, sondern Einkommen."
    type: verbindung
