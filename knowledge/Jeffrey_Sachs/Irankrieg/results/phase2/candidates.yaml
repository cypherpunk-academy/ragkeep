    occurrences: []
  - id: d7116938-c830-5ec5-829b-71b90d5b572d
    title: "Die Kaskade: Zerstörung, Realwirtschaft, Finanzmärkte"
    core: "Sachs beschreibt eine Kaskade in drei Stufen: physische Zerstörung, dann
      Realwirtschaft, dann Finanzmärkte — bis hin zum Bank Run auf ein Land, das
      als sicherer Hafen der Region gilt. Die Emirate fragen bereits nach
      Swap-Linien; das ist der Frühindikator."
    type: verbindung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    paragraphs: 242-246
    evidence: '"first you get the physical destruction then you get the real economy
      ... But then you get the financial effects"'
    interwoven_with: []
    occurrences: []
  - id: 5f333468-bf90-56b1-a12c-d3b5c1f2bb18
    title: Koinzidenz statt Addition
    core: "Die eigentliche Gefahr liegt in der Koinzidenz: Ein Super-El-Niño trifft
      auf eine bereits fragile Welt und auf die Zerstörung im Golf. Sachs
      erinnert daran, dass 1973/74 ebenfalls ein El-Niño-Jahr war — die
      Kombination aus Energieschock und Ernteausfall trieb die
      Nahrungsmittelpreise. Zwei Schocks, die sich multiplizieren statt
      addieren."
    type: verbindung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    paragraphs: 247,250-252
    evidence: "\"if you combine a mass destruction in West Asia, the Gulf, the
      Eastern Mediterranean, with a super El Nino, I don't even know\""
    interwoven_with: []
    occurrences: []
  - id: 85de3f1b-d314-5ac5-9e14-355abbad290d
    title: Katastrophe als Fehlkalkulation
    core: "Sachs' Antwort auf die Endzeitfrage ist eine Geschichtstheorie:
      Katastrophen geschehen nicht durch Prophezeiung, sondern durch
      Fehlkalkulation, fehlende Kommunikation und den Zusammenbruch
      systematischer Verfahren. Das ist die säkulare Alternative zur Providenz —
      und zugleich die tröstlichere, weil sie Handlungsspielraum lässt."
    type: umkehrung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    paragraphs: 260,262-264
    evidence: "\"Terrible things happen because individual leaders and governments
      make miscalculations. They don't talk to each other.\""
    interwoven_with: []
    occurrences: []
  - id: 3e49cc1c-76d4-5e82-a1db-584537859b88
    title: Deliberation als Maßstab, nicht Ideologie
    core: "Die überraschende Umkehrung: China habe die deliberativsten Verfahren,
      die Sachs kennt — zwei Jahre Detailberatung über Zukunftsbranchen. Das
      Bild vom allentscheidenden Xi hält er für westliche Projektion. Die
      Gegenüberstellung ist nicht ideologisch, sondern prozedural: Wo wird
      beraten, wo nicht?"
    type: umkehrung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    paragraphs: 284-287
    evidence: '"China has among the most deliberative processes that I see in any
      government in the world"'
    interwoven_with: []
    occurrences: []
  - id: ad92d3ee-756d-5fe6-ab9f-8cf31468c08a
    title: Der Größenwahn als Gewohnheit
    core: "Der 'America reigns supreme'-Glaube wird als das eigentliche Delirium
      benannt: eine imperiale Gewohnheit aus der Nachkriegszeit, die in einer
      Welt vieler Atommächte nicht mehr trägt. Die Alternative ist nicht
      Schwäche, sondern Kooperation — 'get along, understand each other,
      cooperate'."
    type: umkehrung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    paragraphs: 289-291
    evidence: '"We have one overwhelming delusion ... that America reigns supreme in
      the world."'
    interwoven_with: []
    occurrences: []
  - id: abcddddb-2f3d-5fbb-b8bc-93d7fa09bd87
    title: Rechtsrhetorik als Waffe der Täter
    core: 'Sachs dreht die moralische Grammatik um: Die USA sprechen die Sprache des
      Rechts, während sie Handlungen begehen, die sie anderen als Verbrechen
      vorwerfen. Der Begriff „Mord" wird nicht moralisch, sondern
      juristisch-distributiv verwendet — er markiert, wer definitionsmächtig
      ist. Die Pointe: Nicht die Tat unterscheidet Freund und Feind, sondern die
      Zuschreibung.'
    type: umkehrung
    source_id: prof-did-netanyahu-plot-a-tehran-coup
    segment_id: prof-did-netanyahu-plot-a-tehran-coup
    paragraphs: 19-23
    evidence: "\"We are using words of law by gangsters on our side who commit far
      worse abuses than anything we're claiming of other countries.\""
    interwoven_with: []
    occurrences: []
  - id: b00b2dac-91b5-5478-acdf-8cbd524c2a76
    title: Der Putsch ist erst verstanden, wenn man das Personal kennt
    core: "Sachs' Erkenntnisinteresse ist methodisch: Er glaubte nicht an die
      öffentlich erzählte Variante (Tötung der Führung → Volksaufstand), sondern
      wartete auf das „inside job\" — die Frage, wer eingesetzt werden sollte.
      Der Putsch ist erst verstanden, wenn man das Personal kennt, nicht nur die
      Gewalt. Das ist eine Verschiebung von der Ereignis- zur
      Personalgeschichte."
    type: unterscheidung
    source_id: prof-did-netanyahu-plot-a-tehran-coup
    segment_id: prof-did-netanyahu-plot-a-tehran-coup
    paragraphs: 69-72
    evidence: '"I was waiting for the inside job. Who they were going to put in
      place. How this coup was actually going to work."'
    interwoven_with: []
    occurrences: []
  - id: 97494202-0a39-509a-acb4-e68cca68be0f
    title: Die Prahlerei als Haftungstitel
    core: "Sachs nimmt Trump beim Wort, um ihn zu binden: Wenn Trump behauptet,
      Netanyahu tue, was er sage, dann ist jede israelische Fortsetzung Trump
      zuzurechnen. Die Beteuerung der Kontrolle wird zum Haftungstitel —
      dieselbe Aussage, die vorher als Prahlerei entlarvt wurde, wird nun als
      Eingeständnis verwendet."
    type: verbindung
    source_id: prof-did-netanyahu-plot-a-tehran-coup
    segment_id: prof-did-netanyahu-plot-a-tehran-coup
    paragraphs: 104-105
    evidence: "\"Let's take him at his word. He can tell Netanyahu what to do. So,
      if Israel continues in this way, that's at Trump's bidding.\""
    interwoven_with: []
    occurrences: []
  - id: 4a88818e-7c34-5a09-bcda-18cf09b6f407
    title: "Der Bogen: Freiheitsrhetorik gegen den eigenen Staat"
    core: 'Der Rahmen der Sendung — die Eingangssequenz über Angriffskriege,
      Jefferson, „government that governs least" — wird durch das Gespräch nicht
      eingelöst, sondern bestätigt: Die Sorge um illegitime Gewalt ist kein
      abstraktes Freiheitsthema, sondern der konkrete Fall Iran/Cuba/Venezuela.
      Der Bogen schließt sich, indem die Gründungsrhetorik gegen die
      gegenwärtige Regierung gewendet wird.'
