  - id: 8ef8f94b-aa69-538d-94bd-7b48b06de6d3
    title: Grausam, illegal, wahnhaft
    core: "Sachs' Formel 'grausam, illegal, wahnhaft' trennt die Bewertung von der
      Existenz der Motive: Es gab Gründe für diesen Krieg, nur keine gültigen.
      Das erklärt, warum der Off-Ramp so schwer ist — er würde alle diese Gründe
      unerfüllt lassen, und genau das macht ihn richtig."
    type: ausdruck
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    paragraphs: 88-89
    evidence: '"Cruel, illegal, delusional. ... there were reasons for this war. And
      taking the off-ramp means that none of those would be fulfilled."'
    interwoven_with: []
    occurrences: []
  - id: b6d7c4d0-70ca-5f95-9ab4-9123b72f309d
    title: Derselbe Sandsturm auf beiden Seiten
    core: "Der Sandsturm auf beiden Seiten der Grenze wird zum Bild für die
      Künstlichkeit politischer Linien: Geteiltes ökologisches Schicksal,
      getrennte Zuständigkeit. Sachs leitet daraus keine Verschwörung ab,
      sondern eine Banalität — man braucht kein Geoengineering, wo gemeinsame
      Probleme gemeinsame Lösungen verlangen."
    type: ausdruck
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    paragraphs: 95-97
    evidence: "\"there's the sandstorm on one side, the same sandstorm on the other
      side, and they should be working together\""
