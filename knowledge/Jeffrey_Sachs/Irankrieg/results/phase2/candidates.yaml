        paragraphs: 293-297
  - id: 9e2b700a-8be1-57ac-a3cf-97f1520640fa
    title: Artikel I und die verweigerte Aufsicht
    core: "Sachs' Verfassungsargument ist präzise: Kriegserklärung liegt nach
      Artikel I allein beim Kongress, nicht geteilt mit dem Präsidenten. Dass
      fast alle Republikaner und fast alle Demokraten die Aufsicht verweigern,
      ist für ihn kein politisches, sondern ein Verfallszeichen — 'late stage
      republics'."
    type: begriff
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
