    occurrences: []
  - id: a0f20e8e-1374-5bd9-846b-e773be31416b
    title: Stagflation als Paradox
    core: "Stagflation wird als Paradox definiert: Rückgang und Inflation zugleich —
      weniger Einkommen, höhere Preise. Genau das ist der erwartete Zustand nach
      einem Angriff auf die Golfinfrastruktur, und es ist die ökonomische Form
      dessen, was politisch als 'Krise' bezeichnet wird."
