    occurrences: []
  - id: ff0ce251-915c-5331-8adb-498063b57fa1
    title: Von Gas zu Brot
    core: "Die Kette reicht vom Erdgas über Ammoniak zum Stickstoffdünger: Eine
      Unterbrechung der Golfproduktion ist eine Nahrungsmittelkrise, nicht nur
      eine Energiekrise. Und die Raffinerien sind Hochtechnologieanlagen, die
      für Frieden gebaut wurden — nicht für Krieg."
