  - id: a9232bd0-912d-5a4c-a043-83899b1f8d4d
    title: Sich in die eigene Rhetorik hineinreden
    core: "Carlson beschreibt einen Mechanismus, den Sachs bestätigt: Man redet sich
      in die eigene Rhetorik hinein. Der Atomvorwurf wird zunächst instrumentell
      erhoben, dann geglaubt — bis die Existenzangst real wird. Die Lüge wird
      wahr, weil der Lügner sie schließlich selbst fürchtet."
    type: begriff
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    paragraphs: 112-113
    evidence: '"if you say it enough, you start to believe that the main threat to
