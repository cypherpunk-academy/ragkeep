    occurrences: []
  - id: 5faf2028-2fcc-5dc3-ae81-00365c5ef37b
    title: Christlicher Zionismus als Endzeit-Projekt
    core: "Die überraschendste Verbindung: Der Zionismus ist nicht jüdisch
      entsprungen, sondern wurde von christlichen Zionisten mitgetragen — einer
      Endzeit-Theologie, die Juden im Heiligen Land braucht, damit die
      Wiederkunft stattfinden kann. Dass diese Leute oft Antisemiten waren, die
      Juden loswerden wollten, macht die Allianz zur strukturellen Ironie."
    type: verbindung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    paragraphs: 151-154
    evidence: '"these Christian Zionists were often rather confirmed anti-semites
      ... they wanted them conveniently anyway out of Britain and back in the
      Holy Land"'
    interwoven_with: []
    occurrences: []
  - id: bdf187fe-9cf4-56be-a8d2-49d67ea8f520
    title: Die ausgelassenen Evangelien
    core: "Sachs' bibelhermeneutischer Einwand: Der Christian Zionism liest nur
      Genesis 15/18, Josua und Offenbarung — und lässt die Evangelien aus. Die
      Bergpredigt mit ihrer radikalen Versöhnung und Gewaltlosigkeit steht in
      direktem Gegensatz zum Projekt. Die Auswahl der Textstellen ist selbst die
      Ideologie."
    type: unterscheidung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
