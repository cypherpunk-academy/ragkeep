  - id: 2bf008ed-5e6e-53bb-885e-bd7464867aff
    title: Milizen als Symptom, nicht Ursache
    core: "Sachs argumentiert, dass die Hamas-/Hisbollah-Unterstützung eine Funktion
      der Palästinafrage ist: Entsteht ein palästinensischer Staat, endet die
      Unterstützung. Damit wird die Reihenfolge umgedreht — nicht die Milizen
      sind die Ursache, sondern die fehlenden politischen Rechte sind es."
    type: verbindung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
