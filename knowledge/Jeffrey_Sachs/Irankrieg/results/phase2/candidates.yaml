        segment_id: professor-the-iran-war-will-break-america
        paragraphs: 37-38
  - id: 8e0053a4-3684-5be3-ae6e-9b92686fe4a4
    title: Die Weggabelung als Zeitproblem
    core: "Sachs beschreibt die Lage nicht als Wahl zwischen zwei Optionen, sondern
      als instabile Situation, in der die Zeit selbst zum Akteur wird: Weil die
      Straße von Hormus geschlossen ist, baut sich die Wirtschaftskrise
      kontinuierlich auf, und damit verfällt die Option 'später entscheiden'.
      Die Gabelung ist keine ruhige Abzweigung, sondern ein Fenster, das sich
      schließt."
    type: unterscheidung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    paragraphs: 1-2,4
    evidence: "\"we're not in a stable situation where we can choose one or the
      other. We're in an unstable situation as we speak.\""
    interwoven_with: []
    occurrences: []
  - id: dfba950c-68ee-5c46-92bd-b5094e673954
    title: Die Meerenge als Nadelöhr der Weltwirtschaft
    core: Die Blockade wirkt nicht primär über Öl, sondern über die gesamte Palette
      strategischer Güter — Düngemittel, Petrochemikalien, Aluminium. Ein
      schmaler Wasserstreifen wird so zum Hebel, mit dem ein regionaler Konflikt
      die Weltwirtschaft insgesamt in Geiselhaft nimmt.
    type: begriff
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
