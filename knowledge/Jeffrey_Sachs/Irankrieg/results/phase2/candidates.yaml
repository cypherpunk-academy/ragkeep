    occurrences: []
  - id: bef365c1-0e2e-5c99-a12e-d18c25b70231
    title: Zwei Varianten, eine Koalition
    core: "Sachs unterscheidet zwei Varianten israelischer Radikalität, die heute
      eine Koalition bilden: eine säkulare Sicherheitsvariante (Netanjahu,
      'töten bevor sie töten') und eine theologisch-messianische (Ben-Gvir,
      Smotrich). Beide treffen sich im Ergebnis, obwohl ihre Begründungen
      verschieden sind."
    type: unterscheidung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
