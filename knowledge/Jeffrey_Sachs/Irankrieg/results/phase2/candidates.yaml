    interwoven_with: []
    occurrences: []
  - id: feb01ba9-e3f6-5063-805d-edb837bd3327
    title: Der säkulare Ursprung, die späte Theologie
    core: "Sachs' historische Pointe: Der ursprüngliche Zionismus war säkular, ja
      anti-rabbinisch — Herzl dachte an Uganda, nicht ans Heilige Land. Die
      rabbinische Tradition hatte sogar geboten, nicht zurückzukehren. Der
      heutige religiöse Anspruch ist also keine alte Tradition, sondern eine
      Erfindung des 20. Jahrhunderts, verstärkt nach 1967."
    type: umkehrung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    paragraphs: 140-143
    evidence: "\"The rabbis had said 1500 years earlier, don't go back to the Holy
      Land.\""
    interwoven_with: []
    occurrences: []
  - id: 07424e28-6565-53f5-8617-60e2ade61c2f
    title: Von 'facts on the ground' zur Erlösung
    core: "Sachs datiert den Umschlag präzise: In den 70ern waren Siedlungen 'facts
      on the ground' — säkulare Sicherheitspolitik. Wenig später tanzen junge
      Zeloten in Jerusalem und erklären dieselben Orte zur göttlichen
      Verheißung. Aus Verwaltung wird Erlösung; die Begründung wechselt, das
      Projekt bleibt."
    type: unterscheidung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
