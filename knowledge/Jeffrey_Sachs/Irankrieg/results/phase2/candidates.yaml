  - id: b5767135-aa92-5fda-a00c-97317da2ece9
    title: Der unerhörte Satz von 1953
    core: "Der Ursprung des Konflikts liegt für Sachs 1953: Mossadeghs Satz, das Öl
      unter dem eigenen Boden sei iranisch, wird zum unerhörten Satz der Region.
      Die Antwort ist ein Putschereignis, das er mit heutiger Sprache
      'Farbenrevolution' nennt — Empire-Logik, die Souveränität als
      Reputationsfrage behandelt."
    type: begriff
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
