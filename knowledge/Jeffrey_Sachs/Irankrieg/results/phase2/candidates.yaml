        paragraphs: 265-266
  - id: 3d6bc3c2-be8d-593e-ae52-188d6ba16470
    title: ExComm und das Fehlen eines Verfahrens
    core: "Die Kubakrise dient als Kontrastfolie: ExComm, Protokolle, Hinterkanäle,
      U Thant als Vermittler, Kongresskonsultation — und am Ende rettete
      Kennedys Kühle die Welt gegen die Heißsporne im Militär. Heute fehlt jede
      dieser Instanzen: kein interagency review, keine Geheimdienstbewertung,
      keine Joint Chiefs. Die Abwesenheit von Verfahren ist die eigentliche
      Gefahr."
    type: unterscheidung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    paragraphs: 267,270-271,274-276
    evidence: "\"it was President Kennedy's cool and rationality and decency that
      saved the world\""
