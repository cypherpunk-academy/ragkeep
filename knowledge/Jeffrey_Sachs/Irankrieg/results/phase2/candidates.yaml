candidates:
  - id: 20efaa84-3b03-55e6-9c22-05891efd8277
    title: Der Off-Ramp als eingestandenes Scheitern
    core: "Der Ausstieg ist kein Sieg, sondern eine Niederlage, die als solche
      eingestanden werden müsste: Iran kontrolliert nach dem Krieg faktisch die
      Meerenge und damit 20% der Weltenergie und 30% des Düngemittels. Wer den
      Off-Ramp nimmt, muss zugeben, dass der Krieg die Position des Gegners
      gestärkt hat."
    type: umkehrung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    paragraphs: "16"
    evidence: '"they would have to swallow a lot to walk this back because it would
      mean that Iran is more powerful now in effect than it was before the war
      started"'
    interwoven_with: []
    occurrences:
      - source_id: prof-did-netanyahu-plot-a-tehran-coup
        segment_id: prof-did-netanyahu-plot-a-tehran-coup
        paragraphs: 91-95
  - id: 205c2823-8e85-5811-a484-8d9f3a9615a2
    title: Die Böse-Achse als Produkt der Erzählung
    core: "Sachs kehrt die übliche Begründung um: Nicht Irans Kontrolle der Meerenge
      ist das Problem, sondern die Erzählung, die sie bedrohlich erscheinen
      lässt. Die 'Achse des Bösen' ist für ihn kein Befund über Iran, sondern
      ein Produkt jahrzehntelanger offizieller Propaganda — und damit eine
      Kategorie, die die Wahrnehmung der Fakten vorstrukturiert."
    type: umkehrung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    paragraphs: 27-29
    evidence: '"It is our non-stop official propaganda narrative."'
    interwoven_with: []
    occurrences:
      - source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
        segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
        paragraphs: 42-46
      - source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
