  - id: 48fd076d-9a6f-529a-be8d-23d1385b7032
    title: Kein Ausweg ohne Anerkennung
    core: "Der entscheidende Punkt ist die Verweigerung der Anerkennung: Wer die
      Menschen, die er expropriiert hat, nicht als Gesprächspartner denkt, kann
      keinen Ausweg formulieren. Netanjahus fehlender Off-Ramp ist deshalb kein
      Taktikproblem, sondern Folge eines Ausgangspunkts, der die andere Seite
      als Mensch nicht vorsieht."
    type: umkehrung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    paragraphs: 121,123-124
    evidence: "\"his starting point is something obnoxious which is we don't
      recognize the people that live among us\""
