  - id: 22db36e5-246a-5d12-b65d-4bfae48f6949
    title: Die verschobene Frage
    core: "Auf die Frage, ob Trump Netanjahu bändigen könne, antwortet Sachs mit
      einer Verschiebung: Die Frage ist nicht, ob Trump einen anderen
      kontrolliert, sondern ob er sich selbst kontrolliert. Die eigentliche
      Souveränität, um die es geht, ist die über die eigenen Impulse."
    type: umkehrung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
