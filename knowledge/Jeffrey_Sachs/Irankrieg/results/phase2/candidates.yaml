        paragraphs: 77-79
  - id: 5201feb8-92e4-532f-9cb5-319de9d7bafc
    title: Enthauptung als Ölgeschäft
    core: "Sachs fügt eine dritte Motivschicht hinzu: das Öl als Beute. Trump habe
      aus Venezuela gelernt, dass Enthauptung plus Regimewechsel den Zugriff auf
      Rohstoffe bedeutet — und auf Iran übertragen. Der Krieg erscheint damit
      nicht als Sicherheitspolitik, sondern als Aneignungsgeschäft."
    type: verbindung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
