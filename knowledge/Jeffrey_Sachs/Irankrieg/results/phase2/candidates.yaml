        paragraphs: 185-187
  - id: 3d767b1f-b290-53c5-b030-589cc4a03399
    title: Bestrafung als Signal an das Empire
    core: "Sachs formuliert eine Empire-Logik: Ein Empire kann Gesichtsverlust nicht
      tolerieren, weil die Bestrafung nicht nur den Abtrünnigen, sondern alle
      anderen Provinzen adressiert. Der Angriff auf Iran ist damit primär eine
      Botschaft an das eigene Gefüge — 'don't you dare try this'."
    type: begriff
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    paragraphs: 35,38
    evidence: "\"An empire needs to repay any kind of loss of face with some kind of
      extreme punishment not only to get that particular recalcitrant place
      under control but to signal to all the rest of the empire don't you dare
      try this.\""
    interwoven_with: []
    occurrences:
      - source_id: prof-did-netanyahu-plot-a-tehran-coup
        segment_id: prof-did-netanyahu-plot-a-tehran-coup
        paragraphs: 61-62
  - id: efc91cad-4622-5d72-9a48-373d3cad0ea8
    title: "Clean Break: Gegner eine Ebene höher"
    core: "Die 'Clean Break'-Strategie ist der Schlüssel zur Logik: Statt militante
      Gruppen direkt zu bekämpfen, werden die Staaten angegriffen, die sie
      stützen. Der Krieg gegen Iran ist damit kein Sonderfall, sondern die
      konsequente Anwendung eines 30 Jahre alten Plans — die Gegner werden eine
      Ebene höher gesucht."
    type: begriff
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    paragraphs: 66,68
    evidence: '"rather than fighting those militant groups directly, we need to
      bring down the governments in the Middle East and West Asia that support
      those groups."'
    interwoven_with: []
    occurrences:
      - source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
        segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
        paragraphs: 69-71
  - id: ac9f27e0-9dc5-5318-9be2-c78ac0bbbdbe
    title: Die sieben Kriege
    core: "Sachs zählt sieben Kriege auf — Libyen, Sudan, Somalia, Libanon, Syrien,
      Irak, Iran — und sechs davon sind bereits in Chaos versunken. Das ist die
      stärkste empirische Stütze seiner These: Die Bilanz ist keine Serie von
      Fehlschlägen, sondern ein Muster mit Erfolgsbilanz aus Sicht der
      Chaos-Profiteure."
    type: verbindung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    paragraphs: 74-77
    evidence: '"Six of those wars have led to bloodbaths and disasters"'
    interwoven_with: []
