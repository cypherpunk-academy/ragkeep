    occurrences: []
  - id: 74897846-66f2-52e2-8526-e9226ba5a9ec
    title: Asymmetrie, die Iran akzeptiert
    core: "Sachs' Pointe zur Asymmetrie: Israel unterwirft sich keiner
      IAEA-Kontrolle, Iran hat sie angeboten — asymmetrisch, aber akzeptiert.
      Der Off-Ramp ist also nicht nur sicherheitspolitisch unbedenklich, sondern
      die einzige Konstellation, in der Nichtverbreitung überhaupt real wäre."
    type: unterscheidung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
