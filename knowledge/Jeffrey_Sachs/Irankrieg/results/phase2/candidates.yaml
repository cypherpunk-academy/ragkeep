  - id: d7c7d06f-2728-5b88-a10f-5563ee00a9bd
    title: Partnerschaft statt Marionette
    core: "Sachs beschreibt das Verhältnis als echte Partnerschaft, nicht als
      israelische Fernsteuerung: Amerikanisches Hegemonialstreben und
      israelische Regionaldominanz decken sich, ebenso Rache und Ölzugriff.
      Israels Kriegsfähigkeit von Libyen bis Iran ist eine amerikanische
      Fähigkeit — und Amerika blutet daran aus."
    type: verbindung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
