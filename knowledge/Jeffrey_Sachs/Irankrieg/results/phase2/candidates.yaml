  - id: 16085173-4ab9-574a-8397-584ea30051a8
    title: Das zerstörte Beweisstück JCPOA
    core: "Das JCPOA wird zum Beweisstück: 2015 gab es genau die Lösung, die Trump
      heute zu erzwingen behauptet — multilateral, vom Sicherheitsrat einstimmig
      gebilligt. Dass sie zerstört wurde, zeigt, dass es nie um Nichtverbreitung
      ging, sondern um Regimewechsel. Der Vorwand ist durch die eigene
      Geschichte widerlegt."
    type: umkehrung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    paragraphs: 51-53
    evidence: "\"This is the approach that you don't want them to have a nuclear
      weapon when you had the control. No, this is the opposite.\""
    interwoven_with: []
    occurrences: []
  - id: 0afaa8ce-fba4-5062-b9be-4c8f0cd2c8ae
    title: "Zwei Motive: Reputation und Dominanz"
    core: "Sachs trennt zwei Motive, die oft verschmelzen: Die USA wollen einen
      Abtrünnigen zurückholen (Reputation), Israel will vollständige
      militärische Dominanz in Westasien — Iran ist 'der letzte große Preis'.
      Daraus folgt, warum Israel den Off-Ramp noch stärker ablehnt als die USA:
      Für Israel ist der Ausstieg kein Gesichtsverlust, sondern ein unerledigtes
      Projekt."
    type: unterscheidung
    source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    paragraphs: 55-58
    evidence: "\"That's Israel saying, 'We control almost all of the Middle East
      militarily, but Iran we don't yet control.' So that's the last big
      prize.\""
