  - id: 0e9109bd-c840-5d27-ba08-030e27c8bdc3
    title: Die Mondale-Lektion
    core: "Sachs datiert die Ursache der 40-Billionen-Schuld auf eine Wahl von 1984:
      Mondale sagte die Wahrheit über Steuererhöhungen und verlor 49 Staaten.
      Die Lehre war nicht ökonomisch, sondern rhetorisch — 'never say you're
      going to raise taxes'. Seither gibt es nur Steuersenkungen, weil Politik
      als PR und als Fundraising zugleich funktioniert. Die Schulden sind also
      das Produkt einer Lektion über Redeverbote."
