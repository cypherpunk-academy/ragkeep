    occurrences: []
  - id: 0e26f209-f9da-5ea4-a502-9d670e817a0a
    title: Kanonen statt Zähne
    core: "Der 'Washington gaffe' ist die Wahrheit: Kriege und Gesundheitsversorgung
      sind dieselbe Budgetfrage. Der Haushalt erhöht das Militär um eine halbe
      Billion und senkt die Leistungen — die Priorität ist damit offen
      dokumentiert. Sachs liest die Zahlen als moralische Aussage."
    type: ausdruck
