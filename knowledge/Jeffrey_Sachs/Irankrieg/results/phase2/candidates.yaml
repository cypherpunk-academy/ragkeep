        segment_id: professor-the-iran-war-will-break-america
        paragraphs: "19"
  - id: c9b840d8-3331-57f1-920a-80ba29c09350
    title: Venezuela als Modell — und seine Übertragungsgrenze
    core: "Trumps Irankrieg ist eine Kopie: Bestechung, Geheimabsprachen mit einem
      Vizepräsidenten, Umsturz, Öleinnahmen. Der Fehler liegt in der Analogie.
      Was in der eigenen Hemisphäre funktioniert, wo die USA als Gangster
      auftreten können, trifft auf ein Land mit fast 100 Millionen Menschen in
      großer Entfernung, das sich nicht diktieren lässt. Sachs' Pointe:
      Verbrechen plus Dummheit — die Übertragung eines lokalen Erfolgsrezepts
      auf einen Fall, in dem die Machtverhältnisse nicht stimmen."
    type: unterscheidung
    source_id: professor-the-iran-war-will-break-america
    segment_id: professor-the-iran-war-will-break-america
    paragraphs: 5-6
    evidence: "\"He could do it in his own neighborhood in Venezuela. Yes, the
      United States can be a gangster. [...] But in Iran, it doesn't work that
      way.\""
    interwoven_with: []
    occurrences:
