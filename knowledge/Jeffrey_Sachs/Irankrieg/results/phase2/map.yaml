      - round: 38
        tool: record_thought
        title: Der Modellbauer der Ölschocks
        core: "Sachs' Autorität in der kommenden Frage ist biographisch fundiert: Seine
          Dissertation und sein Buch von 1982 modellierten genau die Ölschocks von 1973
          und 1979. Die Prognose ist damit keine Meinung, sondern die Wiederholung eines
          bereits durchgerechneten historischen Musters."
        type: begriff
        paragraphs:
          - 225
          - 226
        evidence: '"I wrote the first model of what how they worked, why they had such negative
          effects after 73 after 73 and 79."'
