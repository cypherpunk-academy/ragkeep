          - 75
          - 76
          - 77
          - 80
          - 81
          - 82
        evidence: '"The last time that one looked at the horrors under the covers of the CIA was
          1975. It was called the Church Committee."'
        note: Abgelegt als Gedanke 6. Lies weiter oder rufe done auf.
      - round: 15
        tool: read
        from: 85
        count: 12
        note: Absätze 85–96 von 116.
      - round: 16
        tool: record_thought
        title: "Die Falle: Drohung ohne Handlungsoption"
        core: "Sachs beschreibt eine Falle, die aus dem Scheitern des Putsches entsteht: Weil
          der schnelle Regimewechsel misslang, hat Iran Abschreckungsfähigkeit
          zurückgewonnen. Die USA können militärisch handeln, aber jeder Schlag zerstört
          die Weltwirtschaft — die Drohung ist stark, die Handlung selbstmörderisch.
          Bluffen ist dann nicht Schwäche, sondern die einzige rationale Option."
        type: umkehrung
        paragraphs:
          - 91
          - 92
          - 93
          - 94
          - 95
        evidence: '"the United States could take military action against Iran, no doubt, but the
          result would be the destruction of the Middle East."'
        note: Abgelegt als Gedanke 7. Lies weiter oder rufe done auf.
      - round: 17
        tool: record_thought
        title: Schweigen als Mittäterschaft
        core: 'Sachs benennt die institutionelle Lücke präzise: Der Sprecher des
          Repräsentantenhauses und der Mehrheitsführer im Senat sind nicht neutral,
          sondern durch Schweigen „co-conspirators". Das ist eine Zuschreibung von
          Verantwortung durch Unterlassen — die Verfassung macht sie zu Mit-Hütern, ihr
          Nichtstun zu Mittäterschaft.'
        type: begriff
        paragraphs:
          - 85
          - 86
        evidence: '"our speaker of the house and our majority leader are co-conspirators because
          they are silent even though they are a co-equal branch of government"'
        note: Abgelegt als Gedanke 8. Lies weiter oder rufe done auf.
      - round: 18
        tool: read
        from: 97
        count: 12
        note: Absätze 97–108 von 116.
      - round: 19
        tool: record_thought
        title: Abzug statt Abkommen
        core: "Sachs' Lösung ist bewusst antiheroisch: kein Verhandlungserfolg, keine
          Gesichtswahrung nötig, nur Abzug — und Trump darf sich als Sieger inszenieren.
          Die Rhetorik des Triumphs wird als beliebig entlarvt („Who cares what he
          says\"). Der Ausweg verlangt nicht Wahrheit, sondern nur das Ende der
          Handlung."
        type: ausdruck
        paragraphs:
          - 98
          - 99
          - 100
          - 101
          - 106
          - 107
          - 108
        evidence: '"Trump can clear it declare it the greatest success in the history of the
          world. Who cares what he says. Go home. Stop this."'
        note: Abgelegt als Gedanke 9. Lies weiter oder rufe done auf.
      - round: 20
        tool: record_thought
        title: Die Prahlerei als Haftungstitel
        core: "Sachs nimmt Trump beim Wort, um ihn zu binden: Wenn Trump behauptet, Netanyahu
          tue, was er sage, dann ist jede israelische Fortsetzung Trump zuzurechnen. Die
          Beteuerung der Kontrolle wird zum Haftungstitel — dieselbe Aussage, die vorher
