        count: 12
        note: Absätze 241–252 von 299.
      - round: 42
        tool: record_thought
        title: "Die Kaskade: Zerstörung, Realwirtschaft, Finanzmärkte"
        core: "Sachs beschreibt eine Kaskade in drei Stufen: physische Zerstörung, dann
          Realwirtschaft, dann Finanzmärkte — bis hin zum Bank Run auf ein Land, das als
          sicherer Hafen der Region gilt. Die Emirate fragen bereits nach Swap-Linien;
          das ist der Frühindikator."
        type: verbindung
        paragraphs:
          - 242
          - 243
          - 244
          - 245
          - 246
        evidence: '"first you get the physical destruction then you get the real economy ... But
          then you get the financial effects"'
        note: Abgelegt als Gedanke 40. Lies weiter oder rufe done auf.
      - round: 42
        tool: record_thought
        title: Koinzidenz statt Addition
        core: "Die eigentliche Gefahr liegt in der Koinzidenz: Ein Super-El-Niño trifft auf eine
          bereits fragile Welt und auf die Zerstörung im Golf. Sachs erinnert daran,
          dass 1973/74 ebenfalls ein El-Niño-Jahr war — die Kombination aus
          Energieschock und Ernteausfall trieb die Nahrungsmittelpreise. Zwei Schocks,
          die sich multiplizieren statt addieren."
        type: verbindung
        paragraphs:
          - 247
          - 250
          - 251
          - 252
        evidence: "\"if you combine a mass destruction in West Asia, the Gulf, the Eastern
          Mediterranean, with a super El Nino, I don't even know\""
        note: Abgelegt als Gedanke 41. Lies weiter oder rufe done auf.
      - round: 43
        tool: read
        from: 253
        count: 12
        note: Absätze 253–264 von 299.
      - round: 44
        tool: record_thought
        title: Zündschnüre statt Strategie
        core: "Die Eskalation wird nicht durch Absicht, sondern durch Geschwindigkeit
          gefährlich: Eine chinesische Flotte fährt in den Golf, Entscheidungen fallen
          in Sekunden, Systeme wie Maven könnten 'shoot' sagen. Sachs' Bild ist das der
          Zündschnüre — nicht ein Plan, sondern viele entzündete Fäden ohne
          Kontrollinstanz."
        type: begriff
        paragraphs:
          - 253
          - 254
          - 255
          - 257
          - 259
        evidence: "\"we're just lighting fuses that could blow up everything if we choose the
          ramp of escalation\""
        note: Abgelegt als Gedanke 42. Lies weiter oder rufe done auf.
      - round: 44
        tool: record_thought
        title: Katastrophe als Fehlkalkulation
        core: "Sachs' Antwort auf die Endzeitfrage ist eine Geschichtstheorie: Katastrophen
          geschehen nicht durch Prophezeiung, sondern durch Fehlkalkulation, fehlende
          Kommunikation und den Zusammenbruch systematischer Verfahren. Das ist die
          säkulare Alternative zur Providenz — und zugleich die tröstlichere, weil sie
          Handlungsspielraum lässt."
        type: umkehrung
        paragraphs:
          - 260
          - 262
          - 263
          - 264
        evidence: "\"Terrible things happen because individual leaders and governments make
          miscalculations. They don't talk to each other.\""
        note: Abgelegt als Gedanke 43. Lies weiter oder rufe done auf.
