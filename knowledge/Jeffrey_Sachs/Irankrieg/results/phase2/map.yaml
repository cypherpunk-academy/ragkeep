        tool: read
        from: 229
        count: 12
        note: Absätze 229–240 von 299.
      - round: 40
        tool: record_thought
        title: Abschalten versus Zerstören
        core: "Der entscheidende Unterschied zu 1973/79: Damals wurde der Fluss gestoppt, jetzt
          würde die Infrastruktur zerstört. Ein Embargo ist reversibel, eine zerstörte
          Raffinerie nicht. Sachs verschiebt damit die Kategorie von 'Unterbrechung' zu
          'Substanzverlust'."
        type: unterscheidung
        paragraphs:
          - 229
          - 231
          - 232
          - 233
        evidence: "\"the oil got turned off but the oil fields weren't destroyed. There was no
