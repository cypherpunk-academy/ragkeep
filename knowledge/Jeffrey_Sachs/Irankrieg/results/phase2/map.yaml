      - round: 40
        tool: record_thought
        title: Von Gas zu Brot
        core: "Die Kette reicht vom Erdgas über Ammoniak zum Stickstoffdünger: Eine
          Unterbrechung der Golfproduktion ist eine Nahrungsmittelkrise, nicht nur eine
          Energiekrise. Und die Raffinerien sind Hochtechnologieanlagen, die für Frieden
          gebaut wurden — nicht für Krieg."
        type: verbindung
        paragraphs:
          - 233
          - 235
          - 237
          - 239
        evidence: '"they are not built for war. They are built for just normal, peaceful,
          complex, sophisticated operations."'
        note: Abgelegt als Gedanke 39. Lies weiter oder rufe done auf.
