      - round: 36
        tool: record_thought
        title: Kanonen statt Zähne
        core: "Der 'Washington gaffe' ist die Wahrheit: Kriege und Gesundheitsversorgung sind
          dieselbe Budgetfrage. Der Haushalt erhöht das Militär um eine halbe Billion
          und senkt die Leistungen — die Priorität ist damit offen dokumentiert. Sachs
