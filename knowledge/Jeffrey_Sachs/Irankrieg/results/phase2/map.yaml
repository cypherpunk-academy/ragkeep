        tool: record_thought
        title: Deliberation als Maßstab, nicht Ideologie
        core: "Die überraschende Umkehrung: China habe die deliberativsten Verfahren, die Sachs
          kennt — zwei Jahre Detailberatung über Zukunftsbranchen. Das Bild vom
          allentscheidenden Xi hält er für westliche Projektion. Die Gegenüberstellung
