maps:
  - source_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    segment_id: on-the-real-origins-of-the-iran-war-and-the-coming-economic-devastation
    stop: done
    steps:
      - round: 1
        tool: read
        from: 1
        count: 12
        note: Absätze 1–12 von 299.
      - round: 2
        tool: record_thought
        title: Die Weggabelung als Zeitproblem
        core: "Sachs beschreibt die Lage nicht als Wahl zwischen zwei Optionen, sondern als
          instabile Situation, in der die Zeit selbst zum Akteur wird: Weil die Straße
          von Hormus geschlossen ist, baut sich die Wirtschaftskrise kontinuierlich auf,
          und damit verfällt die Option 'später entscheiden'. Die Gabelung ist keine
          ruhige Abzweigung, sondern ein Fenster, das sich schließt."
        type: unterscheidung
        paragraphs:
          - 1
          - 2
          - 4
        evidence: "\"we're not in a stable situation where we can choose one or the other. We're
          in an unstable situation as we speak.\""
        note: Abgelegt als Gedanke 0. Lies weiter oder rufe done auf.
      - round: 2
        tool: record_thought
        title: Die Meerenge als Nadelöhr der Weltwirtschaft
        core: Die Blockade wirkt nicht primär über Öl, sondern über die gesamte Palette
          strategischer Güter — Düngemittel, Petrochemikalien, Aluminium. Ein schmaler
          Wasserstreifen wird so zum Hebel, mit dem ein regionaler Konflikt die
          Weltwirtschaft insgesamt in Geiselhaft nimmt.
        type: begriff
        paragraphs:
          - 3
          - 5
        note: Abgelegt als Gedanke 1. Lies weiter oder rufe done auf.
      - round: 3
        tool: read
        from: 13
        count: 12
        note: Absätze 13–24 von 299.
      - round: 4
        tool: record_thought
        title: Der Off-Ramp als eingestandenes Scheitern
        core: "Der Ausstieg ist kein Sieg, sondern eine Niederlage, die als solche eingestanden
          werden müsste: Iran kontrolliert nach dem Krieg faktisch die Meerenge und
          damit 20% der Weltenergie und 30% des Düngemittels. Wer den Off-Ramp nimmt,
          muss zugeben, dass der Krieg die Position des Gegners gestärkt hat."
        type: umkehrung
        paragraphs:
          - 16
        evidence: '"they would have to swallow a lot to walk this back because it would mean
          that Iran is more powerful now in effect than it was before the war started"'
        note: Abgelegt als Gedanke 2. Lies weiter oder rufe done auf.
      - round: 4
        tool: record_thought
        title: Bauen gegen Niederreißen
        core: "Sachs korrigiert das Bild vom 'iranischen Sieg' durch die Bilanz der Zerstörung:
          160 getötete Schulmädchen, Tausende Tote, jahrelanger Wiederaufbau. Der
          entscheidende Satz ist biographisch — als Entwicklungsökonom, dessen
          Lebenswerk das Bauen ist, verurteilt er das Niederreißen. Das ist keine
          militärische, sondern eine ethische Kategorie."
        type: ausdruck
        paragraphs:
          - 18
          - 20
          - 21
          - 22
          - 23
          - 24
        evidence: "\"For me as a development economist whose whole career over half a century is
          to try to build things. I don't like to see things knocked down this way.\""
        note: Abgelegt als Gedanke 3. Lies weiter oder rufe done auf.
      - round: 5
        tool: read
        from: 25
        count: 12
        note: Absätze 25–36 von 299.
      - round: 6
        tool: record_thought
        title: Die Böse-Achse als Produkt der Erzählung
        core: "Sachs kehrt die übliche Begründung um: Nicht Irans Kontrolle der Meerenge ist das
          Problem, sondern die Erzählung, die sie bedrohlich erscheinen lässt. Die
          'Achse des Bösen' ist für ihn kein Befund über Iran, sondern ein Produkt
          jahrzehntelanger offizieller Propaganda — und damit eine Kategorie, die die
          Wahrnehmung der Fakten vorstrukturiert."
        type: umkehrung
        paragraphs:
          - 27
          - 28
          - 29
        evidence: '"It is our non-stop official propaganda narrative."'
        note: Abgelegt als Gedanke 4. Lies weiter oder rufe done auf.
      - round: 6
        tool: record_thought
        title: Der unerhörte Satz von 1953
        core: "Der Ursprung des Konflikts liegt für Sachs 1953: Mossadeghs Satz, das Öl unter
          dem eigenen Boden sei iranisch, wird zum unerhörten Satz der Region. Die
          Antwort ist ein Putschereignis, das er mit heutiger Sprache 'Farbenrevolution'
          nennt — Empire-Logik, die Souveränität als Reputationsfrage behandelt."
        type: begriff
        paragraphs:
          - 31
          - 32
          - 33
        evidence: '"I think the oil under our ground is Iranian not British."'
        note: Abgelegt als Gedanke 5. Lies weiter oder rufe done auf.
      - round: 7
        tool: read
        from: 37
        count: 12
        note: Absätze 37–48 von 299.
      - round: 8
        tool: record_thought
        title: Bestrafung als Signal an das Empire
        core: "Sachs formuliert eine Empire-Logik: Ein Empire kann Gesichtsverlust nicht
          tolerieren, weil die Bestrafung nicht nur den Abtrünnigen, sondern alle
          anderen Provinzen adressiert. Der Angriff auf Iran ist damit primär eine
          Botschaft an das eigene Gefüge — 'don't you dare try this'."
        type: begriff
        paragraphs:
          - 35
          - 38
        evidence: "\"An empire needs to repay any kind of loss of face with some kind of extreme
          punishment not only to get that particular recalcitrant place under control
          but to signal to all the rest of the empire don't you dare try this.\""
        note: Abgelegt als Gedanke 6. Lies weiter oder rufe done auf.
      - round: 8
        tool: record_thought
        title: Überwachung gegen Sanktionen
        core: "Der Atomwaffen-Vorwand wird durch die Chronologie entlarvt: Iran hat nie eine
          Bombe verfolgt, sondern einen Vertrag gesucht — Überwachung gegen Aufhebung
          der Sanktionen. Die Forderung ist also nicht 'lasst uns die Bombe', sondern
          'lasst uns atmen'. Der eigentliche casus belli bleibt der Austritt von 1979."
        type: unterscheidung
        paragraphs:
          - 42
          - 43
          - 44
          - 45
          - 46
        evidence: '"What Iran has wanted for 15 years is you supervise us, you control us. Fine,
          but lift your sanctions. Let us breathe."'
        note: Abgelegt als Gedanke 7. Lies weiter oder rufe done auf.
      - round: 9
        tool: read
        from: 49
        count: 12
        note: Absätze 49–60 von 299.
      - round: 10
        tool: record_thought
        title: Das zerstörte Beweisstück JCPOA
        core: "Das JCPOA wird zum Beweisstück: 2015 gab es genau die Lösung, die Trump heute zu
          erzwingen behauptet — multilateral, vom Sicherheitsrat einstimmig gebilligt.
          Dass sie zerstört wurde, zeigt, dass es nie um Nichtverbreitung ging, sondern
          um Regimewechsel. Der Vorwand ist durch die eigene Geschichte widerlegt."
        type: umkehrung
        paragraphs:
          - 51
          - 52
          - 53
        evidence: "\"This is the approach that you don't want them to have a nuclear weapon when
          you had the control. No, this is the opposite.\""
        note: Abgelegt als Gedanke 8. Lies weiter oder rufe done auf.
      - round: 10
        tool: record_thought
        title: "Zwei Motive: Reputation und Dominanz"
        core: "Sachs trennt zwei Motive, die oft verschmelzen: Die USA wollen einen Abtrünnigen
          zurückholen (Reputation), Israel will vollständige militärische Dominanz in
          Westasien — Iran ist 'der letzte große Preis'. Daraus folgt, warum Israel den
          Off-Ramp noch stärker ablehnt als die USA: Für Israel ist der Ausstieg kein
          Gesichtsverlust, sondern ein unerledigtes Projekt."
        type: unterscheidung
        paragraphs:
          - 55
          - 56
          - 57
          - 58
        evidence: "\"That's Israel saying, 'We control almost all of the Middle East militarily,
          but Iran we don't yet control.' So that's the last big prize.\""
        note: Abgelegt als Gedanke 9. Lies weiter oder rufe done auf.
      - round: 11
        tool: read
        from: 61
        count: 12
        note: Absätze 61–72 von 299.
      - round: 12
        tool: record_thought
        title: "Clean Break: Gegner eine Ebene höher"
        core: "Die 'Clean Break'-Strategie ist der Schlüssel zur Logik: Statt militante Gruppen
          direkt zu bekämpfen, werden die Staaten angegriffen, die sie stützen. Der
          Krieg gegen Iran ist damit kein Sonderfall, sondern die konsequente Anwendung
          eines 30 Jahre alten Plans — die Gegner werden eine Ebene höher gesucht."
        type: begriff
        paragraphs:
          - 66
          - 68
        evidence: '"rather than fighting those militant groups directly, we need to bring down
          the governments in the Middle East and West Asia that support those groups."'
        note: Abgelegt als Gedanke 10. Lies weiter oder rufe done auf.
      - round: 12
        tool: record_thought
        title: Der Bruch mit dem Völkerrecht
        core: "'Clean Break' ist wörtlich zu nehmen: der Bruch mit 'Land für Frieden' und dem
          Völkerrecht. Der Begriff markiert also nicht nur eine Strategie, sondern die
          Verabschiedung einer Rechtsgrundlage — Großisrael als religiös-territorialer
          Anspruch 'vom Strom Ägyptens bis zum Euphrat'."
        type: ausdruck
        paragraphs:
          - 69
          - 70
          - 71
        evidence: '"The clean break was the clean break from the peace accords, from the land
          for peace idea"'
        note: Abgelegt als Gedanke 11. Lies weiter oder rufe done auf.
      - round: 13
        tool: read
        from: 73
        count: 12
        note: Absätze 73–84 von 299.
      - round: 14
        tool: record_thought
        title: Die sieben Kriege
        core: "Sachs zählt sieben Kriege auf — Libyen, Sudan, Somalia, Libanon, Syrien, Irak,
          Iran — und sechs davon sind bereits in Chaos versunken. Das ist die stärkste
          empirische Stütze seiner These: Die Bilanz ist keine Serie von Fehlschlägen,
          sondern ein Muster mit Erfolgsbilanz aus Sicht der Chaos-Profiteure."
        type: verbindung
        paragraphs:
          - 74
          - 75
          - 76
          - 77
        evidence: '"Six of those wars have led to bloodbaths and disasters"'
        note: Abgelegt als Gedanke 12. Lies weiter oder rufe done auf.
      - round: 14
        tool: record_thought
        title: Chaos als Zielgröße
        core: "Chaos wird hier nicht als Kollateralschaden, sondern als Zielgröße lesbar:
          Zerrüttete Staaten können sich nicht zusammenschließen, und die Hegemonie
          bleibt unangefochten. 'What could be better?' — die Frage entlarvt die
          humanitäre Rhetorik als bloße Verpackung."
        type: umkehrung
        paragraphs:
          - 77
          - 78
          - 79
        evidence: '"That means we are the military hegemon for all of that region stretching
          from Libya to Iraq. Chaos is great."'
        note: Abgelegt als Gedanke 13. Lies weiter oder rufe done auf.
      - round: 15
        tool: read
        from: 85
        count: 12
        note: Absätze 85–96 von 299.
      - round: 16
        tool: record_thought
        title: Enthauptung als Ölgeschäft
        core: "Sachs fügt eine dritte Motivschicht hinzu: das Öl als Beute. Trump habe aus
          Venezuela gelernt, dass Enthauptung plus Regimewechsel den Zugriff auf
          Rohstoffe bedeutet — und auf Iran übertragen. Der Krieg erscheint damit nicht
          als Sicherheitspolitik, sondern als Aneignungsgeschäft."
        type: verbindung
        paragraphs:
          - 85
          - 87
        evidence: '"I can do a decapitation and then own the oil of that country."'
        note: Abgelegt als Gedanke 14. Lies weiter oder rufe done auf.
      - round: 16
        tool: record_thought
        title: Grausam, illegal, wahnhaft
        core: "Sachs' Formel 'grausam, illegal, wahnhaft' trennt die Bewertung von der Existenz
          der Motive: Es gab Gründe für diesen Krieg, nur keine gültigen. Das erklärt,
          warum der Off-Ramp so schwer ist — er würde alle diese Gründe unerfüllt
          lassen, und genau das macht ihn richtig."
        type: ausdruck
        paragraphs:
          - 88
          - 89
        evidence: '"Cruel, illegal, delusional. ... there were reasons for this war. And taking
          the off-ramp means that none of those would be fulfilled."'
        note: Abgelegt als Gedanke 15. Lies weiter oder rufe done auf.
      - round: 17
        tool: read
        from: 97
        count: 12
        note: Absätze 97–108 von 299.
      - round: 18
        tool: record_thought
        title: Derselbe Sandsturm auf beiden Seiten
        core: "Der Sandsturm auf beiden Seiten der Grenze wird zum Bild für die Künstlichkeit
          politischer Linien: Geteiltes ökologisches Schicksal, getrennte Zuständigkeit.
          Sachs leitet daraus keine Verschwörung ab, sondern eine Banalität — man
          braucht kein Geoengineering, wo gemeinsame Probleme gemeinsame Lösungen
          verlangen."
        type: ausdruck
        paragraphs:
          - 95
          - 96
          - 97
        evidence: "\"there's the sandstorm on one side, the same sandstorm on the other side,
          and they should be working together\""
        note: Abgelegt als Gedanke 16. Lies weiter oder rufe done auf.
      - round: 18
        tool: record_thought
        title: Der ersetzte Feind
        core: "Die Syrien-Bilanz ist die schärfste Ironie: Ein säkularer Staat, der Minderheiten
          schützte, wird zerstört, um durch einen Jihadisten ersetzt zu werden — also
          durch genau den Gegner, den man zu bekämpfen behauptete. Und die Zerstörung
          erfasst Kulturerbe, das Jahrtausende überdauerte, in Stunden."
        type: umkehrung
        paragraphs:
          - 105
          - 107
          - 108
        evidence: '"to take a secular government that protected religious minorities ... and
          replace it with a guy we thought we were fighting against"'
        note: Abgelegt als Gedanke 17. Lies weiter oder rufe done auf.
      - round: 19
        tool: read
        from: 109
        count: 12
        note: Absätze 109–120 von 299.
      - round: 20
        tool: record_thought
        title: Sich in die eigene Rhetorik hineinreden
        core: "Carlson beschreibt einen Mechanismus, den Sachs bestätigt: Man redet sich in die
          eigene Rhetorik hinein. Der Atomvorwurf wird zunächst instrumentell erhoben,
          dann geglaubt — bis die Existenzangst real wird. Die Lüge wird wahr, weil der
          Lügner sie schließlich selbst fürchtet."
        type: begriff
        paragraphs:
          - 112
          - 113
        evidence: '"if you say it enough, you start to believe that the main threat to your
          existence is this government"'
        note: Abgelegt als Gedanke 18. Lies weiter oder rufe done auf.
      - round: 20
        tool: record_thought
        title: Präventive Selbstverteidigung als Dauerzustand
        core: "Sachs leitet aus der präventiven Selbstverteidigung eine Logik ab: Wer glaubt,
          vorbeugend töten zu müssen, und Gespräche ausschließt, wird zum 'non-stop
          killer'. Der Sparta-Vergleich zeigt die Konsequenz — ein Staat, der die
          Fähigkeit zur Diplomatie verloren hat und nur noch Diplomaten besitzt."
        type: verbindung
        paragraphs:
          - 114
          - 115
          - 116
          - 117
          - 118
        evidence: '"If you live like that, you end up as a killer non-stop."'
        note: Abgelegt als Gedanke 19. Lies weiter oder rufe done auf.
      - round: 21
        tool: read
        from: 121
        count: 12
        note: Absätze 121–132 von 299.
      - round: 22
        tool: record_thought
        title: Zwei Varianten, eine Koalition
        core: "Sachs unterscheidet zwei Varianten israelischer Radikalität, die heute eine
          Koalition bilden: eine säkulare Sicherheitsvariante (Netanjahu, 'töten bevor
          sie töten') und eine theologisch-messianische (Ben-Gvir, Smotrich). Beide
          treffen sich im Ergebnis, obwohl ihre Begründungen verschieden sind."
        type: unterscheidung
        paragraphs:
          - 127
          - 128
          - 131
          - 132
        evidence: '"two variants of Israeli extremism that are not the same, but they are now
          literally a coalition"'
        note: Abgelegt als Gedanke 20. Lies weiter oder rufe done auf.
      - round: 22
        tool: record_thought
        title: Kein Ausweg ohne Anerkennung
        core: "Der entscheidende Punkt ist die Verweigerung der Anerkennung: Wer die Menschen,
          die er expropriiert hat, nicht als Gesprächspartner denkt, kann keinen Ausweg
          formulieren. Netanjahus fehlender Off-Ramp ist deshalb kein Taktikproblem,
          sondern Folge eines Ausgangspunkts, der die andere Seite als Mensch nicht
          vorsieht."
        type: umkehrung
        paragraphs:
          - 121
          - 123
          - 124
        evidence: "\"his starting point is something obnoxious which is we don't recognize the
          people that live among us\""
        note: Abgelegt als Gedanke 21. Lies weiter oder rufe done auf.
      - round: 23
        tool: read
        from: 133
        count: 12
        note: Absätze 133–144 von 299.
      - round: 24
        tool: record_thought
        title: Der säkulare Ursprung, die späte Theologie
        core: "Sachs' historische Pointe: Der ursprüngliche Zionismus war säkular, ja
          anti-rabbinisch — Herzl dachte an Uganda, nicht ans Heilige Land. Die
          rabbinische Tradition hatte sogar geboten, nicht zurückzukehren. Der heutige
          religiöse Anspruch ist also keine alte Tradition, sondern eine Erfindung des
          20. Jahrhunderts, verstärkt nach 1967."
        type: umkehrung
        paragraphs:
          - 140
          - 141
          - 142
          - 143
        evidence: "\"The rabbis had said 1500 years earlier, don't go back to the Holy Land.\""
        note: Abgelegt als Gedanke 22. Lies weiter oder rufe done auf.
      - round: 24
        tool: record_thought
        title: Die Konvertiten-Fußnote
        core: "Die Herkunftsfrage wird zur Ironie: Wenn viele Palästinenser Nachfahren
          konvertierter Juden sind, dann ist der Anspruch 'God gave us that land'
          biologisch wie historisch unterlaufen. Ben-Gurion habe das in den 30er/40er
          Jahren selbst so gesehen — was die Frage aufwirft, wie die Vertreibung mit
          diesem Wissen zu rechtfertigen war."
        type: begriff
        paragraphs:
          - 138
          - 139
        evidence: '"calling the Palestinians really the original Jews of the land who probably
          converted"'
        note: Abgelegt als Gedanke 23. Lies weiter oder rufe done auf.
      - round: 25
        tool: read
        from: 145
        count: 12
        note: Absätze 145–156 von 299.
      - round: 26
        tool: record_thought
        title: Von 'facts on the ground' zur Erlösung
        core: "Sachs datiert den Umschlag präzise: In den 70ern waren Siedlungen 'facts on the
          ground' — säkulare Sicherheitspolitik. Wenig später tanzen junge Zeloten in
          Jerusalem und erklären dieselben Orte zur göttlichen Verheißung. Aus
          Verwaltung wird Erlösung; die Begründung wechselt, das Projekt bleibt."
        type: unterscheidung
        paragraphs:
          - 145
          - 146
          - 147
          - 148
          - 149
        evidence: "\"This was suddenly now the redemption of God's promise. This was something
          new.\""
        note: Abgelegt als Gedanke 24. Lies weiter oder rufe done auf.
      - round: 26
        tool: record_thought
        title: Christlicher Zionismus als Endzeit-Projekt
        core: "Die überraschendste Verbindung: Der Zionismus ist nicht jüdisch entsprungen,
          sondern wurde von christlichen Zionisten mitgetragen — einer
          Endzeit-Theologie, die Juden im Heiligen Land braucht, damit die Wiederkunft
          stattfinden kann. Dass diese Leute oft Antisemiten waren, die Juden loswerden
          wollten, macht die Allianz zur strukturellen Ironie."
        type: verbindung
        paragraphs:
          - 151
          - 152
          - 153
          - 154
        evidence: '"these Christian Zionists were often rather confirmed anti-semites ... they
          wanted them conveniently anyway out of Britain and back in the Holy Land"'
        note: Abgelegt als Gedanke 25. Lies weiter oder rufe done auf.
      - round: 27
        tool: read
        from: 157
        count: 12
        note: Absätze 157–168 von 299.
      - round: 28
        tool: record_thought
        title: Selbstmord auf Kredit
        core: "Sachs' Vorwurf an Israel ist nicht primär moralisch an den Opfern, sondern
          existenziell am Täter: Israel begehe Selbstmord, weil es sich außerhalb der
          Zivilisation, des Völkerrechts und der Weltöffentlichkeit stellt und dabei auf
          eine unbedingte US-Garantie baut, die nicht halten wird."
        type: umkehrung
        paragraphs:
          - 161
          - 162
          - 163
        evidence: '"I said to him that I thought Israel was and is committing suicide."'
        note: Abgelegt als Gedanke 26. Lies weiter oder rufe done auf.
      - round: 28
        tool: record_thought
        title: Der abrupte Umschwung
        core: "Sachs erwartet keinen langsamen Stimmungswandel, sondern einen abrupten Bruch —
          beschleunigt durch die Wirtschaftskrise. Die politische Ökonomie wird zum
          Zeitmesser: Wenn in vier Wochen halb Golf zerstört ist, entscheidet nicht mehr
          Moral, sondern Einkommen."
        type: verbindung
        paragraphs:
          - 164
          - 165
          - 166
          - 167
          - 168
        evidence: "\"wait a few weeks what it's going to be like when their incomes are
          decimated\""
        note: Abgelegt als Gedanke 27. Lies weiter oder rufe done auf.
      - round: 29
        tool: read
        from: 169
        count: 12
        note: Absätze 169–180 von 299.
      - round: 30
        tool: record_thought
        title: Die ausgelassenen Evangelien
        core: "Sachs' bibelhermeneutischer Einwand: Der Christian Zionism liest nur Genesis
          15/18, Josua und Offenbarung — und lässt die Evangelien aus. Die Bergpredigt
          mit ihrer radikalen Versöhnung und Gewaltlosigkeit steht in direktem Gegensatz
          zum Projekt. Die Auswahl der Textstellen ist selbst die Ideologie."
        type: unterscheidung
        paragraphs:
          - 169
          - 171
          - 174
          - 175
        evidence: '"you can only support Christian Zionism if you ignore the Gospels"'
        note: Abgelegt als Gedanke 28. Lies weiter oder rufe done auf.
      - round: 30
        tool: record_thought
        title: 230 Jahre ohne Angriff
        core: "Gegen die Bedrohungserzählung setzt Sachs eine schlichte empirische Prüfung: Iran
          hat seit den 1790er Jahren kein Land angegriffen. Die Frage 'Was macht Israel
          dann?' beruht auf einer Prämisse, die die Fakten nicht stützen — Iran will
          einen Platz in der Welt, nicht die Zerstörung Israels."
        type: umkehrung
        paragraphs:
          - 178
          - 179
          - 180
        evidence: '"Iran is not out to destroy Israel. Iran does not want to be destroyed by a
          petulant annoyed American empire from which it escaped."'
        note: Abgelegt als Gedanke 29. Lies weiter oder rufe done auf.
      - round: 31
        tool: read
        from: 181
        count: 12
        note: Absätze 181–192 von 299.
      - round: 32
        tool: record_thought
        title: Der getötete Fatwa-Geber
        core: "Die schärfste Ironie des Textes: Wer Iran am Bau einer Bombe hindern will, tötet
          ausgerechnet den Geistlichen, der die Bombe per Fatwa verboten hatte. Die
          Handlung widerlegt das Ziel — ein Beweis, dass es nicht um Nichtverbreitung
          ging."
        type: umkehrung
        paragraphs:
          - 185
          - 186
          - 187
        evidence: '"you would not kill the religious leader who issued the decree that nuclear
          weapons are against the religion"'
        note: Abgelegt als Gedanke 30. Lies weiter oder rufe done auf.
      - round: 32
        tool: record_thought
        title: Milizen als Symptom, nicht Ursache
        core: "Sachs argumentiert, dass die Hamas-/Hisbollah-Unterstützung eine Funktion der
          Palästinafrage ist: Entsteht ein palästinensischer Staat, endet die
          Unterstützung. Damit wird die Reihenfolge umgedreht — nicht die Milizen sind
          die Ursache, sondern die fehlenden politischen Rechte sind es."
        type: verbindung
        paragraphs:
          - 182
          - 183
        evidence: '"Iran has supported Hezbollah and Hamas and it would stop supporting Hamas
          and Hezbollah if there is a Palestinian state alongside the state of Israel"'
