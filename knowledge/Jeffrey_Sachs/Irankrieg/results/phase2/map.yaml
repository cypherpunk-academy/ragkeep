        tool: read
        from: 265
        count: 12
        note: Absätze 265–276 von 299.
      - round: 46
        tool: record_thought
        title: Overload und Nichtlinearität
        core: "Sachs' Begriff 'Overload' meint Nichtlinearität: In Krisen haben Entscheidungen
          sehr große, sprunghafte Folgen, und genau dann entscheiden Einzelne. Das ist
          die Umkehrung der Systemthese — nicht Strukturen, sondern Personen retten oder
          zerstören die Welt."
        type: begriff
        paragraphs:
          - 265
          - 266
        evidence: '"these are really big choices and the truth is individuals make a big
          difference at times like this"'
        note: Abgelegt als Gedanke 44. Lies weiter oder rufe done auf.
      - round: 46
        tool: record_thought
        title: ExComm und das Fehlen eines Verfahrens
        core: "Die Kubakrise dient als Kontrastfolie: ExComm, Protokolle, Hinterkanäle, U Thant
          als Vermittler, Kongresskonsultation — und am Ende rettete Kennedys Kühle die
          Welt gegen die Heißsporne im Militär. Heute fehlt jede dieser Instanzen: kein
          interagency review, keine Geheimdienstbewertung, keine Joint Chiefs. Die
          Abwesenheit von Verfahren ist die eigentliche Gefahr."
        type: unterscheidung
        paragraphs:
          - 267
          - 270
          - 271
          - 274
          - 275
          - 276
        evidence: "\"it was President Kennedy's cool and rationality and decency that saved the
          world\""
        note: Abgelegt als Gedanke 45. Lies weiter oder rufe done auf.
