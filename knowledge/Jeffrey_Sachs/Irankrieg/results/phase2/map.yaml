      - round: 5
        tool: record_thought
        title: Normalisierung als eigentliche Verletzung
        core: 'Sachs nennt eine Kontinuität über fünf Administrationen (Bush jr., Obama, Trump
          I, Biden, Trump II). Das ist keine Parteikritik, sondern eine
          Strukturdiagnose: außergerichtliche Tötung ist kein Ausrutscher, sondern
          Bestandteil des Handwerks („statecraft"). Die Pointe liegt im Wort
          „normalized" — die Normverletzung wird durch Wiederholung zur Norm.'
        type: verbindung
        paragraphs:
          - 28
          - 29
          - 30
        evidence: '"this kind of extrajudicial killing is part and parcel of American statecraft
          at least in the 21st century"'
        note: Abgelegt als Gedanke 1. Lies weiter oder rufe done auf.
