      - round: 21
        tool: read
        from: 109
        count: 8
        note: Absätze 109–116 von 116.
      - round: 22
        tool: record_thought
        title: "Der Bogen: Freiheitsrhetorik gegen den eigenen Staat"
        core: 'Der Rahmen der Sendung — die Eingangssequenz über Angriffskriege, Jefferson,
          „government that governs least" — wird durch das Gespräch nicht eingelöst,
          sondern bestätigt: Die Sorge um illegitime Gewalt ist kein abstraktes
