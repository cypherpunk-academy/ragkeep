        count: 12
        note: Absätze 37–48 von 116.
      - round: 7
        tool: record_thought
        title: Die Beteuerung der Kontrolle als ihr Gegenteil
        core: 'Napolitano fragt, ob Trump Netanyahu steuert oder umgekehrt. Die Frage ist selbst
          die Antwort: Wer öffentlich beteuert, der andere tue „whatever I want",
          liefert das Eingeständnis der Abhängigkeit mit. Die Behauptung der Kontrolle
          ist das Symptom ihres Fehlens.'
        type: umkehrung
        paragraphs:
          - 46
          - 47
          - 48
        evidence: "\"he says this twice, he'll do whatever I want him to do. And I'm wondering
          if it's really the other way around.\""
