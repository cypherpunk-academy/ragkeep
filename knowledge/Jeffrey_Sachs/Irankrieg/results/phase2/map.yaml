      - round: 50
        tool: record_thought
        title: Der Kongress, der einmal funktionierte
        core: "Der Schluss verschiebt die Frage von Außenpolitik zu Verfassungsfrage: Nicht ob
          Amerika die Welt führen soll, sondern ob ein System funktioniert, in dem ein
          Einzelner aus Bauchgefühl entscheidet. Sachs' Erinnerung an den Kongress der
