      - round: 3
        tool: record_thought
        title: Rechtsrhetorik als Waffe der Täter
        core: 'Sachs dreht die moralische Grammatik um: Die USA sprechen die Sprache des Rechts,
          während sie Handlungen begehen, die sie anderen als Verbrechen vorwerfen. Der
          Begriff „Mord" wird nicht moralisch, sondern juristisch-distributiv verwendet
          — er markiert, wer definitionsmächtig ist. Die Pointe: Nicht die Tat
          unterscheidet Freund und Feind, sondern die Zuschreibung.'
