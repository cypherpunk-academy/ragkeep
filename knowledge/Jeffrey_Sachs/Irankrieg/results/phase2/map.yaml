        tool: record_thought
        title: Artikel I und die verweigerte Aufsicht
        core: "Sachs' Verfassungsargument ist präzise: Kriegserklärung liegt nach Artikel I
          allein beim Kongress, nicht geteilt mit dem Präsidenten. Dass fast alle
          Republikaner und fast alle Demokraten die Aufsicht verweigern, ist für ihn
          kein politisches, sondern ein Verfallszeichen — 'late stage republics'."
        type: begriff
        paragraphs:
          - 280
          - 281
          - 282
          - 283
        evidence: '"they are the only branch that can declare war"'
