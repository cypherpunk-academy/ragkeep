        count: 12
        note: Absätze 1–12 von 46.
      - round: 2
        tool: record_thought
        title: Der künstliche Krieg
        core: "Sachs behauptet nicht, der Irankrieg sei falsch kalkuliert — er behauptet, er sei
          überhaupt nicht nötig gewesen. Die Krise ist nicht aus einem Konflikt geboren,
          sondern aus einer Entscheidung: 'completely artificial, completely arbitrary'.
          Damit verschiebt sich die Analyseebene: Die Frage ist nicht, wie man den Krieg
          gewinnt, sondern warum er überhaupt erfunden wurde."
        type: begriff
        paragraphs:
          - 4
        evidence: '"we have enough problems in this world without making up new crises"'
        note: Abgelegt als Gedanke 0. Lies weiter oder rufe done auf.
      - round: 2
        tool: record_thought
        title: Venezuela als Modell — und seine Übertragungsgrenze
        core: "Trumps Irankrieg ist eine Kopie: Bestechung, Geheimabsprachen mit einem
          Vizepräsidenten, Umsturz, Öleinnahmen. Der Fehler liegt in der Analogie. Was
          in der eigenen Hemisphäre funktioniert, wo die USA als Gangster auftreten
          können, trifft auf ein Land mit fast 100 Millionen Menschen in großer
          Entfernung, das sich nicht diktieren lässt. Sachs' Pointe: Verbrechen plus
          Dummheit — die Übertragung eines lokalen Erfolgsrezepts auf einen Fall, in dem
          die Machtverhältnisse nicht stimmen."
        type: unterscheidung
        paragraphs:
          - 5
          - 6
        evidence: "\"He could do it in his own neighborhood in Venezuela. Yes, the United States
          can be a gangster. [...] But in Iran, it doesn't work that way.\""
        note: Abgelegt als Gedanke 1. Lies weiter oder rufe done auf.
      - round: 3
        tool: read
        from: 13
        count: 12
        note: Absätze 13–24 von 46.
      - round: 4
        tool: record_thought
        title: Chips statt Schutzschild
        core: "Die Golfstaaten kauften nicht Schutz, sondern ein Bild von Macht — konkret:
          Nvidia-Chips und Rechenzentren als Belohnung für Gefolgschaft. Sachs nennt das
          'bought off by this image of U.S. power'. Der Zusammenbruch der Abschreckung
          ist damit nicht nur militärisch, sondern epistemisch: Die Verbündeten haben
          sich in der Währung der Technologiezuteilung täuschen lassen."
        type: ausdruck
        paragraphs:
          - 16
        evidence: '"They were clearly bought off by this image of U.S. power"'
        note: Abgelegt als Gedanke 2. Lies weiter oder rufe done auf.
      - round: 4
        tool: record_thought
        title: Die Bedrohung sind wir selbst
        core: "Sachs' Umkehrung: Nicht die Bedrohung erzeugt die Aufrüstung, sondern die
          Aufrüstung erzeugt die Bedrohung. Wenn man NATO-Erweiterung, Irankrieg,
          Handelskrieg und die Unterstützung Israels unterließe, 'nothing terrible would
          happen'. Die einzige existenzielle Gefahr für die USA ist die eigene
          Aggression. Das ist eine radikale Umstellung der Sicherheitslogik: Sicherheit
          entsteht durch Unterlassen, nicht durch Handeln."
        type: umkehrung
        paragraphs:
          - 22
          - 23
        evidence: "\"there's no threat other than the threats we are making. How weird is
          that?\""
        note: Abgelegt als Gedanke 3. Lies weiter oder rufe done auf.
      - round: 5
        tool: read
        from: 25
        count: 12
        note: Absätze 25–36 von 46.
      - round: 6
        tool: record_thought
        title: Abfahren statt verhandeln
        core: "Sachs liefert eine erstaunlich konkrete Deeskalationsanweisung: kein Vertrag,
          kein Schuldeingeständnis, keine Verhandlung — nur umdrehen und heimfahren,
          Sieg ausrufen, Ölpreis fällt auf 70 Dollar. Der Ausweg ist also nicht
          diplomatisch, sondern performativ. Das ist die praktische Konsequenz aus der
          These vom selbstgemachten Krieg: Was ohne Grund begann, kann ohne Übereinkunft
          enden."
        type: ausdruck
        paragraphs:
          - 28
        evidence: "\"You don't have to put on paper that you lost. Just go home. Declare
          victory.\""
        note: Abgelegt als Gedanke 4. Lies weiter oder rufe done auf.
      - round: 6
        tool: record_thought
        title: Die versunkenen Kosten als politisches Gesetz
        core: "Sachs deutet die sunk-cost-Falle nicht als ökonomisches, sondern als
          politisch-psychologisches Gesetz: Wer etwas offensichtlich Dummes getan hat,
          muss es fortsetzen, um es nicht eingestehen zu müssen. Der Irankrieg wird
          damit nicht durch Strategie verlängert, sondern durch die Unfähigkeit zum
          Eingeständnis. Das erklärt, warum fehlende Erfolgsaussicht kein
          Abbruchkriterium ist."
        type: begriff
        paragraphs:
          - 25
          - 27
        evidence: "\"if you do something incredibly stupid, and it's revealed to be incredibly
          stupid, you must carry on so as not to admit you did something incredibly
          stupid\""
        note: Abgelegt als Gedanke 5. Lies weiter oder rufe done auf.
      - round: 6
        tool: record_thought
        title: Außenpolitik als Spielzeugneid
        core: "Trump betreibt keine Handelspolitik, sondern Besitzpolitik: Kanada als 51. Staat,
          Anspruch auf Öl und Arktiszugang, dazu Grönland. Das Muster ist Neid auf
          Russlands Arktisgrenzen und Gier nach 'liquid gold'. Sachs beschreibt das als
          kindliches Greifen nach fremdem Spielzeug — Außenpolitik als Aneignungsreflex,
          nicht als Interessenkalkül."
        type: ausdruck
        paragraphs:
          - 30
        evidence: '"When he sees that another person or another child has the toys that he
          wants, he goes to grab them."'
        note: Abgelegt als Gedanke 6. Lies weiter oder rufe done auf.
      - round: 7
        tool: read
        from: 37
        count: 10
        note: Absätze 37–46 von 46.
      - round: 8
        tool: record_thought
        title: Beschleuniger statt Ursache
        core: "Auf die Frage 'Ursache oder Symptom?' antwortet Sachs mit einer dritten
          Kategorie: Trump ist Beschleuniger — 'a disease that jumped on to an already
          weakened immune system'. Die Metapher leistet mehr als die Dichotomie: Sie
          erlaubt, gleichzeitig über Person und Struktur zu sprechen, ohne die Schuld zu
          verteilen. Der Körper war krank; der Erreger ist neu."
        type: unterscheidung
        paragraphs:
          - 37
          - 38
        evidence: '"He is a disease that jumped on to an already weakened immune system in the
          U.S."'
        note: Abgelegt als Gedanke 7. Lies weiter oder rufe done auf.
      - round: 8
        tool: record_thought
        title: Zwei Konstruktionsfehler mit Datum
        core: "Sachs nennt zwei langfristige Zerstörungsprozesse: den militärisch-industriellen
          Komplex seit den späten 1940ern (heute inklusive Silicon Valley, Finanzfirmen,
          CIA) und die von Lewis Powell geplante Korruption des Wahlprozesses bis
          Citizens United. Beide sind nicht Unfälle, sondern 'by design'. Damit ist die
          amerikanische Krise keine Führungsschwäche, sondern ein Konstruktionsfehler
          mit Datum."
        type: verbindung
        paragraphs:
          - 39
          - 40
        evidence: '"unaccountable, secretive power of the military industrial complex and
          corruption of the legislative branch [...] are the two things that destroyed
          the United States"'
        note: Abgelegt als Gedanke 8. Lies weiter oder rufe done auf.
      - round: 8
        tool: record_thought
        title: Die Mondale-Lektion
        core: "Sachs datiert die Ursache der 40-Billionen-Schuld auf eine Wahl von 1984: Mondale
          sagte die Wahrheit über Steuererhöhungen und verlor 49 Staaten. Die Lehre war
          nicht ökonomisch, sondern rhetorisch — 'never say you're going to raise
          taxes'. Seither gibt es nur Steuersenkungen, weil Politik als PR und als
          Fundraising zugleich funktioniert. Die Schulden sind also das Produkt einer
          Lektion über Redeverbote."
        type: begriff
        paragraphs:
          - 41
          - 42
        evidence: "\"The lesson of the politicians from then on was never say you're going to
          raise taxes.\""
        note: Abgelegt als Gedanke 9. Lies weiter oder rufe done auf.
      - round: 8
        tool: record_thought
        title: Die leere Unipolarität
        core: "Sachs' These von der 'vacuous' Unipolarität verbindet Irankrieg, Ukraine und
          Handelskrieg zu einem einzigen Muster: Die USA gehen davon aus, dass der
          Gegner nicht zurückschlägt, und werden in jedem Fall eines Besseren belehrt.
          Die Pointe ist nicht, dass Amerika schwach ist, sondern dass es seine Macht
          falsch eingeschätzt hat — und deshalb Kriege führt, die es nicht gewinnen
          kann."
        type: verbindung
        paragraphs:
          - 19
        interwoven_with:
          - 1
          - 3
        evidence: "\"The U.S. doesn't have the power it claims to have, period. That's the whole
          point.\""
        note: Abgelegt als Gedanke 10. Lies weiter oder rufe done auf.
      - round: 9
        tool: done
        note: Lesen beendet.
