        note: Abgelegt als Gedanke 48. Lies weiter oder rufe done auf.
      - round: 50
        tool: record_thought
        title: Der Größenwahn als Gewohnheit
        core: "Der 'America reigns supreme'-Glaube wird als das eigentliche Delirium benannt:
          eine imperiale Gewohnheit aus der Nachkriegszeit, die in einer Welt vieler
          Atommächte nicht mehr trägt. Die Alternative ist nicht Schwäche, sondern
