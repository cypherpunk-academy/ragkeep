      - round: 9
        tool: record_thought
        title: Nicht Marionette, sondern Genehmiger
        core: 'Sachs löst die Puppenspieler-Frage auf, indem er beide Optionen verwirft: Trump
          ist kein ferngesteuerter Akteur, sondern ein eigenständiger Urheber von
          Rechtsbrüchen, der zustimmt statt gehorcht. „Signed off on" ist der
          Schlüsselbegriff — nicht Anweisung, sondern Genehmigung. Damit wird die
          Schuldfrage individualisiert, ohne die Struktur zu leugnen.'
        type: unterscheidung
        paragraphs:
          - 54
          - 55
          - 56
          - 57
        evidence: "\"every illegal action, every illegal war, every completely bizarre scheme
          Trump has signed off on. He's not a puppet of Netanyahu. He's just an
          idiot.\""
        note: Abgelegt als Gedanke 3. Lies weiter oder rufe done auf.
      - round: 10
        tool: read
        from: 61
        count: 12
        note: Absätze 61–72 von 116.
      - round: 11
        tool: record_thought
        title: Regime Change als angemaßtes Bestimmungsrecht
        core: "Regime Change wird als Anmaßung definiert: nicht Intervention aus Notwehr,
          sondern die selbstverliehene Befugnis, darüber zu entscheiden, wer anderswo
          regiert. Der Katalog der Auslöser (Ölkonzession, Militärbasis, Bestechung,
          Durchmarschrecht) entlarvt das normative Vokabular als Deckmantel materieller
          Interessen."
        type: begriff
        paragraphs:
          - 61
          - 62
        evidence: '"the United States arrogates to itself the claimed right to decide who
          governs in other countries"'
        note: Abgelegt als Gedanke 4. Lies weiter oder rufe done auf.
      - round: 12
        tool: record_thought
        title: Der Putsch ist erst verstanden, wenn man das Personal kennt
        core: "Sachs' Erkenntnisinteresse ist methodisch: Er glaubte nicht an die öffentlich
          erzählte Variante (Tötung der Führung → Volksaufstand), sondern wartete auf
          das „inside job\" — die Frage, wer eingesetzt werden sollte. Der Putsch ist
          erst verstanden, wenn man das Personal kennt, nicht nur die Gewalt. Das ist
          eine Verschiebung von der Ereignis- zur Personalgeschichte."
        type: unterscheidung
        paragraphs:
          - 69
          - 70
          - 71
          - 72
        evidence: '"I was waiting for the inside job. Who they were going to put in place. How
          this coup was actually going to work."'
        note: Abgelegt als Gedanke 5. Lies weiter oder rufe done auf.
      - round: 13
        tool: read
        from: 73
        count: 12
        note: Absätze 73–84 von 116.
      - round: 14
        tool: record_thought
        title: Kosten global, Rechenschaft null
        core: "Die Kosten des Putsches sind global und sofort (Öl, Benzin, Handel), die
          Rechenschaft ist strukturell null. Sachs' Antwort „never\" ist keine
          Resignation, sondern eine Prognose über Anreize: Wer nicht
          rechenschaftspflichtig ist, hat keinen Grund, Transparenz zu wollen. Der
          Church Committee von 1975 erscheint als einziger historischer Moment der
          Kontrolle — 51 Jahre her."
        type: verbindung
