leitgedanke:
  text: Der Irankrieg ist ein erfundener, aus einer falsch übertragenen Vorlage kopierter Krieg, der einer jahrzehntelangen Empire-Logik folgt und dessen Atomvorwurf durch das zerstörte JCPOA widerlegt ist; weil die andere Seite nicht als Gesprächspartner gedacht wird, gibt es keinen Ausstieg, und weil Verfahren und Deliberation fehlen, führt die Zerstörung der Golfinfrastruktur über Dünger und Nahrung in eine Finanzkaskade, die niemand mehr kontrolliert.
  rationale: "Folgt aus K1–K8: erfundener Krieg, Empire-Kontinuität, Vorwand JCPOA, fehlender Off-Ramp, Partnerschaft mit Israel, ökonomische Kaskade, Verfahrensverlust."
