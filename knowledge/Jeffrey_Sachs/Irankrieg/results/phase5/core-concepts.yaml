  kernaussagen:
    - id: K1
      satz: Der Irankrieg ist kein Ergebnis einer Krise, sondern eine erfundene Entscheidung, die das venezolanische Rezept der Bestechung und des Umsturzes auf einen Fall überträgt, in dem die Machtverhältnisse nicht stimmen.
    - id: K2
      satz: Die geschlossene Straße von Hormus nimmt über Düngemittel, Petrochemie und Aluminium die Weltwirtschaft in Geiselhaft, und weil diesmal nicht der Ölfluss gestoppt, sondern die Infrastruktur zerstört wird, folgt über Erdgas, Ammoniak und Dünger eine Nahrungsmittelkrise, die in einer Kaskade von der Realwirtschaft auf die Finanzmärkte übergreift — während die Zeit gegen die Option des späteren Ausscherens arbeitet.
    - id: K3
      satz: Der Konflikt folgt einer über fünf Administrationen eingeübten Empire-Praxis, die seit dem Putsch von 1953 Souveränität als Reputationsfrage behandelt und Normverletzungen durch Wiederholung zur Norm macht.
    - id: K4
      satz: Der Irankrieg ist die konsequente Anwendung der „Clean Break“-Strategie, die Gegner eine Ebene höher bei ihren Unterstützerstaaten bekämpft, und reiht sich in eine Serie von sieben Kriegen ein, von denen sechs bereits im Chaos versunken sind.
    - id: K5
      satz: "Der Atomvorwurf ist ein Vorwand, den die eigene Geschichte widerlegt: Das 2015 einstimmig gebilligte JCPOA lieferte genau die Lösung, die heute erzwungen werden soll, während die USA einen Abtrünnigen zurückholen und Israel vollständige militärische Dominanz in Westasien will."
    - id: K6
      satz: Der fehlende Ausstieg ist kein Taktikproblem, sondern Folge eines Ausgangspunkts, der die andere Seite nicht als Gesprächspartner vorsieht; wer präventiv töten will und Gespräche ausschließt, wird zum Dauertöter und stellt Israel außerhalb von Zivilisation und Völkerrecht.
    - id: K7
      satz: "Das Verhältnis ist eine echte Partnerschaft, keine israelische Fernsteuerung: Amerikanisches Hegemonialstreben und israelische Regionaldominanz decken sich, und Trumps Beteuerung, Netanjahu tue, was er sage, macht jede israelische Fortsetzung zu einer amerikanischen."
    - id: K8
      satz: "Die eigentliche Gefahr ist nicht ein Plan, sondern die Abwesenheit von Verfahren: Wo in der Kubakrise ExComm, Geheimdienstbewertungen und Kongresskonsultation standen, gibt es heute nur entzündete Zündschnüre, Sekundenentscheidungen und ein Parlament, das seine Kriegserklärungskompetenz nach Artikel I verweigert — Katastrophen entstehen so durch Fehlkalkulation, nicht durch Prophezeiung, weshalb nicht Ideologie, sondern das Vorhandensein von Deliberation den Maßstab bildet."
core_concepts:
  - id: K1
    concept_id: 61dd9f3d-9d89-56a0-802b-c867ffd4e270
    satz: Der Irankrieg ist kein Ergebnis einer Krise, sondern eine erfundene Entscheidung, die das venezolanische Rezept der Bestechung und des Umsturzes auf einen Fall überträgt, in dem die Machtverhältnisse nicht stimmen.
    text: |-
      Jeffrey Sachs zufolge war der Irankrieg keine Reaktion auf eine Krise, sondern eine erfundene Entscheidung. Die Krise sei vollständig künstlich und willkürlich aus der Unfähigkeit der amerikanischen Führung entstanden; die Frage laute daher nicht, wie dieser Krieg zu gewinnen sei, sondern warum er überhaupt erfunden wurde. Das Ziel habe in einer Entmachtung der iranischen Regierung binnen eines Tages bestanden, mit einer von Trump eingesetzten Nachfolgeführung.

      Als Vorlage dient Sachs zufolge Venezuela: Bestechung, geheime Absprachen mit einem Vizepräsidenten, Umsturz und die Übernahme von Öleinnahmen. Dieses Muster habe Trump auf Iran übertragen in der Erwartung, mit der Tötung der Führungsspitze das Land und sein Öl in einem Zug zu gewinnen. Der Fehler liege in der Analogie. In der eigenen Hemisphäre könnten die USA als Gangster auftreten, doch Iran sei ein Land mit fast 100 Millionen Menschen in großer Entfernung, das sich nicht diktieren lasse. Sachs fasst dies als Verbrechen zusammen, das mit einer Übertragung eines lokalen Erfolgsrezepts auf einen Fall verbunden sei, in dem die Machtverhältnisse nicht stimmen.

      Daraus folgt für ihn, dass der Krieg nicht zu gewinnen ist: Die USA verfügten nicht über die Macht, die sie beanspruchen. Der Ausstieg sei gleichwohl schwer, weil es Gründe für den Krieg gegeben habe, die er als grausam, illegal und realitätsfern bezeichnet, und weil die andere Seite nicht als Verhandlungspartner gedacht sei. Eine Lösung hält er dennoch für einfach: Trump müsste den Sieg erklären und abziehen.
