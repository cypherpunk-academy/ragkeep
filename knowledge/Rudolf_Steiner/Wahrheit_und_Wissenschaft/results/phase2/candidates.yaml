candidates:
  - id: 92a9b165-fa76-52af-952f-2a6f68258b29
    title: Kant-Glaube als Hindernis
    core: 'Die Schrift versteht sich als Beitrag zur Überwindung eines „ungesunden
      Kant-Glaubens": Kants Verdienst (Aufweis der Unzugänglichkeit des „Dinges
      an sich") wird nicht bestritten, aber die Konsequenz wird bestritten — das
      Jenseits des Urgrundes sei ein Phantom, kein Ergebnis echter Untersuchung
      des Erkenntnisvermögens.'
    type: unterscheidung
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: 1-3
    evidence: „Wie aber, wenn dieses «Ding an sich» samt dem jenseitigen Urgrund der
      Dinge nur ein Phantom wäre!"
    interwoven_with: []
    occurrences:
      - source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
        segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
        paragraphs: 3-4
  - id: 81b7e386-31d3-5010-bd8d-7243c2c26ba7
    title: Das Gegebene als Durchgangsstufe
    core: Die Erfahrung, die Positivismus und Neukantianismus als das einzig Gewisse
      ausgeben, gilt hier als das Subjektivste. Das Gegebene ist nicht
      Fundament, sondern Durchgangsstufe, die im Erkenntnisakt selbst überwunden
      wird.
    type: umkehrung
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: "15"
    evidence: „Uns gilt die sogenannte Erfahrung ... gerade für das Subjektivste."
    interwoven_with: []
    occurrences:
      - source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
        segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
        paragraphs: 159-160
  - id: 4a263121-fb42-582b-adbc-9e922cbbe1f9
    title: Erkenntnistheorie als voraussetzungslose Grundwissenschaft
    core: "Erkenntnistheorie ist Fundamentalwissenschaft, weil sie das prüft, was
      alle anderen Wissenschaften ungeprüft voraussetzen: das Erkennen selbst.
      Daraus folgt die Forderung der Voraussetzungslosigkeit — und die
      Beobachtung, dass gerade in der Problemstellung selbst versteckte Annahmen
      stecken."
    type: begriff
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: "93"
    evidence: ""
