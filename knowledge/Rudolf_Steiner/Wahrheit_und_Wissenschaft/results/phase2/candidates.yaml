  - id: 575ab924-fcfd-5c04-8a5c-2a53e4eb8228
    title: Aufhebung des „für das Ich"
    core: 'Der Einwand, die Wesensbestimmung sei nur „für das Ich", verliert seinen
      Sinn: die Spaltung von Ich und Außenwelt besteht nur innerhalb des
      Gegebenen, und in der denkenden Betrachtung, die alle Gegensätze
      vereinigt, geht das abgetrennte Ich völlig unter.'
    type: umkehrung
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
