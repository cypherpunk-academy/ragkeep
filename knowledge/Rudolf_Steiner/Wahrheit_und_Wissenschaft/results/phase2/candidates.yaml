        segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
        paragraphs: "147"
  - id: e928d694-bfec-517b-9949-c3b9a418cf34
    title: Vom Erkennen aus das Bewusstsein
    core: Nicht vom Bewusstsein aus soll das Erkennen bestimmt werden, sondern vom
      Erkennen aus das Bewusstsein und das Verhältnis von Subjektivität und
      Objektivität. Bewusstsein und „Ich"-Vorstellung sind zunächst nur Teile
      des Gegebenen.
    type: umkehrung
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: "126"
