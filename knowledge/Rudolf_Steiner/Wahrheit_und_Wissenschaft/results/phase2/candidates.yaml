    occurrences: []
  - id: 6c2aba24-443c-5ff4-b870-cd5e56facb07
    title: Naiver Rationalismus
    core: 'Der Subjektivismus ist kein reiner Empirismus, sondern ein „naiver
      Rationalismus": er vertraut ungeprüft auf die Berechtigung des Denkens,
      während der naive Realismus ungeprüft auf die Objektivität des
      Wahrgenommenen vertraut. Beide sind naiv, nur in verschiedenen Vermögen.'
    type: begriff
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: "115"
    evidence: ""
    interwoven_with: []
    occurrences: []
  - id: 3b2d0ab3-bdda-5747-8517-c6b0e2fb4ff4
    title: Naiv und kritisch
    core: Naiv ist ein Tun, das in der Tätigkeit selbst aufgeht, ohne deren
      Gesetzmäßigkeit zu kennen; kritisch ist ein Verhalten, das sich der
      Gesetze der eigenen Tätigkeit bemächtigt, um Sicherheit und Grenzen zu
      kennen. Erkenntnistheorie muss kritisch sein, weil ihr Objekt das Erkennen
      selbst ist — sie ist „Denken über das Denken".
    type: unterscheidung
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: "115"
    evidence: ""
    interwoven_with: []
    occurrences: []
  - id: c1502b9b-1337-5aee-8bf8-ea13bfe3caaa
    title: Die künstliche Grenze
    core: "Die Grenze zwischen Gegebenem und Erkanntem fällt mit keinem Moment der
      Entwicklung zusammen; sie muss künstlich gezogen werden — und zwar auf
      jeder Entwicklungsstufe. Hartmanns Einwand, man habe keine Erfahrung vom
      kindlichen Bewusstsein, verfehlt den Punkt: es geht nicht um
      Rekonstruktion, sondern um Ausscheidung des durch Erkennen Hinzugefügten."
    type: unterscheidung
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: "118"
    evidence: ""
    interwoven_with: []
    occurrences: []
  - id: 9befd586-26d4-5bf7-b1a6-25da89668b5e
    title: Zweckmäßigkeit statt Wahrheit
    core: "Die begrifflichen Erwägungen, die zum Anfang hinführen, haben keinen
      Erkenntniswert, sondern nur Zweckmäßigkeit: sie sind Wegweiser, keine
      Aussagen über das Gegebene. Für sie gilt nicht Wahrheit oder Irrtum,
      sondern nur Zweckmäßigkeit oder Unzweckmäßigkeit."
    type: unterscheidung
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: "119"
    evidence: ""
    interwoven_with: []
    occurrences: []
  - id: 467e7222-290c-59e0-acef-1254af5b501f
    title: Irrtum liegt im Erkenntnisakt
    core: "Irrtum kann erkenntnistheoretisch nur innerhalb des Erkenntnisaktes
      liegen. Die Sinnestäuschung ist kein Irrtum: dass der Mond am Horizont
      größer erscheint, ist eine naturgesetzlich begründete Tatsache; Irrtum
      entsteht erst in der denkenden Deutung."
    type: umkehrung
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: 120-121
    evidence: ""
    interwoven_with: []
    occurrences: []
  - id: 9f51919c-a327-5d45-a5dd-c0fe4fa950c7
    title: Die sich selbst aufhebende Forderung
    core: "Die Forderung nach einem rein Gegebenen hebt sich teilweise selbst auf:
      es muss sich beim strengen Festhalten am Bloß-Gegebenen zeigen, dass nicht
      alles ein solches ist. Sonst bliebe nur Beschreiben von außen, nie
      Begreifen — die Begriffe hätten keinen innerlichen Bezug."
    type: umkehrung
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: 127-129
    evidence: ""
    interwoven_with: []
    occurrences: []
  - id: 7b073f3c-5dba-59c6-aad5-e46a84f83bbe
    title: Das Postulat des Ansatzpunktes
    core: 'Der erste Schritt der Erkenntnistheorie ist ein Postulat, kein Urteil:
      der Weltinhalt muss einen Punkt enthalten, an dem die Erkenntnistätigkeit
      nicht im Leeren schwebt. Ein solcher „Machtspruch" behauptet nichts über
      das Gegebene, er sagt nur, was gelten muss, wenn Erkennen erklärbar sein
      soll.'
    type: begriff
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: 130-131
    evidence: ""
    interwoven_with: []
    occurrences: []
  - id: 452a6acf-d6d1-54fb-bbff-ce4830a652ed
    title: Intellektuelle Anschauung
    core: Begriffe und Ideen sind das einzige, was uns unmittelbar als zugleich
      hervorgebracht und gegeben bewusst ist — „intellektuelle Anschauung".
      Sinnesqualitäten scheitern an der Forderung, weil ihr Hervorgebrachtsein
      nur durch physikalisch-physiologische Schlüsse bekannt wird, nicht
      unmittelbar.
    type: begriff
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: "133"
    evidence: '„nur bei Begriffen und Ideen tritt noch das Umgekehrte ein: wir
      müssen sie hervorbringen, wenn wir sie erleben wollen."'
    interwoven_with: []
    occurrences: []
  - id: 3b68860e-9875-5a13-9c50-40f83ab95909
    title: Logik als Beschreibung
    core: Das Denken ist ein Tun, das seinen Inhalt im Moment des Erkennens selbst
      hervorbringt; soweit der Inhalt aus dem Denken allein fließt, ist er
      unmittelbar gegeben und bedarf keines Beweises. Logik ist daher
      Beschreibung der Denkformen, nicht beweisende Wissenschaft — beim Denken
      hört alles Beweisen auf.
    type: begriff
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: "137"
    evidence: ""
    interwoven_with: []
    occurrences: []
  - id: 0ac29e87-fcf7-5a17-9c7f-5af3ce05a30d
    title: Denken als formendes, nicht bestimmendes Prinzip
    core: "Das Denken bestimmt nichts von sich aus über die Weltinhalte: es hebt
      Einzelheiten heraus, stellt Bezüge her und wartet ab, was sich daraus von
      selbst ergibt. Der Inhalt des Naturgesetzes resultiert aus dem Gegebenen;
      dem Denken kommt nur die formale Leistung zu, die Gelegenheit
      herbeizuführen."
    type: unterscheidung
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: 137,139-140
    evidence: ""
    interwoven_with: []
    occurrences: []
  - id: 4b5a441d-4ae1-5a5a-8824-76cc521825ca
    title: Kausalität aus inhaltlicher Bedeutung, nicht Gewohnheit
    core: "Hume leitet Ursache und Wirkung aus der Gewohnheit zeitlicher Folge ab;
      dagegen: der Kausalzusammenhang wird nicht nach der zeitlichen Folge,
      sondern nach der inhaltlichen Bedeutung der als Ursache und Wirkung
      bezeichneten Teile bestimmt. Tägliches Zusammentreffen am Haustor erzeugt
      keine Kausalität."
    type: unterscheidung
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: "141"
    evidence: ""
    interwoven_with: []
    occurrences: []
  - id: 8f4969a6-6adf-5953-8781-f26bcbe73829
    title: "Bewusstsein: Verbindung als Tat"
    core: Beim menschlichen Bewusstsein ist die Verbindung von Idee und Gegebenem
      das Abgeleitete, die Trennung das Erste; bei allen anderen Objekten ist
      die Verbindung das Ursprüngliche und die Trennung nur eine künstliche, für
      die Erkenntnis gemachte. Deshalb spaltet sich für das Bewusstsein die
      Wirklichkeit in zwei Teile, und es gelangt nur durch eigene Tätigkeit zur
      vollen Wirklichkeit.
    type: unterscheidung
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: "149"
    evidence: ""
    interwoven_with: []
    occurrences: []
  - id: 30fac5b0-33b3-5ab8-ad0e-2d8e2e704899
    title: Fichtes Tathandlung ohne Inhalt
    core: "Fichtes Ich vollzieht eine absolute Tathandlung, aber es fehlt der Inhalt
      des Tuns: weil er den Begriff der Erkenntnis nicht aufstellte, findet er
      keinen Fortgang von der Tathandlung zu weiteren Bestimmungen und verweist
      auf den praktischen Teil. Damit vernichtet er das Erkennen — es kommt
      nicht auf das freie, sondern auf das erkennende Ich an."
    type: unterscheidung
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: "150"
    evidence: ""
    interwoven_with: []
    occurrences: []
  - id: c02d098f-abc9-5cc7-9e7b-c440f03cdcb5
    title: Keine Farbe aus dem Ich
    core: 'Kein Idealismus kann die Form des unmittelbar Gegebenen aus dem Ich
      ableiten: selbst bei vollständiger Farbenskala ließe sich keine einzige
      Nuance aus dem Ich ergänzen. Das Gegebene kann nur gegeben, nie
      konstruiert werden — das „Was" des Gegebenen wird durch das Ich gesetzt,
      aber nicht ohne dasselbe.'
    type: umkehrung
