        segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
        paragraphs: 105,116
  - id: 1834a00e-a45e-55fa-bdb8-e3607c83af38
    title: Die Problemstellung entscheidet
    core: "Nicht die Antworten, sondern die Fragestellungen entscheiden über den
      Erfolg einer Wissenschaft. Falsch gestellte Probleme erzeugen Irrtümer
      ganzer Zeitalter — Beispiele: rudimentäre Organe vor dem biogenetischen
      Grundgesetz, die Zirbeldrüse, die Physik vor dem Wärmeäquivalent. Also
      muss auch die Erkenntnistheorie zuerst ihre Grundfrage richtig formen."
    type: verbindung
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: 93-94
