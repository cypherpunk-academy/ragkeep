        paragraphs: 139,142-143
  - id: a99bff76-f86b-57ad-9425-e42154cef353
    title: Fichtes dunkles Gefühl
    core: Fichtes „Handlungsart der Intelligenz" ist, in klare Begriffe gefasst, die
      im Bewusstsein sich vollziehende Verwirklichung der Idee des Erkennens.
      Fichte fühlte dies lebhaft, konnte es aber nicht begrifflich fassen —
      darin liegt der Grundfehler seiner Wissenschaftslehre.
    type: ausdruck
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: "149"
