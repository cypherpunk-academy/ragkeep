        paragraphs: 96-99
  - id: 02599861-728b-56f1-bea8-e788bda7645d
    title: Selbstaufhebung des transzendentalen Idealismus
    core: "Der transzendentale Idealismus widerlegt den naiven Realismus mit dessen
      eigenen Mitteln: er setzt die Realität der Außenwelt voraus, um zu zeigen,
      dass sie unerkennbar ist. Damit ist sein Resultat nicht aus einer gültigen
      Prämisse erwiesen — die Widerlegung hebt sich selbst auf."
    type: umkehrung
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: 113-114
    evidence: „Der transzendentale Idealismus erweist seine Richtigkeit, indem er
      mit den Mitteln des naiven Realismus, dessen Widerlegung er anstrebt,
      operiert."
    interwoven_with: []
    occurrences:
      - source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
        segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
        paragraphs: "162"
  - id: a2688556-837f-5d63-bee7-96550fd3af80
    title: Das unmittelbar Gegebene
    core: 'Das unmittelbar Gegebene ist ein zusammenhangloses, ungegliedertes
      Weltbild: nichts ist unterschieden, nichts bezogen, nichts bestimmt; kein
      Gegenstand ist wichtiger als ein anderer. Substanz, Akzidenz, Ursache,
      Wirkung, Materie und Geist sind noch nicht geschaffen — auch nicht
      „subjektiv" oder „objektiv".'
    type: begriff
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: "117"
    evidence: ""
    interwoven_with: []
    occurrences:
