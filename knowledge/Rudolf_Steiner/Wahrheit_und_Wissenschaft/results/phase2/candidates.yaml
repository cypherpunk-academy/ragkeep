        paragraphs: 169-172
  - id: a0aab575-96c1-5aee-96a6-aacf45d195f0
    title: Objektiver Idealismus vs. absoluter Idealismus
    core: Der objektive Idealismus unterscheidet sich vom Hegelschen absoluten
      Idealismus dadurch, dass der Grund der Spaltung von Sein und Begriff im
      Erkenntnissubjekt gesucht und die Vermittlung im subjektiven
      Erkenntnisprozess, nicht in einer objektiven Weltdialektik gesehen wird.
    type: unterscheidung
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: "15"
    evidence: ""
    interwoven_with: []
    occurrences: []
  - id: f092d642-e3db-52e2-9d6d-53af187a9e37
    title: Auch das Apriori wird erfahren
    core: Auch das Apriori muss uns einmal als individuelles Erlebnis, als
      Erfahrung, zuteilwerden — selbst mathematische Urteile werden in einzelnen
      Fällen erfahren. Die Notwendigkeit des Inhalts sichert nicht den Zugang zu
      ihm; dieser bleibt an das Erleben gebunden.
    type: umkehrung
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: "97"
    evidence: ""
