  - id: 12d36fea-a2d4-5bf2-b0ed-eb0243d304f4
    title: Die Regel kann nicht aus dem Objekt kommen
    core: 'Kants Satz „Begriffe ohne Anschauungen sind leer" macht die Bestimmung
      des Gegebenen durch Begriffe undenkbar: die Regel, nach der a und b
      verknüpft werden, kann nicht aus den Objekten genommen werden, weil deren
      Bestimmungen erst durch die Regel gewonnen werden sollen. Sie geht ganz in
      der rein begrifflichen Entität auf.'
    type: umkehrung
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: "133"
