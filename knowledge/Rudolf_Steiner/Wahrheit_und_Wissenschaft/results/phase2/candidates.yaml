  - id: 0569ae93-fe56-52ca-b1d5-f9e89ddce38f
    title: Sittlichkeit als durchdrungene Gesetzmäßigkeit
    core: "Nur wo wir die Gesetze unseres Handelns als Wissen besitzen, ist das
      Handeln sittlich und frei; die Verwandlung des unfreien in das freie
      Gebiet ist die Aufgabe jeder individuellen Entwicklung wie der ganzen
      Menschheit. Das wichtigste Problem allen Denkens: den Menschen als auf
      sich selbst gegründete, freie Persönlichkeit zu begreifen."
    type: begriff
