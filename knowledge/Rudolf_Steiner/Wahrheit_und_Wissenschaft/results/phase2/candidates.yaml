        segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
        paragraphs: "152"
  - id: 00ad257d-c13a-5b56-a576-3b8fa27eab2f
    title: Idealismus oder Dogmatismus als Wahl
    core: "Fichtes Wahl zwischen Idealismus und Dogmatismus bleibt dem Belieben des
      Ich überlassen — sie wäre erst möglich, wenn das Ich etwas durch und durch
      Inhaltsvolles findet: die Welt des Denkens. Das Gegebene durch das Denken
      bestimmen heißt Erkennen; damit gewinnt Fichtes leere Ich-Tätigkeit erst
      Hand und Fuß."
    type: verbindung
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: 155-156
    evidence: ""
    interwoven_with: []
    occurrences:
      - source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
        segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
        paragraphs: "162"
  - id: 54741cb4-def7-5b7d-ad76-64f226d45653
    title: Der Weltengrund erscheint nur im Wissen
    core: "Der Weltengrund kommt nie in der objektiven Realität als solcher zum
      Dasein, sondern nur im Wissen: es gehört zum Beruf des Menschen, die sonst
      alles beherrschenden, aber nie erscheinenden Grundgesetze in die
      erscheinende Wirklichkeit zu versetzen. Erkennen ist ein stetiges
      Hineinleben in den Weltengrund."
    type: begriff
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: 166-167
