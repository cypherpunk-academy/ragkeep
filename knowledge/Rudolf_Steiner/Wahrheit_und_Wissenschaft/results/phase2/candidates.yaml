        paragraphs: 153-154
  - id: 8b5c3590-8c9e-588f-8a10-95797b7d7a24
    title: Setzen statt Feststellen
    core: 'Fichtes Ableitung vom Satz a = a zum absoluten „Ich bin" ist eine
      pädagogische Hinführung, keine Erkenntnis: das Setzen wird für absolut
      erklärt, weil das Gesetzte bedingt ist. Das Ich gehört aber der
      Wirklichkeit an, und da ist das Vorhandensein dieser oder jener Kategorie
      im Gegebenen festzustellen.'
    type: umkehrung
    source_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    segment_id: Rudolf_Steiner_Wahrheit_und_Wissenschaft_3
    paragraphs: 150-151
